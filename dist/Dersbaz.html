<script>
/* js/quiz.js */
'use strict';
/* =========================================================
   Soru Arenası — oyun tabanlı çoktan seçmeli
   ========================================================= */
const LETTERS='ABCDE';
const subjOf=q=>q.subject||'kimya';
function subjectQuestions(){const id=App.subject().id;return Store.questions().filter(q=>subjOf(q)===id);}
function topicIcon(t=''){
  t=t.toLocaleLowerCase('tr');
  if(t.includes('kesir')) return '🍕';
  if(t.includes('zaman')||t.includes('saat')) return '⏰';
  if(t.includes('şekil')||t.includes('geometri')) return '🔷';
  if(t.includes('fonksiyon')) return '📈';
  if(t.includes('denklem')||t.includes('eşitsizlik')) return '⚖️';
  if(t.includes('üslü')||t.includes('köklü')) return '√';
  if(t.includes('olasılık')) return '🎲';
  if(t.includes('sayı')||t.includes('işlem')) return '🔢';
  if(t.includes('orbital')||t.includes('dizilim')) return '🌀';
  if(t.includes('atom')||t.includes('periyod')) return '⚛️';
  if(t.includes('hal')) return '💨';
  if(t.includes('etkileşim')||t.includes('bağ')) return '🔗';
  if(t.includes('tepkime')) return '🔥';
  if(t.includes('asit')||t.includes('baz')) return '🧪';
  if(t.includes('güvenli')||t.includes('laboratuvar')) return '🥽';
  if(t.includes('sürdürül')||t.includes('çevre')) return '♻️';
  if(t.includes('madde')||t.includes('karışım')) return '🧊';
  return '📘';
}

const Quiz = (()=>{
  let st=null, timerId=null, keyHandler=null;
  const MODES={
    classic:{name:'Klasik',icon:'⏱️',desc:'30 saniye · 3 can · kombo puanı',time:30,lives:3,mult:1},
    practice:{name:'Antrenman',icon:'🧘',desc:'Süre yok · can yok · rahatça öğren',time:0,lives:0,mult:.5},
    sudden:{name:'Ani Ölüm',icon:'💀',desc:'20 saniye · tek can · 2× puan',time:20,lives:1,mult:2},
  };
  let setup={topic:'',grade:0,count:10,mode:'classic'};

  /* ---------- Soru HTML (oyun + önizleme ortak) ---------- */
  function buildQuestionHTML(q,{mascot=true}={}){
    const n=q.options.length;
    const d=clamp(q.difficulty||1,1,3);
    const diff='★'.repeat(d)+'<i>★</i>'.repeat(3-d);
    const stemCap=q.stem?Visual.caption(q.stem):'';
    const stem=(q.stem&&q.stem.type&&q.stem.type!=='none')?`<div class="q-stem">${Visual.render(q.stem)}${stemCap?`<div class="stem-cap">${stemCap}</div>`:''}</div>`:'';
    const img=q.image?`<div class="q-stem"><img src="${esc(q.image)}" alt="soru görseli"></div>`:'';
    const longText=q.options.every(o=>o.type==='text')&&q.options.some(o=>String(o.value||'').replace(/[{}*]/g,'').length>30);
    const opts=q.options.map((o,i)=>{
      const cap=Visual.caption(o);
      return `<button class="opt t-${o.type}" style="--c:var(--o${LETTERS[i]})" data-i="${i}" aria-label="Şık ${LETTERS[i]}">
        <span class="letter">${LETTERS[i]}</span>
        <div class="vis">${Visual.render(o)}</div>
        ${cap?`<div class="cap">${cap}</div>`:''}
        <span class="mark"></span>
      </button>`;
    }).join('');
    return `<div class="q-stage">
        ${mascot?`<div class="mascot-wrap">${Mascot.svg()}<div class="speech" id="speech"></div></div>`:''}
        <div class="q-card">
          <div class="q-meta"><span class="tag">${topicIcon(q.topic)} ${esc(q.topic||'Genel')}</span><span class="tag">${esc(q.grade||9)}. sınıf</span><span class="tag diff">${diff}</span></div>
          <div class="q-text">${richText(q.text)}</div>${img}${stem}
        </div>
      </div>
      <div class="opts n${n} ${longText?'long-text':''}">${opts}</div>`;
  }

  /* ---------- Kurulum ekranı ---------- */
  function mountSetup(app){
    cleanup();
    const qs=subjectQuestions();const S=App.subject();
    if(setup.subject!==S.id){setup.subject=S.id;setup.topic='';setup.grade=0;}
    const topics=[...new Set(qs.map(q=>q.topic))];
    const cnt=t=>qs.filter(q=>!t||q.topic===t).length;
    app.innerHTML=`<section class="screen setup">
      <h1 class="screen-title">🎯 Soru Arenası</h1>
      <p class="sub">Konunu seç, modunu belirle ve arenaya çık! Doğru cevaplarla kombo yap, puanları topla.</p>
      <div class="panel"><h3>📚 Konu</h3><div class="chips" data-g="topic">
        <button class="chip" data-v="">🌈 Tüm Konular <small>${qs.length}</small></button>
        ${topics.map(t=>`<button class="chip" data-v="${esc(t)}">${topicIcon(t)} ${esc(t)} <small>${cnt(t)}</small></button>`).join('')}
      </div></div>
      <div class="panel" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">
        <div><h3>🎓 Sınıf</h3><div class="chips" data-g="grade">
          <button class="chip" data-v="0">Hepsi</button>${S.grades.filter(g=>qs.some(q=>+q.grade===g)).map(g=>`<button class="chip" data-v="${g}">${g}. sınıf</button>`).join('')}
        </div></div>
        <div><h3>🔢 Soru sayısı</h3><div class="chips" data-g="count">
          ${[5,10,15,0].map(c=>`<button class="chip" data-v="${c}">${c||'Hepsi'}</button>`).join('')}
        </div></div>
      </div>
      <div class="panel"><h3>🎮 Oyun modu</h3><div class="mode-pick">
        ${Object.entries(MODES).map(([k,m])=>`<button class="mode-card" data-mode="${k}"><div class="mi">${m.icon}</div><h4>${m.name}</h4><p>${m.desc}</p></button>`).join('')}
      </div></div>
      <div class="go-row"><button class="btn btn-big btn-good" id="go">ARENAYA GİR ▶</button></div>
    </section>`;
    const sync=()=>{
      $$('.chips',app).forEach(g=>{const key=g.dataset.g;$$('.chip',g).forEach(c=>c.classList.toggle('active',String(setup[key])===c.dataset.v));});
      $$('.mode-card',app).forEach(c=>c.classList.toggle('active',c.dataset.mode===setup.mode));
    };
    if(setup.topic&&!topics.includes(setup.topic)) setup.topic='';
    sync();
    $$('.chips',app).forEach(g=>g.addEventListener('click',e=>{
      const c=e.target.closest('.chip');if(!c) return;
      const key=g.dataset.g;setup[key]=key==='topic'?c.dataset.v:+c.dataset.v;FX.sfx.click();sync();
    }));
    $$('.mode-card',app).forEach(c=>c.onclick=()=>{setup.mode=c.dataset.mode;FX.sfx.click();sync();});
    $('#go',app).onclick=()=>start(app);
  }

  /* ---------- Oyun ---------- */
  function start(app){
    let pool=subjectQuestions().filter(q=>(!setup.topic||q.topic===setup.topic)&&(!setup.grade||+q.grade===setup.grade));
    if(!pool.length){UI.toast('Bu seçimde soru yok. Başka bir konu/sınıf seç ya da öğretmen panelinden soru ekle.','bad');return;}
    pool=shuffle(pool);
    if(setup.count) pool=pool.slice(0,setup.count);
    const m=MODES[setup.mode];
    st={app,qs:pool,i:0,score:0,lives:m.lives,maxLives:m.lives,mode:setup.mode,m,streak:0,maxStreak:0,correct:0,results:[],wrong:[],
      jokers:{fifty:true,hint:true,time:!!m.time},locked:false,timeLeft:m.time};
    FX.sfx.pop();
    keyHandler=onKey;document.addEventListener('keydown',keyHandler);
    renderQuestion();
  }
  function heartsHTML(){
    if(!st.maxLives) return '<span title="Antrenman modunda can yok">♾️</span>';
    let h='';for(let i=0;i<st.maxLives;i++) h+=`<span class="heart ${i>=st.lives?'lost':''}" data-h="${i}">${I('heart')}</span>`;
    return h;
  }
  function renderQuestion(){
    const q=st.qs[st.i];
    st.locked=false;st.timeLeft=st.m.time;
    const dots=st.qs.map((_,k)=>`<i class="${k===st.i?'cur':st.results[k]===true?'ok':st.results[k]===false?'no':''}"></i>`).join('');
    const C=2*Math.PI*34;
    st.app.innerHTML=`<section class="screen quiz">
      <div class="q-hud">
        <div class="qh-left"><div class="q-progress">${dots}</div><div class="q-count">Soru ${st.i+1} / ${st.qs.length}</div></div>
        <div class="qh-mid"><div class="timer ${st.m.time?'':'off'}" id="timer"><svg viewBox="0 0 78 78"><circle class="bgc" cx="39" cy="39" r="34"/><circle class="fgc" id="tring" cx="39" cy="39" r="34" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><span id="tsec">${st.m.time||'∞'}</span></div></div>
        <div class="qh-right"><div class="combo ${st.streak>=3?'hot':''}" id="combo">${st.streak>=2?'🔥×'+st.streak:''}</div><div class="lives" id="lives">${heartsHTML()}</div><div class="score-box" id="scorebox"><span>PUAN</span><b id="score">${st.score}</b></div></div>
      </div>
      ${buildQuestionHTML(q)}
      <div class="jokers">
        <button class="btn btn-sm joker ${st.jokers.fifty?'':'used'}" data-j="fifty">✂️ Yarı Yarıya</button>
        <button class="btn btn-sm joker ${st.jokers.hint?'':'used'}" data-j="hint">💡 ${App.subject().mascot}'dan İpucu</button>
        ${st.m.time?`<button class="btn btn-sm joker ${st.jokers.time?'':'used'}" data-j="time">⏳ +15 sn</button>`:''}
      </div>
      <div class="kb-hint">Klavye: <span class="kbd">A</span>–<span class="kbd">E</span> veya <span class="kbd">1</span>–<span class="kbd">5</span> ile seç · <span class="kbd">Enter</span> devam</div>
    </section>
    <div class="feedback" id="feedback"></div>`;
    $$('.opt',st.app).forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    $$('.joker',st.app).forEach(b=>b.onclick=()=>useJoker(b.dataset.j,b));
    if(st.m.time) startTimer();
    setTimeout(()=>{if(st&&st.i===0&&!st.locked) Mascot.say('Hadi başlayalım! Takılırsan 💡 ipucu jokerini kullanabilirsin.',3500);},700);
  }
  function startTimer(){
    stopTimer();
    const ring=$('#tring'),sec=$('#tsec'),box=$('#timer');
    const C=2*Math.PI*34;let lastWhole=Math.ceil(st.timeLeft);
    let last=performance.now();
    timerId=setInterval(()=>{
      if(!st||st.locked) return;
      const now=performance.now();st.timeLeft-=(now-last)/1000;last=now;
      const t=Math.max(0,st.timeLeft);
      ring.style.strokeDashoffset=String(C*(1-t/st.m.time));
      const whole=Math.ceil(t);sec.textContent=whole;
      box.classList.toggle('warn',t<=5);
      if(whole!==lastWhole&&whole<=5&&whole>0) FX.sfx.tick();
      lastWhole=whole;
      if(t<=0) answer(-1,true);
    },100);
  }
  function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

  function useJoker(j,btn){
    if(!st||st.locked||!st.jokers[j]) return;
    const q=st.qs[st.i];
    st.jokers[j]=false;btn.classList.add('used');FX.sfx.pop();
    if(j==='fifty'){
      const n=q.options.length;const remove=n>=4?2:n===3?1:0;
      const wrongs=shuffle(q.options.map((_,i)=>i).filter(i=>i!==q.answer)).slice(0,remove);
      wrongs.forEach(i=>{const el=$(`.opt[data-i="${i}"]`);el.classList.add('eliminated');FX.burst(FX.centerOf(el).x,FX.centerOf(el).y,14,['#94a3b8','#64748b']);});
      Mascot.say('✂️ İki yanlış şıkkı laboratuvardan kovdum!');
    } else if(j==='hint'){
      Mascot.set('think');
      Mascot.say('💡 '+(q.hint?richText(q.hint):'Seçenekleri dikkatlice karşılaştır; anahtar kelimeyi bul!'),7000);
    } else if(j==='time'){
      st.timeLeft+=15;FX.floatText(FX.centerOf($('#timer')).x,FX.centerOf($('#timer')).y,'+15 sn','#22d3ee');
    }
  }

  function answer(idx,timedOut=false){
    if(!st||st.locked) return;
    st.locked=true;stopTimer();
    const q=st.qs[st.i];
    const ok=idx===q.answer;
    const cards=$$('.opt',st.app);
    cards.forEach(c=>c.classList.add('locked'));
    const picked=cards[idx];
    st.results[st.i]=ok;
    if(ok){
      st.streak++;st.maxStreak=Math.max(st.maxStreak,st.streak);st.correct++;
      const diffMul=[1,1,1.5,2][clamp(q.difficulty||1,1,3)];
      const timeBonus=st.m.time?Math.round(Math.max(0,st.timeLeft)*4):0;
      const comboMul=1+Math.min(st.streak-1,5)*.25;
      const pts=Math.round((100*diffMul+timeBonus)*comboMul*st.m.mult);
      st.score+=pts;
      picked.classList.add('correct');picked.querySelector('.mark').textContent='✓';
      cards.forEach(c=>{if(c!==picked) c.classList.add('dim');});
      FX.sfx.correct();FX.celebrate(picked);
      const c=FX.centerOf(picked);FX.floatText(c.x,c.y-40,'+'+pts,'#fbbf24');
      FX.banner(['DOĞRU!','HARİKA!','SÜPER!','MÜKEMMEL!','BRAVO!'][Math.floor(Math.random()*5)],'good');
      Mascot.set('happy');
      const sb=$('#scorebox');sb.classList.remove('bump');void sb.offsetWidth;sb.classList.add('bump');
      $('#score').textContent=st.score;
      const combo=$('#combo');combo.textContent=st.streak>=2?'🔥×'+st.streak:'';combo.classList.toggle('hot',st.streak>=3);
      if(st.streak>=3){setTimeout(()=>{FX.sfx.combo();FX.banner(st.streak+'× KOMBO!','gold','small');},450);}
      Game.recordAnswer(true,st.streak);
    } else {
      st.streak=0;
      if(picked){picked.classList.add('wrong');picked.querySelector('.mark').textContent='✗';}
      const right=cards[q.answer];if(right){right.classList.add('reveal');right.querySelector('.mark').textContent='✓';}
      cards.forEach(c=>{if(c!==picked&&c!==right) c.classList.add('dim');});
      FX.sfx.wrong();FX.shake();FX.flash();
      FX.banner(timedOut?'SÜRE BİTTİ!':'YANLIŞ!','bad');
      Mascot.set('sad');
      if(st.maxLives){
        st.lives--;
        const h=$(`.heart[data-h="${st.lives}"]`);if(h) h.classList.add('breaking');
      }
      $('#combo').textContent='';
      st.wrong.push({q,picked:idx});
      Game.recordAnswer(false,0);
    }
    setTimeout(()=>showFeedback(ok,q,timedOut),950);
  }
  function showFeedback(ok,q,timedOut){
    if(!st) return;
    const fb=$('#feedback');
    const last=st.i>=st.qs.length-1||(st.maxLives&&st.lives<=0);
    const head=ok?'✅ Doğru cevap!':(timedOut?'⏰ Süre doldu!':'❌ Yanlış cevap');
    fb.className='feedback '+(ok?'good':'bad');
    fb.innerHTML=`<div class="fb-head">${head} <span class="muted" style="font-size:16px;font-family:var(--font-b)">${ok?'':'Doğru şık: <b style="color:#4ade80">'+LETTERS[q.answer]+'</b>'}</span></div>
      <div class="fb-body">${q.explanation?richText(q.explanation):'Açıklama eklenmemiş.'}</div>
      <div class="fb-actions"><span class="muted">${st.maxLives&&st.lives<=0?'💔 Canın bitti!':''}</span><button class="btn btn-big ${ok?'btn-good':'btn-primary'}" id="next">${last?'SONUÇLARI GÖR 🏁':'DEVAM ▶'}</button></div>`;
    requestAnimationFrame(()=>fb.classList.add('show'));
    $('#next').onclick=next;
    $('#next').focus({preventScroll:true});
  }
  function next(){
    if(!st) return;
    FX.sfx.click();
    if(st.i>=st.qs.length-1||(st.maxLives&&st.lives<=0)) return finish();
    st.i++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
  }
  function onKey(e){
    if(!st) return;
    if(e.target&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    const fb=$('#feedback');
    if(fb&&fb.classList.contains('show')){if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}return;}
    if(st.locked) return;
    const k=e.key.toUpperCase();
    let idx=LETTERS.indexOf(k);
    if(idx<0&&/^[1-5]$/.test(e.key)) idx=+e.key-1;
    const q=st.qs[st.i];
    if(idx>=0&&idx<q.options.length){
      const el=$(`.opt[data-i="${idx}"]`);
      if(el&&!el.classList.contains('eliminated')) answer(idx);
    }
  }

  /* ---------- Sonuç ---------- */
  function finish(){
    stopTimer();
    const total=st.qs.length, answered=st.results.filter(r=>r!==undefined).length;
    const ratio=st.correct/total;
    const stars=ratio>=.9?3:ratio>=.6?2:ratio>0.3?1:0;
    const xp=st.correct*10+Math.floor(st.score/25)+stars*10;
    const res=Game.finishQuiz({score:st.score,correct:st.correct,total,answered,maxStreak:st.maxStreak,perfect:st.correct===total&&total>=5,xp});
    const app=st.app;
    const wrong=st.wrong;
    const titles=['Tekrar deneyelim! 💪','İyi başlangıç! 👍','Çok iyi! 🎉','Efsane! 🏆'];
    app.innerHTML=`<section class="screen result">
      <div style="display:flex;justify-content:center">${Mascot.svg(stars>=2?'happy':stars===0?'sad':'think')}</div>
      <h1 class="screen-title" style="justify-content:center">${titles[stars]}</h1>
      <div class="stars">${[0,1,2].map(i=>`<span class="star" data-s="${i}">⭐</span>`).join('')}</div>
      <div class="big-score" id="bigscore">0</div>
      <div class="muted" style="font-weight:800">${res.newBest?'🎉 YENİ REKOR!':'En yüksek puan: '+res.best}</div>
      <div class="stat-tiles">
        <div class="stat"><b style="color:#4ade80">${st.correct}</b><span>Doğru</span></div>
        <div class="stat"><b style="color:#f87171">${answered-st.correct}</b><span>Yanlış</span></div>
        <div class="stat"><b style="color:#fb923c">${st.maxStreak}</b><span>En uzun kombo</span></div>
        <div class="stat"><b style="color:var(--gold)">+${xp}</b><span>Deneyim puanı (XP)</span></div>
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-big btn-good" id="again">🔁 Tekrar Oyna</button>
        <a class="btn btn-big btn-ghost" href="#/menu">🏠 Menü</a>
      </div>
      ${wrong.length?`<div class="review"><h2>📖 Hatalarından öğren</h2>${wrong.map(w=>{
        const o=w.q.options[w.q.answer];
        return `<div class="review-item"><div class="mini">${Visual.render(o)}<div class="cap" style="font-size:12px;font-weight:800">${Visual.caption(o)}</div></div>
          <div><h4>${richText(w.q.text)}</h4><p><b style="color:#4ade80">Doğru cevap: ${LETTERS[w.q.answer]}</b>${w.picked>=0?` · Senin cevabın: ${LETTERS[w.picked]}`:' · Süre doldu'}</p><p style="margin-top:6px">${richText(w.q.explanation||'')}</p></div></div>`;
      }).join('')}</div>`:''}
    </section>`;
    cleanupKeys();
    st=null;
    stars>=1?FX.sfx.win():FX.sfx.lose();
    $$('.star',app).forEach((s,i)=>{if(i<stars) setTimeout(()=>{s.classList.add('on');FX.sfx.pop();const c=FX.centerOf(s);FX.burst(c.x,c.y,24,['#fbbf24','#fde68a','#fff'],{shape:'star',size:9});},400+i*350);});
    if(stars>=2) setTimeout(()=>FX.confetti(180),1300);
    // puanı say
    const target=res.score;const el=$('#bigscore',app);const t0=performance.now();
    const tick=t=>{const k=Math.min(1,(t-t0)/1200);el.textContent=Math.round(target*(1-Math.pow(1-k,3)));if(k<1) requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
    $('#again',app).onclick=()=>mountSetup(app);
  }

  /* ---------- Önizleme (öğretmen paneli) ---------- */
  function preview(q){
    const m=UI.modal({wide:true,title:'👁️ Öğrenci görünümü',html:`<div class="quiz" id="pv-quiz">${buildQuestionHTML(q)}</div><div id="pv-fb" style="margin-top:10px"></div>`,buttons:[{label:'Kapat',cls:'btn-ghost'}]});
    const root=m.el;let done=false;
    $$('.opt',root).forEach(b=>b.onclick=()=>{
      if(done) return;done=true;
      const i=+b.dataset.i;const ok=i===q.answer;const cards=$$('.opt',root);
      if(ok){b.classList.add('correct');b.querySelector('.mark').textContent='✓';FX.sfx.correct();FX.celebrate(b);Mascot.set('happy');}
      else{b.classList.add('wrong');b.querySelector('.mark').textContent='✗';const r=cards[q.answer];r.classList.add('reveal');r.querySelector('.mark').textContent='✓';FX.sfx.wrong();FX.shake($('.modal',root));Mascot.set('sad');}
      $('#pv-fb',root).innerHTML=`<div class="panel"><b>${ok?'✅ Doğru':'❌ Yanlış'}</b> — ${richText(q.explanation||'')}</div>`;
    });
  }

  function cleanupKeys(){if(keyHandler){document.removeEventListener('keydown',keyHandler);keyHandler=null;}}
  function cleanup(){stopTimer();cleanupKeys();st=null;}
  return {mount:mountSetup,unmount:cleanup,buildQuestionHTML,preview};
})();

</script>
<script>
/* js/balance.js */
'use strict';
/* =========================================================
   Denkleştirme Laboratuvarı — katsayıları ayarla, teraziyi dengele
   ========================================================= */
const Balance = (()=>{
  let S=null, raf=null;
  function levels(){
    return Store.equations().map(L=>{
      try{const eq=parseEquation(L.eq);const sol=solveEquation(eq);return sol?{...L,parsed:eq,sol}:null;}catch(e){return null;}
    }).filter(Boolean);
  }
  function mount(app,startIdx){
    const lv=levels();
    if(!lv.length){app.innerHTML='<div class="panel">Hiç geçerli denklem yok. Öğretmen panelinden ekleyin.</div>';return;}
    const prof=Store.profile();
    let idx=startIdx;
    if(idx==null){idx=lv.findIndex(l=>!prof.balance[l.id]);if(idx<0) idx=0;}
    S={app,lv,idx,coefs:[],moves:0,hints:0,solved:false,angle:0,target:0};
    render();
  }
  function render(){
    const {app,lv,idx}=S;const L=lv[idx];const eq=L.parsed;
    const prof=Store.profile();
    S.coefs=new Array(eq.left.length+eq.right.length).fill(1);
    S.moves=0;S.hints=0;S.solved=false;
    const n=eq.left.length;
    const card=(x,i)=>`<div class="sp-card" data-i="${i}">
        <div class="stepper"><button class="coef-btn" data-d="1" aria-label="artır">▲</button><div class="coef one" id="cf${i}">1</div><button class="coef-btn" data-d="-1" aria-label="azalt">▼</button></div>
        <div class="sp-main"><div class="sp-formula fml">${formatFormula(x.formula)}</div><div class="sp-mols" id="ml${i}"></div></div>
      </div>`;
    const side=(arr,off)=>arr.map((x,i)=>card(x,i+off)).join('<span class="eq-op">+</span>');
    app.innerHTML=`<section class="screen balance">
      <div class="bal-top">
        <div><h1 class="screen-title">⚖️ Denkleştirme Laboratuvarı</h1><p class="sub" style="margin:0">Katsayıları ▲▼ ile değiştir. Her atom türü iki tarafta eşit olunca terazi dengelenir!</p></div>
        <div class="level-chips">${lv.map((l,k)=>{const s=prof.balance[l.id]||0;return `<button class="lvl ${k===idx?'active':''} ${s?'done':''}" data-k="${k}" title="${esc(l.title||'')}">${k+1}<small>${s?'★'.repeat(s):''}</small></button>`;}).join('')}</div>
      </div>
      <div class="panel bal-stage" id="stage">
        <div class="bal-context"><b>${esc(L.icon||'🧪')} ${esc(L.title||'Seviye '+(idx+1))}</b>${esc(L.context||'')}</div>
        <div class="eq-row">${side(eq.left,0)}<span class="eq-arrow">→</span>${side(eq.right,n)}</div>
      </div>
      <div class="bal-bottom">
        <div class="panel"><h3>🔬 Atom Sayacı</h3>
          <div class="ac-head"><span>Atom</span><span>GİRENLER</span><span></span><span>ÜRÜNLER</span></div>
          <div id="ac"></div>
        </div>
        <div class="panel"><h3>⚖️ Kütle Terazisi <span class="muted" style="font-size:13px;font-family:var(--font-b)">(Lavoisier)</span></h3>${scaleSVG()}</div>
      </div>
      <div class="bal-actions">
        <button class="btn btn-gold" id="hint">💡 İpucu</button>
        <button class="btn btn-ghost" id="reset">↺ Sıfırla</button>
        <span class="moves" id="moves">Hamle: 0</span>
        <button class="btn btn-cyan" id="skip">Sonraki ⏭</button>
      </div>
    </section>`;
    $$('.lvl',app).forEach(b=>b.onclick=()=>{S.idx=+b.dataset.k;FX.sfx.click();render();});
    $$('.sp-card',app).forEach(c=>{
      const i=+c.dataset.i;
      $$('.coef-btn',c).forEach(b=>b.onclick=()=>change(i,+b.dataset.d));
      c.addEventListener('wheel',e=>{e.preventDefault();change(i,e.deltaY<0?1:-1);},{passive:false});
    });
    $('#hint',app).onclick=hint;
    $('#reset',app).onclick=()=>{FX.sfx.click();render();};
    $('#skip',app).onclick=()=>{S.idx=(S.idx+1)%S.lv.length;render();};
    S.coefs.forEach((_,i)=>drawMols(i));
    update(true);
    startScaleAnim();
  }
  function change(i,d){
    if(S.solved) return;
    const v=clamp(S.coefs[i]+d,1,15);
    if(v===S.coefs[i]) return;
    S.coefs[i]=v;S.moves++;
    d>0?FX.sfx.up():FX.sfx.down();
    const el=$('#cf'+i);el.textContent=v;el.classList.toggle('one',v===1);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
    drawMols(i);update();
  }
  function drawMols(i){
    const eq=S.lv[S.idx].parsed;const all=[...eq.left,...eq.right];
    const svg=Visual.moleculeSVG(all[i].counts);
    const c=S.coefs[i];const show=Math.min(c,6);
    $('#ml'+i).innerHTML=Array(show).fill(svg).join('')+(c>show?`<span class="more">+${c-show}</span>`:'');
  }
  function update(initial){
    const L=S.lv[S.idx];const eq=L.parsed;const n=eq.left.length;
    const Lc=S.coefs.slice(0,n),Rc=S.coefs.slice(n);
    const els=eqElements(eq);
    const rows=els.map(el=>({el,l:sideCount(eq.left,Lc,el),r:sideCount(eq.right,Rc,el)}));
    const max=Math.max(...rows.map(r=>Math.max(r.l,r.r)),1);
    $('#ac').innerHTML=rows.map(r=>`<div class="ac-row ${r.l===r.r?'ok':''}">
      <span class="el-chip" style="--c:${atomColor(r.el)}">${r.el}</span>
      <div class="ac-bar left"><div style="width:${r.l/max*100}%"></div><b>${r.l}</b></div>
      <span class="ac-eq">${r.l===r.r?'=':'≠'}</span>
      <div class="ac-bar right"><div style="width:${r.r/max*100}%"></div><b>${r.r}</b></div></div>`).join('');
    const mL=eq.left.reduce((s,x,i)=>s+formulaMass(x.counts)*Lc[i],0);
    const mR=eq.right.reduce((s,x,i)=>s+formulaMass(x.counts)*Rc[i],0);
    $('#mL').textContent=fmtNum(mL,1)+' u';$('#mR').textContent=fmtNum(mR,1)+' u';
    const diff=(mR-mL)/Math.max(mL,mR);
    S.target=clamp(diff*40,-18,18);
    $('#moves').textContent='Hamle: '+S.moves;
    if(initial) return;
    if(rows.every(r=>r.l===r.r)){
      const g=gcdArr(S.coefs);
      if(g>1){UI.toast(`⚖️ Denk! Ama katsayılar <b>en küçük tam sayılar</b> olmalı. Hepsini ${g}'ye bölebilirsin.`,'gold',3800);return;}
      solved(mL);
    }
  }
  function hint(){
    if(S.solved) return;
    const sol=S.lv[S.idx].sol;
    const wrong=S.coefs.map((c,i)=>i).filter(i=>S.coefs[i]!==sol[i]);
    if(!wrong.length) return;
    const i=wrong[Math.floor(Math.random()*wrong.length)];
    S.hints++;FX.sfx.pop();
    S.coefs[i]=sol[i];
    const el=$('#cf'+i);el.textContent=sol[i];el.classList.toggle('one',sol[i]===1);
    const card=$(`.sp-card[data-i="${i}"]`);card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');
    drawMols(i);update();
  }
  function solved(mass){
    S.solved=true;
    const L=S.lv[S.idx];const sol=L.sol;
    const optimal=sol.reduce((s,x)=>s+x-1,0);
    let stars=3;
    if(S.hints>0) stars=S.hints>=2?1:2;
    else if(S.moves>optimal*2+4) stars=2;
    $('#stage').classList.add('solved');
    FX.sfx.win();FX.confetti(140);FX.banner('DENKLEŞTİ!','good');
    const res=Game.finishBalance(L.id,stars,S.lv.length);
    setTimeout(()=>{
      UI.modal({title:'⚖️ Denkleşti!',html:`<div style="text-align:center">
        <div class="stars" style="font-size:60px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
        <div class="fml" style="font-size:28px;margin:10px 0">${formatFormula(equationString(L.parsed,S.coefs))}</div>
        <p>Girenlerin kütlesi = Ürünlerin kütlesi = <b style="color:var(--gold)">${fmtNum(mass,1)} u</b><br><span class="muted">Kimyasal tepkimelerde atomlar yok olmaz, yoktan var olmaz; yalnızca yeniden düzenlenir.</span></p>
        <p class="muted">Hamle: ${S.moves} · İpucu: ${S.hints} · <b style="color:var(--gold)">+${res.xp} XP</b></p></div>`,
        buttons:[{label:'↺ Tekrar',cls:'btn-ghost',onClick:()=>render()},{label:'Sonraki Seviye ▶',cls:'btn-good',onClick:()=>{S.idx=(S.idx+1)%S.lv.length;render();}}]});
    },900);
  }
  /* ---- Terazi ---- */
  function scaleSVG(){
    return `<svg class="scale-svg" viewBox="0 0 340 220">
      <defs><linearGradient id="pole" x1="0" x2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset=".5" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient></defs>
      <path d="M130 205 h80 l-10 -14 h-60z" fill="#475569"/>
      <rect x="164" y="48" width="12" height="146" rx="4" fill="url(#pole)"/>
      <g id="beam"><rect x="40" y="44" width="260" height="10" rx="5" fill="#cbd5e1"/></g>
      <circle cx="170" cy="49" r="9" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
      <g id="panL">${pan('#mL','GİRENLER','#6366f1')}</g>
      <g id="panR">${pan('#mR','ÜRÜNLER','#0891b2')}</g>
      <polygon id="needle" points="170,30 166,49 174,49" fill="#ef4444"/>
    </svg>`;
  }
  function pan(id,label,color){
    return `<line x1="0" y1="0" x2="-38" y2="70" stroke="#94a3b8" stroke-width="2"/><line x1="0" y1="0" x2="38" y2="70" stroke="#94a3b8" stroke-width="2"/>
      <path d="M-48 70 h96 q-6 28 -48 28 q-42 0 -48 -28z" fill="${color}" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
      <text x="0" y="84" text-anchor="middle" font-family="Nunito, sans-serif" font-size="11" fill="#e0e7ff" font-weight="600">${label}</text>
      <text id="${id.slice(1)}" x="0" y="118" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" style="fill:var(--sv-ink)" font-weight="700">0 u</text>`;
  }
  function startScaleAnim(){
    cancelAnimationFrame(raf);
    const step=()=>{
      if(!S||!$('#beam')) return;
      S.angle+=(S.target-S.angle)*.08;
      const a=S.angle*Math.PI/180,L=120;
      $('#beam').setAttribute('transform',`rotate(${S.angle.toFixed(2)} 170 49)`);
      $('#needle').setAttribute('transform',`rotate(${S.angle.toFixed(2)} 170 49)`);
      $('#panL').setAttribute('transform',`translate(${(170-L*Math.cos(a)).toFixed(1)} ${(49-L*Math.sin(a)).toFixed(1)})`);
      $('#panR').setAttribute('transform',`translate(${(170+L*Math.cos(a)).toFixed(1)} ${(49+L*Math.sin(a)).toFixed(1)})`);
      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
  }
  function unmount(){cancelAnimationFrame(raf);S=null;}
  return {mount,unmount,levels};
})();

</script>
<script>
/* js/atom.js */
'use strict';
/* =========================================================
   Atom Kurucu — proton, nötron, elektron ekleyerek atom/iyon yap
   ========================================================= */
const ATOM_CHALLENGES = [
  {id:'a1',text:'Bir **hidrojen-1** atomu oluştur (¹H).',check:(p,n,e)=>p===1&&n===0&&e===1},
  {id:'a2',text:'**Helyum-4** atomu oluştur. (2 proton, 2 nötron)',check:(p,n,e)=>p===2&&n===2&&e===2},
  {id:'a3',text:'Nötr bir **karbon-12** atomu oluştur.',check:(p,n,e)=>p===6&&n===6&&e===6},
  {id:'a4',text:'Karbonun radyoaktif izotopu **karbon-14**\'ü oluştur.',check:(p,n,e)=>p===6&&n===8&&e===6},
  {id:'a5',text:'**Döteryum** oluştur: bir nötronu olan hidrojen izotopu.',check:(p,n,e)=>p===1&&n===1&&e===1},
  {id:'a6',text:'Sodyum-23\'ten **Na⁺ iyonu** oluştur.',check:(p,n,e)=>p===11&&n===12&&e===10},
  {id:'a7',text:'Oksijen-16\'dan **oksit iyonu (O²⁻)** oluştur.',check:(p,n,e)=>p===8&&n===8&&e===10},
  {id:'a8',text:'**Klorür iyonu** oluştur: ³⁵Cl⁻',check:(p,n,e)=>p===17&&n===18&&e===18},
  {id:'a9',text:'**Mg²⁺** iyonu oluştur (²⁴Mg).',check:(p,n,e)=>p===12&&n===12&&e===10},
  {id:'a10',text:'Düşün! **Neon ile izoelektronik** (10 elektronlu) herhangi bir **katyon** oluştur.',check:(p,n,e)=>e===10&&p>e&&p<=13&&(STABLE_N[p]||[]).includes(n)},
  {id:'a11',text:'**Argon ile izoelektronik** kararlı bir **anyon** oluştur.',check:(p,n,e)=>e===18&&p<e&&p>=15&&(STABLE_N[p]||[]).includes(n)},
  {id:'a12',text:'**4. periyot 2A grubunda** bulunan elementin kararlı, nötr bir atomunu oluştur.',check:(p,n,e)=>p===e&&p===20&&(STABLE_N[p]||[]).includes(n)},
];

const AtomBuilder = (()=>{
  let S=null;
  function mount(app){
    const prof=Store.profile();
    const firstOpen=ATOM_CHALLENGES.findIndex(c=>!prof.atomDone.includes(c.id));
    S={app,p:1,n:0,e:0,mode:firstOpen>=0?'challenge':'free',ch:Math.max(0,firstOpen),lock:false,prev:null};
    app.innerHTML=`<section class="screen atom">
      <div class="bal-top"><div><h1 class="screen-title">⚛️ Atom Kurucu</h1><p class="sub" style="margin:0">Parçacık ekle ya da çıkar; atomun kimliği, kütlesi ve yükü anında değişsin.</p></div>
        <div class="chips"><button class="chip" data-m="challenge">🎯 Görevler</button><button class="chip" data-m="free">🧪 Serbest Mod</button></div></div>
      <div id="chbar"></div>
      <div class="atom-layout">
        <div class="panel atom-stage"><div id="stage"></div><div class="stage-tools">${App.spinButton()}</div></div>
        <div class="panel">
          ${ctl('p','#ef4444','Proton','Atomun kimliğini belirler')}
          ${ctl('n','#94a3b8','Nötron','Kütleyi değiştirir → izotop')}
          ${ctl('e','#38bdf8','Elektron','Yükü değiştirir → iyon')}
          <div class="info-grid"><div class="el-tile" id="tile"></div><div class="facts" id="facts"></div></div>
        </div>
      </div>
      <div class="panel" style="margin-top:18px"><h3>🗂️ Periyodik Sistem (ilk 4 periyot) <span class="muted" style="font-size:13px;font-family:var(--font-b)">— bir elemente tıkla</span></h3>
        <div class="ptable" id="ptable"></div>
        <div class="legend">${Object.values(CAT_INFO).map(c=>`<span><i style="background:${c.color}"></i>${c.name}</span>`).join('')}</div>
      </div>
    </section>`;
    $$('[data-m]',app).forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;FX.sfx.click();renderAll();});
    $$('.pctl',app).forEach(r=>{
      const k=r.dataset.k;
      $('.minus',r).onclick=()=>change(k,-1);
      $('.plus',r).onclick=()=>change(k,1);
    });
    buildTable();
    renderAll();
  }
  function ctl(k,color,name,desc){
    return `<div class="pctl" data-k="${k}"><span class="dot" style="background:${color}"></span><span class="nm">${name}<small>${desc}</small></span>
      <button class="pbtn minus" aria-label="${name} çıkar">−</button><span class="pval" id="v${k}">0</span><button class="pbtn plus" aria-label="${name} ekle">+</button></div>`;
  }
  function buildTable(){
    const cells=[];
    for(let period=1;period<=4;period++) for(let col=1;col<=18;col++){
      const el=ELEMENTS.find(e=>e.period===period&&e.col===col);
      cells.push(el?`<button class="pt" data-z="${el.z}" style="--cat:${CAT_INFO[el.cat].color}" title="${el.name} (${el.z})">${el.sym}</button>`:'<span class="pt-empty"></span>');
    }
    $('#ptable').innerHTML=cells.join('');
    $$('.pt').forEach(b=>b.onclick=()=>{const z=+b.dataset.z;const el=ELEMENTS[z-1];S.p=z;S.n=el.n;S.e=z;FX.sfx.pop();renderAll();check();});
  }
  function change(k,d){
    if(S.lock) return;
    const lim={p:[1,36],n:[0,60],e:[0,40]}[k];
    const v=clamp(S[k]+d,lim[0],lim[1]);
    if(v===S[k]){FX.sfx.down();return;}
    S[k]=v;d>0?FX.sfx.up():FX.sfx.down();
    renderAll(k);check();
  }
  function renderAll(changed){
    const {p,n,e}=S;
    $$('[data-m]',S.app).forEach(b=>b.classList.toggle('active',b.dataset.m===S.mode));
    ['p','n','e'].forEach(k=>$('#v'+k).textContent=S[k]);
    $('#stage').innerHTML=stageSVG(p,n,e,changed);
    const el=ELEMENTS[p-1];
    const cat=CAT_INFO[el.cat];
    const tile=$('#tile');tile.style.setProperty('--cat',cat.color);
    tile.innerHTML=`<span class="z">${p}</span><span class="sy">${el.sym}</span><span class="na">${el.name}</span><span class="ms">${el.mass}</span>`;
    const A=p+n,c=p-e;
    const type=c===0?'<span class="good">Nötr atom</span>':c>0?`Katyon (${chargeStr(c)}) — ${c} elektron vermiş`:`Anyon (${chargeStr(c)}) — ${-c} elektron almış`;
    let stab='';
    if(STABLE_N[p]){
      stab=STABLE_N[p].includes(n)?'<span class="good">✓ Kararlı izotop</span>':'<span class="warn">⚠ Kararsız (radyoaktif) çekirdek</span>';
    } else stab='<span class="muted">Kararlılık verisi bu sürümde Z ≤ 20 için var</span>';
    const iso=ISOTOPE_NAMES[p+'-'+n];
    const conf=electronConfig(p,e);
    const sh=shellsOf(p,e);
    const noble={2:'He',10:'Ne',18:'Ar',36:'Kr'}[e];
    S.app.querySelector('#facts').innerHTML=`
      <div>Gösterim: ${Visual.nuclideHTML(p,n,e)}</div>
      <div>Kütle numarası (A) = p + n = <b>${A}</b></div>
      <div>Yük = p − e = <b>${c>0?'+':''}${c}</b> · ${type}</div>
      <div>${stab}${iso?' · '+iso:''}</div>
      <div>Katmanlar: <b>${sh.join(', ')||'—'}</b>${noble&&c!==0?` <span class="good">· ${noble} ile izoelektronik ✓</span>`:''}</div>
      <div style="font-size:13px">Dizilim: <b style="font-size:14px">${configString(conf)||'—'}</b>${e?Visual.orbitalSVG('Z='+p+' e='+e):''}</div>
      <div>Konum: <b>${el.period}. periyot, ${groupLabel(el.col)} grubu</b> · ${cat.name}</div>`;
    $$('.pt').forEach(b=>b.classList.toggle('cur',+b.dataset.z===p));
    renderChallenge();
  }
  function renderChallenge(){
    const bar=$('#chbar');
    if(S.mode!=='challenge'){bar.innerHTML='';return;}
    const prof=Store.profile();
    const c=ATOM_CHALLENGES[S.ch];
    const done=prof.atomDone.length;
    bar.innerHTML=`<div class="challenge-bar"><span class="cn">Görev ${S.ch+1}/${ATOM_CHALLENGES.length}</span><span class="ct">${richText(c.text)} ${prof.atomDone.includes(c.id)?'✅':''}</span>
      <span class="muted" style="font-weight:800">Tamamlanan: ${done}/${ATOM_CHALLENGES.length}</span>
      <button class="btn btn-sm btn-ghost" id="chprev">◀</button><button class="btn btn-sm btn-ghost" id="chnext">▶</button></div>`;
    $('#chprev').onclick=()=>{S.ch=(S.ch-1+ATOM_CHALLENGES.length)%ATOM_CHALLENGES.length;renderChallenge();};
    $('#chnext').onclick=()=>{S.ch=(S.ch+1)%ATOM_CHALLENGES.length;renderChallenge();};
  }
  function check(){
    if(S.mode!=='challenge'||S.lock) return;
    const c=ATOM_CHALLENGES[S.ch];
    if(c.check(S.p,S.n,S.e)){
      S.lock=true;
      FX.sfx.win();FX.celebrate($('#stage'));FX.banner('GÖREV TAMAM!','good','small');
      Game.finishAtom(c.id,ATOM_CHALLENGES.length);
      setTimeout(()=>{
        S.lock=false;if(!S) return;
        const prof=Store.profile();
        const nextOpen=ATOM_CHALLENGES.findIndex((x,i)=>i>S.ch&&!prof.atomDone.includes(x.id));
        const anyOpen=ATOM_CHALLENGES.findIndex(x=>!prof.atomDone.includes(x.id));
        if(nextOpen>=0) S.ch=nextOpen; else if(anyOpen>=0) S.ch=anyOpen; else {UI.toast('🏆 Tüm atom görevlerini tamamladın! Serbest modda keşfetmeye devam et.','gold',4000);S.mode='free';}
        renderAll();
      },1400);
    }
  }
  /* ---- Büyük atom sahnesi ---- */
  function stageSVG(p,n,e,changed){
    const C=200;
    const total=p+n;
    const rb=total<=12?11:total<=30?9:total<=60?7:5.6;
    const rand=rng(p*1000+n);
    const kinds=[];for(let i=0;i<p;i++) kinds.push('p');for(let i=0;i<n;i++) kinds.push('n');
    for(let i=kinds.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]];}
    const pos=kinds.map((_,i)=>{const r=rb*1.05*Math.sqrt(i+.3);const a=i*2.39996;return [C+Math.cos(a)*r,C+Math.sin(a)*r];});
    const nucR=rb*1.05*Math.sqrt(total)+rb;
    const sh=shellsOf(p,e);const N=sh.length;
    const r0=Math.max(nucR+24,78),r1=186;
    const radii=sh.map((_,i)=>N===1?(r0+r1)/2-20:r0+i*(r1-r0)/(N-1));
    let s=`<svg viewBox="0 0 400 400"><defs>
      <radialGradient id="pg" cx=".35" cy=".35"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#dc2626"/></radialGradient>
      <radialGradient id="ng" cx=".35" cy=".35"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#64748b"/></radialGradient>
      <radialGradient id="eg" cx=".35" cy=".35"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#0284c7"/></radialGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="rgba(251,146,60,.45)"/><stop offset="1" stop-color="rgba(251,146,60,0)"/></radialGradient></defs>`;
    s+=`<circle cx="${C}" cy="${C}" r="${nucR+30}" fill="url(#glow)"/>`;
    radii.forEach((r,i)=>{s+=`<circle cx="${C}" cy="${C}" r="${r.toFixed(1)}" fill="none" style="stroke:var(--sv-ink)" stroke-opacity=".4" stroke-width="2" stroke-dasharray="4 6"/><text x="${C+r*.71+4}" y="${C-r*.71-2}" font-family="Nunito, sans-serif" font-size="12" style="fill:var(--sv-ink)" fill-opacity=".75">${i+1}. katman</text>`;});
    kinds.forEach((k,i)=>{
      const [x,y]=pos[i];
      const isNew=(changed==='p'&&k==='p'&&i===kinds.lastIndexOf('p'))||(changed==='n'&&k==='n'&&i===kinds.lastIndexOf('n'));
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rb}" fill="url(#${k}g)" stroke="rgba(0,0,0,.25)" stroke-width="1">${isNew?'<animate attributeName="r" from="0" to="'+rb+'" dur=".3s"/>':''}</circle>`;
      if(k==='p'&&rb>=7) s+=`<text x="${x.toFixed(1)}" y="${(y+rb*.38).toFixed(1)}" text-anchor="middle" font-size="${rb*1.1}" font-weight="900" fill="#7f1d1d" font-family="Nunito">+</text>`;
    });
    sh.forEach((cnt,i)=>{
      const r=radii[i];
      s+=`<g class="spin" style="transform-origin:${C}px ${C}px;animation-duration:${9+i*5}s;${i%2?'animation-direction:reverse;':''}">`;
      for(let k=0;k<cnt;k++){
        const a=2*Math.PI*k/cnt-Math.PI/2;
        s+=`<circle cx="${(C+Math.cos(a)*r).toFixed(1)}" cy="${(C+Math.sin(a)*r).toFixed(1)}" r="8" fill="url(#eg)" stroke="#e0f2fe" stroke-width="1.5"/>`;
        s+=`<text x="${(C+Math.cos(a)*r).toFixed(1)}" y="${(C+Math.sin(a)*r+3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="900" fill="#082f49">−</text>`;
      }
      s+='</g>';
    });
    return s+'</svg>';
  }
  function unmount(){S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/orbital.js */
'use strict';
/* =========================================================
   Orbital Yerleşimi — Aufbau ilkesi, Pauli ilkesi, Hund kuralı

const ORB_ORDER=[[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1]];  // enerji sırası (aşağıdan yukarı)
const ORB_LEVELS=[

  {z:20,tip:'4s dolar, 3d hâlâ boş kalır.'},
  {z:26,tip:'3d\'nin beş orbitaline Hund kuralıyla yerleştir.'},
  {z:30,tip:'Çinko: 3d tamamen doluyor.'},
  {z:35,tip:'3d doldu, sırada 4p var.'},
  {z:24,bonus:true,tip:'İSTİSNA! Krom\'da yarı dolu d⁵ daha kararlıdır: 4s¹ 3d⁵.'},
  {z:29,bonus:true,tip:'İSTİSNA! Bakır\'da tam dolu d¹⁰ daha kararlıdır: 4s¹ 3d¹⁰.'},
];
const ORB_RULES={
  aufbau:{icon:'🪜',name:'Aufbau İlkesi',text:'Elektronlar önce en düşük enerjili orbitale yerleşir:<br><b>1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p</b>'},
  pauli:{icon:'🚫',name:'Pauli İlkesi',text:'Bir orbitalde en fazla <b>2 elektron</b> bulunur ve bu elektronların spinleri <b>zıt</b> olmalıdır (↑↓).'},
  hund:{icon:'🚌',name:'Hund Kuralı',text:'Eş enerjili orbitallere elektronlar önce <b>birer birer ve aynı spinle</b> yerleşir, sonra eşleşir. <i>Otobüste herkes önce boş koltuğa oturur!</i>'},
};

const Orbital = (()=>{
  let S=null,keyH=null;
  const key=(n,l)=>n+','+l;
  const lab=(n,l)=>n+LCHAR[l];
  const cap=l=>2*(2*l+1);

  function mount(app,startIdx){
    const prof=Store.profile();
    let idx=startIdx;
    if(idx==null){idx=ORB_LEVELS.findIndex(L=>!prof.orbital['z'+L.z]);if(idx<0) idx=0;}
    S={app,idx,spin:'u',tool:'add'};
    keyH=e=>{
      if(!S||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
      if(e.key==='ArrowUp'){e.preventDefault();setTool('add','u');}
      else if(e.key==='ArrowDown'){e.preventDefault();setTool('add','d');}
      else if(e.key==='Backspace'||e.key.toLowerCase()==='z'){e.preventDefault();undo();}
    };
    document.addEventListener('keydown',keyH);
    render();
  }

  function render(){
    const L=ORB_LEVELS[S.idx];const el=ELEMENTS[L.z-1];
    const prof=Store.profile();
    S.orbs={};ORB_ORDER.forEach(([n,l])=>{S.orbs[key(n,l)]=Array.from({length:2*l+1},()=>[]);});
    S.placed=[];S.mistakes=0;S.hints=0;S.done=false;
    S.target={};electronConfig(L.z,L.z).forEach(x=>{S.target[key(x.n,x.l)]=x.e;});
    S.app.innerHTML=`<section class="screen orbital">
      <div class="bal-top">
        <div><h1 class="screen-title">🌀 Orbital Yerleşimi</h1><p class="sub" style="margin:0">Elektronları enerji merdivenindeki orbitallere yerleştir. Her hamlende üç kural denetleniyor!</p></div>
        <div class="level-chips">${ORB_LEVELS.map((x,k)=>{const s=prof.orbital['z'+x.z]||0;const e=ELEMENTS[x.z-1];
          return `<button class="lvl ${k===S.idx?'active':''} ${s?'done':''} ${x.bonus?'bonus':''}" data-k="${k}" title="${e.name}${x.bonus?' (istisna)':''}">${e.sym}<small>${s?'★'.repeat(s):x.bonus?'⚡':''}</small></button>`;}).join('')}</div>
      </div>
      <div class="challenge-bar orb-target">
        <div class="orb-el" style="--cat:${CAT_INFO[el.cat].color}"><span class="z">${L.z}</span><b>${el.sym}</b><small>${el.name}</small></div>
        <div class="ct"><div>Hedef: <b>${el.name}</b> atomunun <b>${L.z} elektronunu</b> temel hâle göre yerleştir.</div>
          <div class="muted" style="font-size:14px;margin-top:4px">💡 ${L.tip}</div></div>
        <div class="orb-tray"><span class="muted" style="font-weight:900;font-size:12px">KALAN ELEKTRON</span><b id="remain">${L.z}</b></div>
      </div>
      <div class="orb-layout">
        <div class="panel orb-main">
          <div class="orb-tools">
            <button class="spin-btn" data-tool="add" data-spin="u" title="Yukarı spin (klavye ↑)"><span>↑</span> Yukarı spin</button>
            <button class="spin-btn" data-tool="add" data-spin="d" title="Aşağı spin (klavye ↓)"><span>↓</span> Aşağı spin</button>
            <button class="spin-btn eraser" data-tool="erase" title="Bir elektron çıkar"><span>🧽</span> Çıkar</button>
            <span style="flex:1"></span>
            <button class="btn btn-sm btn-ghost" id="undo" title="Geri al (Z)">↶ Geri al</button>
            <button class="btn btn-sm btn-gold" id="hint">💡 İpucu</button>
            <button class="btn btn-sm btn-ghost" id="reset">↺</button>
          </div>
          <div class="orb-msg" id="orbmsg">Bir spin seç ve bir orbital kutusuna tıkla.</div>
          <div class="orb-diagram" id="diagram"></div>
          <div class="orb-notation">Elektron dizilimi: <span id="notation" class="fml">—</span></div>
        </div>
        <div class="orb-side">
          ${Object.entries(ORB_RULES).map(([k,r])=>`<div class="rule-card" id="rule-${k}"><div class="ri">${r.icon}</div><div><h4>${r.name}</h4><p>${r.text}</p></div><span class="rc" id="rc-${k}"></span></div>`).join('')}
          <div class="panel" style="padding:14px"><h3 style="font-size:16px;margin-bottom:6px">↘ Köşegen kuralı (dolma sırası)</h3>${diagonalSVG()}</div>
        </div>
      </div>
    </section>`;
    $$('.lvl',S.app).forEach(b=>b.onclick=()=>{S.idx=+b.dataset.k;FX.sfx.click();render();});
    $$('.spin-btn',S.app).forEach(b=>b.onclick=()=>{setTool(b.dataset.tool,b.dataset.spin);FX.sfx.click();});
    $('#undo').onclick=undo;
    $('#hint').onclick=hint;
    $('#reset').onclick=()=>{FX.sfx.click();render();};
    drawDiagram();
    setTool('add',S.spin);
  }

  function setTool(tool,spin){
    S.tool=tool;if(spin) S.spin=spin;
    $$('.spin-btn',S.app).forEach(b=>b.classList.toggle('active',b.dataset.tool===tool&&(tool==='erase'||b.dataset.spin===S.spin)));
    $('#diagram').classList.toggle('erasing',tool==='erase');
  }

  function drawDiagram(){
    const hi=Math.max(...ORB_ORDER.map(([n,l],i)=>S.target[key(n,l)]?i:0));
    const rows=clamp(hi+2,3,ORB_ORDER.length);
    const dg=$('#diagram');dg.style.gridTemplateRows=`repeat(${rows},var(--orb-row))`;
    dg.innerHTML=`<div class="energy-axis"><span>ENERJİ</span></div>`+ORB_ORDER.slice(0,rows).map(([n,l],i)=>{
      const k=key(n,l);const orbs=S.orbs[k];const cnt=orbs.reduce((t,o)=>t+o.length,0);
      return `<div class="orb-group ${cnt===cap(l)?'full':''}" data-key="${k}" style="grid-row:${rows-i};grid-column:${l+2}">
        <div class="orb-label">${lab(n,l)}<sup>${cnt||''}</sup></div>
        <div class="orb-boxes">${orbs.map((o,oi)=>`<button class="orb-box" data-k="${k}" data-o="${oi}" aria-label="${lab(n,l)} orbitali ${oi+1}">${arrowsHTML(o)}</button>`).join('')}</div>
      </div>`;
    }).join('');
    $$('.orb-box',S.app).forEach(b=>b.onclick=()=>{
      if(S.tool==='erase') erase(b.dataset.k,+b.dataset.o,b); else place(b.dataset.k,+b.dataset.o,b);
    });
    updateInfo();
  }
  function arrowsHTML(o,popLast){return o.map((s,i)=>`<i class="ar ${s} ${popLast&&i===o.length-1?'pop':''}">${s==='u'?'↑':'↓'}</i>`).join('');}
  function refreshBox(k,oi,pop){
    const b=$(`.orb-box[data-k="${k}"][data-o="${oi}"]`);b.innerHTML=arrowsHTML(S.orbs[k][oi],pop);
    const [n,l]=k.split(',').map(Number);const cnt=countOf(k);
    const g=b.closest('.orb-group');g.classList.toggle('full',cnt===cap(l));
    $('.orb-label',g).innerHTML=lab(n,l)+'<sup>'+(cnt||'')+'</sup>';
  }
  function countOf(k){return S.orbs[k].reduce((t,o)=>t+o.length,0);}
  function updateInfo(){
    const L=ORB_LEVELS[S.idx];
    $('#remain').textContent=L.z-S.placed.length;
    const parts=ORB_ORDER.filter(([n,l])=>countOf(key(n,l))>0).map(([n,l])=>`${n}${LCHAR[l]}<sup>${countOf(key(n,l))}</sup>`);
    $('#notation').innerHTML=parts.join(' ')||'—';
  }
  function msg(text,kind=''){const m=$('#orbmsg');m.className='orb-msg '+kind;m.innerHTML=text;}

  /* ---- Kural denetimi ---- */
  function check(k,oi){
    const L=ORB_LEVELS[S.idx];
    const [n,l]=k.split(',').map(Number);
    if(S.placed.length>=L.z) return {rule:null,text:'Tüm elektronları yerleştirdin! Fazla elektron yok.'};
    // Aufbau
    const idx=ORB_ORDER.findIndex(([a,b])=>a===n&&b===l);
    for(let j=0;j<idx;j++){
      const [n2,l2]=ORB_ORDER[j];const k2=key(n2,l2);
      if(countOf(k2)<cap(l2)){
        if(L.bonus&&k2==='4,0'&&k==='3,2'&&countOf(k2)>=1) continue;
        return {rule:'aufbau',text:`<b>Aufbau ihlali!</b> Önce daha düşük enerjili <b>${lab(n2,l2)}</b> orbitali dolmalı.`};
      }
    }
    const sub=S.orbs[k],o=sub[oi],s=S.spin;
    // Pauli
    if(o.length>=2) return {rule:'pauli',text:'<b>Pauli ihlali!</b> Bir orbitalde en fazla <b>2 elektron</b> bulunabilir.'};
    if(o.length===1&&o[0]===s) return {rule:'pauli',text:`<b>Pauli ihlali!</b> Aynı orbitaldeki iki elektron <b>zıt spinli</b> olmalı. Burada ${s==='u'?'↓':'↑'} spin gerekiyor.`};
    // Hund
    if(o.length===1&&sub.some(x=>x.length===0)) return {rule:'hund',text:`<b>Hund ihlali!</b> ${lab(n,l)} orbitallerinin hepsine önce <b>birer elektron</b> yerleşmeli, sonra eşleşme başlar.`};
    if(o.length===0){
      const singles=sub.filter(x=>x.length===1).map(x=>x[0]);
      if(singles.length&&singles.some(x=>x!==s)) return {rule:'hund',text:'<b>Hund ihlali!</b> Yarı dolu eş enerjili orbitallerdeki elektronlar <b>aynı yönlü (paralel) spinli</b> olmalı.'};
    }
    return null;
  }
  function place(k,oi,box){
    if(S.done) return;
    const v=check(k,oi);
    if(v){
      if(!v.rule){msg(v.text,'warn');FX.sfx.down();return;}
      S.mistakes++;
      FX.sfx.wrong();
      box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');setTimeout(()=>box.classList.remove('bad'),600);
      const ghost=document.createElement('i');ghost.className='ar ghost '+S.spin;ghost.textContent=S.spin==='u'?'↑':'↓';box.appendChild(ghost);setTimeout(()=>ghost.remove(),700);
      const rc=$('#rule-'+v.rule);rc.classList.remove('violated');void rc.offsetWidth;rc.classList.add('violated');
      msg('❌ '+v.text,'bad');
      return;
    }
    S.orbs[k][oi].push(S.spin);
    S.placed.push({k,oi});
    $$('.orb-box.hinted').forEach(b=>b.classList.remove('hinted'));
    refreshBox(k,oi,true);
    FX.sfx.pop();
    updateInfo();
    const left=ORB_LEVELS[S.idx].z-S.placed.length;
    msg(left?`✓ Güzel! ${left} elektron kaldı.`:'✓ Son elektron da yerleşti!','good');
    if(!left) complete();
  }
  function erase(k,oi,box){
    if(S.done) return;
    const o=S.orbs[k][oi];if(!o.length){FX.sfx.down();return;}
    o.pop();
    for(let i=S.placed.length-1;i>=0;i--) if(S.placed[i].k===k&&S.placed[i].oi===oi){S.placed.splice(i,1);break;}
    refreshBox(k,oi);FX.sfx.down();updateInfo();msg('Bir elektron çıkarıldı.','');
  }
  function undo(){
    if(!S||S.done||!S.placed.length) return;
    const {k,oi}=S.placed.pop();S.orbs[k][oi].pop();refreshBox(k,oi);FX.sfx.down();updateInfo();msg('↶ Son hamle geri alındı.','');
  }
  function nextMove(){
    for(const [n,l] of ORB_ORDER){
      const k=key(n,l);const need=S.target[k]||0;const sub=S.orbs[k];
      if(countOf(k)>need) return {wrong:k};
      if(countOf(k)<need){
        const singles=sub.filter(x=>x.length===1);
        const empty=sub.findIndex(x=>x.length===0);
        if(empty>=0) return {k,oi:empty,spin:singles.length?singles[0][0]:'u'};
        const half=sub.findIndex(x=>x.length===1);
        return {k,oi:half,spin:sub[half][0]==='u'?'d':'u'};
      }
    }
    return null;
  }
  function hint(){
    if(S.done) return;
    const m=nextMove();if(!m) return;
    S.hints++;FX.sfx.pop();
    if(m.wrong){const [n,l]=m.wrong.split(',').map(Number);msg(`💡 <b>${lab(n,l)}</b> orbitalinde olması gerekenden fazla elektron var. 🧽 ile bir tanesini çıkar.`,'warn');setTool('erase');return;}
    setTool('add',m.spin);
    $$('.orb-box.hinted').forEach(b=>b.classList.remove('hinted'));
    const b=$(`.orb-box[data-k="${m.k}"][data-o="${m.oi}"]`);b.classList.add('hinted');
    const [n,l]=m.k.split(',').map(Number);
    msg(`💡 Sıradaki elektron <b>${lab(n,l)}</b> orbitaline, <b>${m.spin==='u'?'↑ yukarı':'↓ aşağı'}</b> spinle gider.`,'warn');
  }
  function complete(){
    const L=ORB_LEVELS[S.idx];const el=ELEMENTS[L.z-1];
    const ok=ORB_ORDER.every(([n,l])=>countOf(key(n,l))===(S.target[key(n,l)]||0));
    if(!ok){
      msg(L.bonus?`⚡ Neredeyse! <b>${el.name}</b> bir istisnadır: ${L.tip.replace('İSTİSNA! ','')} 🧽 ile 4s'ten bir elektron çıkarıp 3d'ye yerleştir.`:'Dizilim temel hâle uymuyor. İpucu almayı dene.','warn');
      return;
    }
    S.done=true;
    const stars=S.mistakes===0&&S.hints===0?3:(S.mistakes<=2&&S.hints<=1)?2:1;
    Object.keys(ORB_RULES).forEach(r=>$('#rule-'+r).classList.add('ok'));
    $$('.orb-group',S.app).forEach((g,i)=>setTimeout(()=>g.classList.add('celebrate'),i*60));
    FX.sfx.win();FX.confetti(140);FX.banner('KURALLARA UYGUN!','good','small');
    const res=Game.finishOrbital('z'+L.z,stars,ORB_LEVELS.length);
    const conf=electronConfig(L.z,L.z);
    const unpaired=Object.keys(S.orbs).reduce((t,k)=>t+S.orbs[k].filter(o=>o.length===1).length,0);
    setTimeout(()=>{
      if(!S) return;
      UI.modal({title:`🌀 ${el.name} tamam!`,html:`<div style="text-align:center">
        <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
        <div style="max-width:420px;margin:0 auto">${Visual.orbitalSVG('Z='+L.z)}</div>
        <p class="fml" style="font-size:20px">${configString(conf)}</p>
        <p>Yarı dolu orbital sayısı: <b style="color:var(--gold)">${unpaired}</b> · Son katman: <b>${shellsOf(L.z,L.z).length}. katman</b></p>
        <p class="muted">Hata: ${S.mistakes} · İpucu: ${S.hints} · <b style="color:var(--gold)">+${res.xp} XP</b></p></div>`,
        buttons:[{label:'↺ Tekrar',cls:'btn-ghost',onClick:()=>render()},{label:'Sonraki ▶',cls:'btn-good',onClick:()=>{S.idx=(S.idx+1)%ORB_LEVELS.length;render();}}]});
    },1100);
  }
  function diagonalSVG(){
    const X=l=>34+l*50,Y=n=>22+(n-1)*30;
    let s=`<svg viewBox="0 0 230 172" class="diag-svg">`;
    let k=0;const colors=['#22d3ee','#a78bfa','#f472b6','#fbbf24','#4ade80','#60a5fa','#fb923c','#f87171'];
    for(let sum=1;sum<=6;sum++){
      const list=[];for(let l=3;l>=0;l--){const n=sum-l;if(n>l&&n>=1&&n<=5) list.push([n,l]);}
      if(!list.length) continue;
      const [n1,l1]=list[0],[n2,l2]=list[list.length-1];
      const x1=X(l1)+16,y1=Y(n1)-12,x2=X(l2)-14,y2=Y(n2)+10;
      const c=colors[k++%colors.length];
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.5" opacity=".8"/><circle cx="${x2}" cy="${y2}" r="3.5" fill="${c}"/>`;
    }
    for(let n=1;n<=5;n++) for(let l=0;l<Math.min(n,4);l++){
      s+=`<text x="${X(l)}" y="${Y(n)+5}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="600" style="fill:var(--sv-ink)">${n}${LCHAR[l]}</text>`;
    }
    return s+'</svg>';
  }
  function unmount(){if(keyH) document.removeEventListener('keydown',keyH);keyH=null;S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/k-simetri.js */
'use strict';
/* =========================================================
   Küresel Simetri — 9. sınıf (Maarif Modeli)
   Elektron dizilimi s¹, s², p³, p⁶, d⁵, d¹⁰ ile biten (yani tüm
   orbitalleri ya tam ya yarı dolu olan) atom ve iyonlar küresel
   simetriktir.
   Keşfet: element/iyon seç, orbitallerini ve "küresini" gör.
   Avcı: kartlardan küresel simetrik olanların hepsini seç.
   ========================================================= */
const ChemX = {
  cap:l=>2*(2*l+1),
  conf(z,q=0){return electronConfig(z,z-q);},
  state(x){const c=ChemX.cap(x.l);return x.e===c?'full':x.e*2===c?'half':'part';},
  isSym(conf){return conf.length>0&&conf.every(x=>ChemX.state(x)!=='part');},
  last(conf){return conf[conf.length-1];},
  subHTML(x){return x.n+LCHAR[x.l]+'<sup>'+x.e+'</sup>';},
  confHTML(conf,mark){
    return conf.map((x,i)=>mark&&i===conf.length-1?`<b class="cx-last ${ChemX.state(x)}">${ChemX.subHTML(x)}</b>`:ChemX.subHTML(x)).join(' ');
  },
  ionHTML(sym,q){return sym+(q?`<sup>${chargeStr(q)}</sup>`:'');},
  /* Soy gaz kısaltması: [Ar] 4s² 3d⁶ */
  shortHTML(conf,mark){
    let core=0,k=0,cum=0;
    conf.forEach((x,i)=>{cum+=x.e;if([2,10,18,36].includes(cum)&&ChemX.state(x)==='full'&&i<conf.length-1){core=cum;k=i+1;}});
    if(!core) return ChemX.confHTML(conf,mark);
    const name={2:'He',10:'Ne',18:'Ar',36:'Kr'}[core];
    return `[${name}] `+ChemX.confHTML(conf.slice(k),mark);
  },
  /* Orbital kutuları (Hund kuralına göre) */
  boxesHTML(conf){
    return `<div class="sy-boxes">${conf.map(x=>{
      const k=2*x.l+1,ups=Math.min(x.e,k),downs=Math.max(0,x.e-k);
      return `<div class="sy-sub ${ChemX.state(x)}"><div class="bx">${Array.from({length:k},(_,i)=>`<i>${i<ups?'↑':''}${i<downs?'↓':''}</i>`).join('')}</div><span class="lb">${ChemX.subHTML(x)}</span></div>`;
    }).join('')}</div>`;
  },
  /* Elektron bulutu: simetrikse kusursuz küre, değilse yamuk bir bulut */
  sphereSVG(ok,label,seed=1){
    const id='sg'+Math.random().toString(36).slice(2,8);
    let body;
    if(ok){
      body=`<circle cx="100" cy="100" r="70" fill="url(#${id})"/>
        <g class="sp-rings"><circle cx="100" cy="100" r="86" fill="none" stroke-width="2" stroke-dasharray="4 7" style="stroke:var(--good)"/>
        <ellipse cx="100" cy="100" rx="86" ry="30" fill="none" stroke-width="1.5" stroke-dasharray="3 6" opacity=".7" style="stroke:var(--good)"/>
        <ellipse cx="100" cy="100" rx="30" ry="86" fill="none" stroke-width="1.5" stroke-dasharray="3 6" opacity=".7" style="stroke:var(--good)"/></g>`;
    } else {
      const R=rng(seed*97+13),N=9,pts=[];
      for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=60+R()*30;pts.push([100+r*Math.cos(a),100+r*Math.sin(a)*.86]);}
      let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for(let i=0;i<N;i++){
        const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
        const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
        d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      body=`<path class="sp-blob" d="${d}Z" fill="url(#${id})"/>`;
    }
    const c1=ok?'var(--good-soft)':'var(--warn-soft)',c2=ok?'var(--good)':'var(--warn)';
    return `<svg class="sphere ${ok?'ok':'no'}" viewBox="0 0 200 200" role="img" aria-label="${ok?'Küresel simetrik':'Küresel simetrik değil'}">
      <defs><radialGradient id="${id}" cx="38%" cy="34%" r="75%"><stop offset="0" style="stop-color:#fff;stop-opacity:.95"/><stop offset=".35" style="stop-color:${c1}"/><stop offset="1" style="stop-color:${c2};stop-opacity:.85"/></radialGradient></defs>
      ${body}
      <circle cx="100" cy="100" r="17" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/>
      <text x="100" y="105" text-anchor="middle" font-size="14" font-weight="900" style="fill:var(--ink)">${label}</text>
    </svg>`;
  },
  verdictHTML(conf){
    const ok=ChemX.isSym(conf),L=ChemX.last(conf);
    if(ok) return `<b>✔ Küresel simetrik.</b> Tüm orbitaller ya <b>tam dolu</b> ya <b>yarı dolu</b>; dizilim <b>${ChemX.subHTML(L)}</b> ile bitiyor.`;
    const bad=conf.filter(x=>ChemX.state(x)==='part')[0];
    const c=ChemX.cap(bad.l);
    return `<b>✘ Küresel simetrik değil.</b> <b>${ChemX.subHTML(bad)}</b> ne yarı dolu (${LCHAR[bad.l]}<sup>${c/2}</sup>) ne tam dolu (${LCHAR[bad.l]}<sup>${c}</sup>).`;
  },
};

const SYM_IONS=[
  [11,1],[12,2],[13,3],[8,-2],[9,-1],[17,-1],[16,-2],[7,-3],[19,1],[20,2],
  [26,2],[26,3],[29,1],[29,2],[25,2],[30,2],[24,3],[27,2],[28,2],[21,3],[22,2],[23,3],[24,2],[3,1],[4,2],
];

const KSimetri = (()=>{
  const LEVELS={
    kolay:{name:'Dizilimi gör',icon:'👁️',grade:'Dizilim kartta yazılı · Z 1–20',max:20,showConf:true},
    orta:{name:'Atom avcısı',icon:'🎯',grade:'Yalnızca sembol · Z 1–20',max:20},
    zor:{name:'d orbitali',icon:'⚡',grade:'Cr, Mn, Cu, Zn… · Z 1–36',max:36},
    iyon:{name:'İyonlar',icon:'💎',grade:'Na⁺, Fe³⁺, Cu⁺, Cl⁻…',ion:true},
  };
  const ROUNDS=5,PER=6;
  let S=null;

  function mount(app){
    const prof=Store.profile();
    app.innerHTML=`<section class="screen simetri">
      <h1 class="screen-title">💎 Küresel Simetri</h1>
      <p class="sub">Elektron dizilimi <span class="sy-chip">s¹</span> <span class="sy-chip">s²</span> <span class="sy-chip">p³</span> <span class="sy-chip">p⁶</span> <span class="sy-chip">d⁵</span> <span class="sy-chip">d¹⁰</span> ile biten atomlar <b>küresel simetriktir</b>: orbitallerinin hepsi ya tam dolu ya yarı doludur.</p>
      <div class="mode-pick">
        <button class="mode-card sy-lv" data-l="kesfet"><div class="mi">🔍</div><h4>Keşfet</h4><p>Bir element ya da iyon seç; orbitallerini ve elektron küresini gör.</p></button>
        ${Object.entries(LEVELS).map(([k,l])=>{const b=(prof.games['simetri_'+k]||{}).best||0;
          return `<button class="mode-card sy-lv" data-l="${k}"><div class="mi">${l.icon}</div><h4>${l.name}</h4><p>${l.grade}</p><p style="margin-top:6px;color:var(--gold)">🏆 En iyi: ${b}/${ROUNDS*PER}</p></button>`;}).join('')}
      </div>
    </section>`;
    $$('.sy-lv',app).forEach(b=>b.onclick=()=>{FX.sfx.pop();b.dataset.l==='kesfet'?explore(app):start(app,b.dataset.l);});
  }

  /* ---------- Keşfet ---------- */
  function explore(app){
    S={app,z:7,q:0,show:false};
    app.innerHTML=`<section class="screen simetri">
      <div class="bal-top"><div><h1 class="screen-title">🔍 Küresel Simetri · Keşfet</h1>
        <p class="sub" style="margin:0">Tablodan bir elemente dokun. İyon yapmak için yükü değiştir.</p></div>
        <button class="btn btn-ghost btn-sm" id="syback">↶ Geri</button></div>
      <div class="sy-layout">
        <div class="panel">
          <div class="sy-tools"><button class="btn btn-sm btn-gold" id="syshow">💎 Küresel simetrikleri göster</button></div>
          <div class="ptable" id="sytable"></div>
          <p class="muted" style="font-size:13px;font-weight:700;margin:10px 0 0">İpucu: Aynı gruptaki elementlerin dizilimi aynı tür orbitalle biter. Gruplara göre bir örüntü görüyor musun?</p>
        </div>
        <div class="panel sy-view" id="syview"></div>
      </div>
    </section>`;
    const cells=[];
    for(let p=1;p<=4;p++) for(let c=1;c<=18;c++){
      const el=ELEMENTS.find(e=>e.period===p&&e.col===c);
      cells.push(el?`<button class="pt" data-z="${el.z}" style="--cat:${CAT_INFO[el.cat].color}" title="${el.name} (${el.z})">${el.sym}</button>`:'<span class="pt-empty"></span>');
    }
    $('#sytable').innerHTML=cells.join('');
    $$('#sytable .pt').forEach(b=>b.onclick=()=>{S.z=+b.dataset.z;S.q=0;FX.sfx.pop();view();});
    $('#syshow').onclick=()=>{S.show=!S.show;FX.sfx.click();marks();};
    $('#syback').onclick=()=>{FX.sfx.click();mount(app);};
    view();
  }
  function marks(){
    $$('#sytable .pt').forEach(b=>{
      const ok=ChemX.isSym(ChemX.conf(+b.dataset.z));
      b.classList.toggle('sym',S.show&&ok);b.classList.toggle('nosym',S.show&&!ok);
      b.classList.toggle('cur',+b.dataset.z===S.z);
    });
    $('#syshow').innerHTML=S.show?'🙈 İşaretleri gizle':'💎 Küresel simetrikleri göster';
  }
  function view(){
    const el=ELEMENTS[S.z-1],conf=ChemX.conf(S.z,S.q),ok=ChemX.isSym(conf);
    const e=S.z-S.q;
    $('#syview').innerHTML=`
      <div class="sy-head">
        <div class="orb-el" style="--cat:${CAT_INFO[el.cat].color}"><span class="z">${el.z}</span><b>${ChemX.ionHTML(el.sym,S.q)}</b><small>${el.name}</small></div>
        <div class="sy-charge"><span>Yük</span>
          <button class="pbtn" id="qm" aria-label="Yükü azalt">−</button><b class="pval" style="min-width:44px;text-align:center">${S.q>0?'+'+S.q:S.q}</b><button class="pbtn" id="qp" aria-label="Yükü artır">+</button>
          <span class="muted" style="font-size:13px">${e} elektron</span></div>
      </div>
      ${ChemX.sphereSVG(ok,ChemX.ionHTML(el.sym,S.q).replace(/<\/?sup>/g,''),S.z*10+S.q)}
      <div class="stage-tools">${App.spinButton()}</div>
      <div class="sy-verdict ${ok?'good':'bad'}">${ChemX.verdictHTML(conf)}</div>
      ${ChemX.boxesHTML(conf)}
      <div class="orb-notation">Elektron dizilimi: <span class="fml">${ChemX.confHTML(conf,true)}</span></div>
      ${S.q?`<p class="muted" style="font-size:13px;font-weight:700;margin:0">İyon oluşurken elektronlar önce <b>en dış katmandan</b> (en büyük n) kopar. Örneğin Fe → Fe³⁺: önce 4s, sonra 3d elektronları gider.</p>`:''}`;
    $('#qm').onclick=()=>charge(-1);
    $('#qp').onclick=()=>charge(1);
    marks();
    if(ok) FX.celebrate($('#syview .sphere'));
  }
  function charge(d){
    const q=clamp(S.q+d,-3,4),e=S.z-q;
    if(q===S.q||e<1||e>36){FX.sfx.down();return;}
    S.q=q;d>0?FX.sfx.up():FX.sfx.down();view();
  }

  /* ---------- Avcı ---------- */
  function pool(lv){
    const L=LEVELS[lv];
    if(L.ion) return SYM_IONS.map(([z,q])=>({z,q}));
    return ELEMENTS.slice(0,L.max).map(e=>({z:e.z,q:0}));
  }
  function deal(lv){
    const P=pool(lv);
    for(let t=0;t<200;t++){
      const pick=shuffle(P).slice(0,PER);
      const n=pick.filter(x=>ChemX.isSym(ChemX.conf(x.z,x.q))).length;
      if(n>=2&&n<=4) return pick;
    }
    return shuffle(P).slice(0,PER);
  }
  function start(app,lv){
    S={app,lv,round:0,score:0,res:[]};
    app.innerHTML=`<section class="screen simetri">
      <div class="q-hud" style="grid-template-columns:1fr auto">
        <div><div class="q-progress" id="sydots"></div><div class="q-count" id="sycount"></div></div>
        <div class="score-box"><span>PUAN</span><b id="syscore">0</b></div>
      </div>
      <div class="challenge-bar"><div class="ct">Küresel simetrik olan <b>bütün</b> kartları seç, sonra <b>Kontrol Et</b>.
        <div class="muted" style="font-size:13px;margin-top:4px">Hatırla: <span class="sy-chip">s¹</span> <span class="sy-chip">s²</span> <span class="sy-chip">p³</span> <span class="sy-chip">p⁶</span> <span class="sy-chip">d⁵</span> <span class="sy-chip">d¹⁰</span></div></div></div>
      <div class="sy-grid" id="sygrid"></div>
      <div id="symsg"></div>
    </section>`;
    round();
  }
  function dots(){
    $('#sydots').innerHTML=Array.from({length:ROUNDS},(_,k)=>`<i class="${k===S.round?'cur':S.res[k]===true?'ok':S.res[k]===false?'no':''}"></i>`).join('');
    $('#sycount').textContent=`Tur ${S.round+1} / ${ROUNDS}`;
  }
  function round(){
    dots();
    S.cards=deal(S.lv).map(x=>({...x,on:false,conf:ChemX.conf(x.z,x.q)}));
    S.checked=false;
    const L=LEVELS[S.lv];
    $('#sygrid').innerHTML=S.cards.map((c,i)=>{const el=ELEMENTS[c.z-1];
      return `<button class="sy-card" data-i="${i}" style="--d:${i*60}ms"><span class="z">${c.z}</span><span class="tick">✔</span>
        <div class="sy">${ChemX.ionHTML(el.sym,c.q)}</div><div class="nm">${el.name}${c.q?' iyonu':''}</div>
        <div class="cf">${L.showConf?ChemX.confHTML(c.conf):''}</div><div class="vd"></div></button>`;}).join('');
    $$('.sy-card',S.app).forEach(b=>b.onclick=()=>{
      if(S.checked) return;
      const c=S.cards[+b.dataset.i];c.on=!c.on;b.classList.toggle('on',c.on);c.on?FX.sfx.up():FX.sfx.down();
    });
    $('#symsg').innerHTML=`<div style="text-align:center;margin-top:16px"><button class="btn btn-big btn-good" id="sycheck">Kontrol Et ✔</button></div>`;
    $('#sycheck').onclick=check;
  }
  function check(){
    if(S.checked) return;S.checked=true;
    let right=0;
    S.cards.forEach((c,i)=>{
      const ok=ChemX.isSym(c.conf),good=ok===c.on;if(good) right++;
      const b=$(`.sy-card[data-i="${i}"]`);
      b.classList.add(good?'right':'wrong');
      $('.cf',b).innerHTML=ChemX.confHTML(c.conf,true);
      $('.vd',b).innerHTML=ok?'<span class="good">💎 Küresel simetrik</span>':'<span class="bad">Simetrik değil</span>';
    });
    S.score+=right;S.res[S.round]=right===PER;
    $('#syscore').textContent=S.score;
    const sb=$('.score-box',S.app);sb.classList.remove('bump');void sb.offsetWidth;sb.classList.add('bump');
    if(right===PER){FX.sfx.correct();FX.celebrate($('#sygrid'));}
    else{FX.sfx.wrong();}
    dots();
    const last=S.round>=ROUNDS-1;
    $('#symsg').innerHTML=`<div class="orb-msg ${right===PER?'good':'warn'}">${right===PER?'✅ Hepsi doğru! Tam isabet.':`${right} / ${PER} kart doğru. Kırmızı kartların son orbitaline bak: yarı ya da tam dolu mu?`}</div>
      <div style="text-align:center"><button class="btn btn-big btn-primary" id="synext">${last?'Sonuçlar 🏁':'Sonraki tur ▶'}</button></div>`;
    $('#synext').onclick=()=>{FX.sfx.click();if(last) return finish();S.round++;round();};
  }
  function finish(){
    const {score,lv,app}=S,T=ROUNDS*PER;
    const stars=score>=27?3:score>=22?2:score>=16?1:0;
    const res=Game.finishArcade('simetri_'+lv,{score,xp:score*2+stars*5,badge:score===T?'sym30':null});
    stars?FX.sfx.win():FX.sfx.lose();if(stars>=2) FX.confetti(150);
    UI.modal({title:'💎 Av bitti!',dismiss:false,html:`<div style="text-align:center">
      <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
      <div class="big-score">${score} / ${T}</div><p class="muted">${res.newBest?'🎉 YENİ REKOR!':'En iyi: '+res.best+' / '+T}</p></div>`,
      buttons:[{label:'Seviye seç',cls:'btn-ghost',onClick:()=>mount(app)},{label:'🔁 Tekrar',cls:'btn-good',onClick:()=>start(app,lv)}]});
  }
  function unmount(){S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/k-grup.js */
'use strict';
/* =========================================================
   Grup Bul — periyodik sistemde yer bulma (9. sınıf, Maarif)
   İpucu (katman dizilimi, orbital dizilimi, atom numarası ya da
   soy gaz kısaltması) verilir; öğrenci boş tablodaki doğru hücreye
   dokunur. Her cevaptan sonra periyot ve grubun nasıl bulunduğu
   adım adım açıklanır.
   ========================================================= */
const KGrup = (()=>{
  const LEVELS={
    katman:{name:'Katman dizilimi',icon:'🪜',grade:'2) 8) 5) · Z 1–20',max:20,clue:'shell'},
    orbital:{name:'Orbital dizilimi',icon:'🌀',grade:'1s² 2s² 2p⁶ 3s¹ · Z 1–20',max:20,clue:'conf'},
    numara:{name:'Atom numarası',icon:'🔢',grade:'Yalnızca Z verilir · Z 1–36',max:36,clue:'z'},
    usta:{name:'Usta',icon:'🏆',grade:'Karışık ipucu, grup adları gizli · Z 1–36',max:36,clue:'mix',hide:true},
  };
  const TOTAL=10;
  let S=null;

  /* Periyot ve grubun adım adım açıklaması */
  function explain(z){
    const el=ELEMENTS[z-1],conf=ChemX.conf(z),per=Math.max(...conf.map(x=>x.n)),last=ChemX.last(conf),g=groupLabel(el.col);
    let txt=`En büyük katman numarası <b>${per}</b> → <b>${per}. periyot</b>. `;
    if(z===2) txt+='Helyumun 2 değerlik elektronu var ama o bir <b>soy gazdır</b>: <b>8A (18. grup)</b>.';
    else if(last.l===2){
      const s=conf.find(x=>x.n===per&&x.l===0),sum=s.e+last.e;
      txt+=`Dizilim <b>d</b> ile bitiyor → <b>B grubu</b>. ${ChemX.subHTML(s)} + ${ChemX.subHTML(last)} → ${s.e} + ${last.e} = <b>${sum}</b> → <b>${g}</b> (${el.col}. grup).`;
      if(sum>=8&&sum<=10) txt+=' <i>Toplam 8, 9 ya da 10 ise 8B grubudur.</i>';
      if(sum>=11) txt+=' <i>Toplam 11 ise 1B, 12 ise 2B grubudur.</i>';
    } else {
      const outer=conf.filter(x=>x.n===per),val=outer.reduce((t,x)=>t+x.e,0);
      txt+=`Dizilim <b>${LCHAR[last.l]}</b> ile bitiyor → <b>A grubu</b>. Son katmandaki elektronlar: ${outer.map(ChemX.subHTML).join(' + ')} = <b>${val}</b> → <b>${g}</b> (${el.col}. grup).`;
    }
    return txt;
  }
  function clueHTML(z,kind){
    const conf=ChemX.conf(z);
    if(kind==='shell') return {label:'Katman dizilimi',html:shellsOf(z,z).map(n=>`${n})`).join(' ')};
    if(kind==='conf') return {label:'Elektron dizilimi',html:ChemX.confHTML(conf)};
    if(kind==='short') return {label:'Elektron dizilimi',html:ChemX.shortHTML(conf)};
    return {label:'Atom numarası',html:'Z = '+z};
  }

  function mount(app){
    const prof=Store.profile();
    app.innerHTML=`<section class="screen grup">
      <h1 class="screen-title">🔍 Grup Bul</h1>
      <p class="sub">Elementin ipucundan <b>periyodunu</b> ve <b>grubunu</b> bul, boş periyodik tablodaki yerine dokun. Her doğru cevapta tablo biraz daha dolar! Her turda ${TOTAL} element var.</p>
      <div class="panel gb-howto">
        <div><b>📏 Periyot</b> = en büyük katman numarası (n)</div>
        <div><b>🅰️ A grubu</b>: dizilim <b>s</b> ya da <b>p</b> ile biter → son katmandaki elektron sayısı</div>
        <div><b>🅱️ B grubu</b>: dizilim <b>d</b> ile biter → <b>s + d</b> elektron sayısı</div>
      </div>
      <div class="mode-pick">${Object.entries(LEVELS).map(([k,l])=>{const b=(prof.games['grup_'+k]||{}).best||0;
        return `<button class="mode-card gb-lv" data-l="${k}"><div class="mi">${l.icon}</div><h4>${l.name}</h4><p>${l.grade}</p><p style="margin-top:6px;color:var(--gold)">🏆 En iyi: ${b}/${TOTAL}</p></button>`;}).join('')}</div>
    </section>`;
    $$('.gb-lv',app).forEach(b=>b.onclick=()=>{FX.sfx.pop();start(app,b.dataset.l);});
  }

  function start(app,lv){
    const L=LEVELS[lv];
    const kinds=['shell','conf','z','short'];
    S={app,lv,i:0,correct:0,res:[],locked:false,
      list:shuffle(ELEMENTS.slice(0,L.max).map(e=>e.z)).slice(0,TOTAL).map((z,k)=>({z,kind:L.clue==='mix'?kinds[(k+Math.floor(Math.random()*4))%4]:L.clue}))};
    app.innerHTML=`<section class="screen grup">
      <div class="q-hud" style="grid-template-columns:1fr auto">
        <div><div class="q-progress" id="gbdots"></div><div class="q-count" id="gbcount"></div></div>
        <div class="score-box"><span>DOĞRU</span><b id="gbscore">0</b></div>
      </div>
      <div class="challenge-bar gb-clue-bar"><div class="cn" id="gblabel"></div><div class="gb-clue fml" id="gbclue"></div>
        <div class="ct muted" style="font-size:14px;min-width:160px">Bu element tabloda nerede? Hücresine dokun.</div></div>
      <div class="panel" style="margin-top:12px"><div class="gb-swipe">↔ Tabloyu parmağınla sağa sola kaydırabilirsin</div><div class="gb-wrap"><div class="gb-table ${L.hide?'nohead':''}" id="gbtable"></div></div>
        <div class="legend">${Object.values(CAT_INFO).map(c=>`<span><i style="background:${c.color}"></i>${c.name}</span>`).join('')}</div></div>
      <div id="gbmsg"></div>
    </section>`;
    buildTable();
    question();
  }
  function buildTable(){
    const L=LEVELS[S.lv],h=[];
    h.push('<span></span>');
    for(let c=1;c<=18;c++) h.push(`<span class="gb-h">${L.hide?'?':groupLabel(c)}<small>${c}</small></span>`);
    for(let p=1;p<=4;p++){
      h.push(`<span class="gb-p">${p}</span>`);
      for(let c=1;c<=18;c++){
        const el=ELEMENTS.find(e=>e.period===p&&e.col===c);
        if(!el){h.push('<span></span>');continue;}
        const dim=el.z>L.max;
        h.push(`<button class="gb-cell ${dim?'dim':''}" data-p="${p}" data-c="${c}" style="--cat:${CAT_INFO[el.cat].color}" aria-label="${p}. periyot, ${groupLabel(c)} grubu" ${dim?'tabindex="-1"':''}></button>`);
      }
    }
    $('#gbtable').innerHTML=h.join('');
    $$('.gb-cell',S.app).forEach(b=>b.onclick=()=>pick(b));
  }
  function dots(){
    $('#gbdots').innerHTML=Array.from({length:TOTAL},(_,k)=>`<i class="${k===S.i?'cur':S.res[k]===true?'ok':S.res[k]===false?'no':''}"></i>`).join('');
    $('#gbcount').textContent=`Soru ${S.i+1} / ${TOTAL}`;
  }
  function question(){
    S.locked=false;dots();
    const q=S.list[S.i],c=clueHTML(q.z,q.kind);
    $('#gblabel').textContent=c.label;
    $('#gbclue').innerHTML=c.html;
    const bar=$('.gb-clue-bar',S.app);bar.style.animation='none';void bar.offsetWidth;bar.style.animation='';
    $('#gbmsg').innerHTML='';
    $$('.gb-cell.bad',S.app).forEach(b=>b.classList.remove('bad'));
    $$('.gb-cell.reveal',S.app).forEach(b=>b.classList.remove('reveal'));
  }
  function pick(b){
    if(S.locked||b.classList.contains('fill')||b.classList.contains('miss')) {if(!S.locked) FX.sfx.down();return;}
    S.locked=true;
    const q=S.list[S.i],el=ELEMENTS[q.z-1];
    const p=+b.dataset.p,c=+b.dataset.c,ok=p===el.period&&c===el.col;
    const target=$(`.gb-cell[data-p="${el.period}"][data-c="${el.col}"]`);
    target.textContent=el.sym;
    S.res[S.i]=ok;
    if(ok){
      S.correct++;$('#gbscore').textContent=S.correct;
      target.classList.add('fill');
      FX.sfx.correct();FX.celebrate(target);
    } else {
      b.classList.add('bad');
      target.classList.add('miss','reveal');
      FX.sfx.wrong();
    }
    dots();
    const w=$('.gb-wrap',S.app);
    if(w.scrollWidth>w.clientWidth) w.scrollLeft=target.offsetLeft-w.clientWidth/2+target.offsetWidth/2; // anında: dikey yumuşak kaydırma yataydakini iptal ediyor
    const last=S.i>=TOTAL-1;
    $('#gbmsg').innerHTML=`<div class="orb-msg ${ok?'good':'bad'}">
      ${ok?`✅ <b>Doğru! ${el.name} (${el.sym})</b> — ${el.period}. periyot, ${groupLabel(el.col)} grubu.`:`❌ Senin seçtiğin: <b>${p}. periyot, ${groupLabel(c)}</b>. Doğrusu: <b>${el.name} (${el.sym})</b> — ${el.period}. periyot, ${groupLabel(el.col)} grubu.`}
      <div class="gb-why">${q.kind!=='conf'&&q.kind!=='short'?`<span class="fml">${ChemX.confHTML(ChemX.conf(q.z),true)}</span><br>`:''}${explain(q.z)}</div></div>
      <div style="text-align:center"><button class="btn btn-big btn-primary" id="gbnext">${last?'Sonuçlar 🏁':'Devam ▶'}</button></div>`;
    $('#gbnext').onclick=()=>{FX.sfx.click();if(last) return finish();S.i++;question();};
    $('#gbmsg').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function finish(){
    const {correct,lv,app}=S;
    const stars=correct>=9?3:correct>=7?2:correct>=5?1:0;
    const res=Game.finishArcade('grup_'+lv,{score:correct,xp:correct*4+stars*5,badge:correct===TOTAL?'grup10':null});
    stars?FX.sfx.win():FX.sfx.lose();if(stars>=2) FX.confetti(150);
    UI.modal({title:'🔍 Tur bitti!',dismiss:false,html:`<div style="text-align:center">
      <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
      <div class="big-score">${correct} / ${TOTAL}</div><p class="muted">${res.newBest?'🎉 YENİ REKOR!':'En iyi: '+res.best+' / '+TOTAL}</p></div>`,
      buttons:[{label:'Seviye seç',cls:'btn-ghost',onClick:()=>mount(app)},{label:'🔁 Tekrar',cls:'btn-good',onClick:()=>start(app,lv)}]});
  }
  function unmount(){S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/ph.js */
'use strict';
/* =========================================================
   pH Laboratuvarı — titrasyon ve indikatör simülasyonu
   Model: kuvvetli asit (HCl) / kuvvetli baz (NaOH), 25 °C
   ========================================================= */
const PH_START = {
  water:{name:'💧 Saf su (50 mL)',V:.05,pH:7},
  hcl:{name:'🧪 HCl çözeltisi 0,1 M (50 mL)',V:.05,net:.005},
  naoh:{name:'🧪 NaOH çözeltisi 0,1 M (50 mL)',V:.05,net:-.005},
  lemon:{name:'🍋 Limon suyu (≈ pH 2,3)',V:.05,pH:2.3},
  vinegar:{name:'🍶 Sirke (≈ pH 2,9)',V:.05,pH:2.9},
  milk:{name:'🥛 Süt (≈ pH 6,6)',V:.05,pH:6.6},
  soda:{name:'🧁 Kabartma tozu çözeltisi (≈ pH 8,3)',V:.05,pH:8.3},
  soap:{name:'🧼 Sabunlu su (≈ pH 10)',V:.05,pH:10},
  bleach:{name:'🧴 Çamaşır suyu (≈ pH 12,5)',V:.05,pH:12.5},
};
const INDICATORS = {
  none:'İndikatör yok',universal:'Evrensel indikatör',litmus:'Turnusol',phenol:'Fenolftalein',methyl:'Metil oranj',btb:'Bromtimol mavisi'
};
const PH_TASKS = [
  {id:'p1',text:'HCl çözeltisini NaOH ekleyerek **nötralleştir** (pH 6,5–7,5).',check:s=>s.start==='hcl'&&s.pH>=6.5&&s.pH<=7.5},
  {id:'p2',text:'**Fenolftalein** ekle ve çözeltiyi **pembeye** çevir.',check:s=>s.ind==='phenol'&&s.pH>=9},
  {id:'p3',text:'Saf sudan başlayıp asit damlatarak pH\'ı **3**\'e getir (2,8–3,2).',check:s=>s.start==='water'&&s.pH>=2.8&&s.pH<=3.2},
  {id:'p4',text:'**Turnusol** ile bir ev maddesinin bazik olduğunu göster (mavi renk).',check:s=>s.ind==='litmus'&&s.pH>8.3&&['soda','soap','bleach'].includes(s.start)},
];

const PHLab = (()=>{
  let S=null;
  function netFromPH(pH,V){ // net = n(H+) − n(OH−) (mol)
