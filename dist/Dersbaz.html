<script>
/* js/ui.js */
'use strict';
/* Küçük yardımcılar + modal/toast */
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(sel,root=document){return root.querySelector(sel);}
function $$(sel,root=document){return [...root.querySelectorAll(sel)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtNum(x,d=2){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}

const UI = {
  modal({title='',html='',buttons=[{label:'Tamam',cls:'btn-primary'}],dismiss=true,wide=false,onOpen}={}){
    const root=$('#modal-root');
    const wrap=document.createElement('div');
    wrap.className='modal-back';
    wrap.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${title?`<h2 class="modal-title">${title}</h2>`:''}<div class="modal-body">${html}</div><div class="modal-actions"></div></div>`;
    const acts=$('.modal-actions',wrap);
    const close=()=>{wrap.classList.add('out');setTimeout(()=>wrap.remove(),200);};
    buttons.forEach(b=>{
      const el=document.createElement('button');
      el.className='btn '+(b.cls||'btn-primary');
      el.innerHTML=b.label;
      el.onclick=()=>{const r=b.onClick?b.onClick(wrap):undefined; if(r!==false) close();};
      acts.appendChild(el);
    });
    if(!buttons.length) acts.remove();
    if(dismiss) wrap.addEventListener('click',e=>{if(e.target===wrap) close();});
    root.appendChild(wrap);
    if(onOpen) onOpen(wrap,close);
    return {el:wrap,close};
  },
  confirm(msg,onYes,{yes='Evet',no='Vazgeç',danger=false,title='Emin misin?'}={}){
    return UI.modal({title,html:`<p>${msg}</p>`,buttons:[{label:no,cls:'btn-ghost'},{label:yes,cls:danger?'btn-danger':'btn-primary',onClick:onYes}]});
  },
  toast(msg,kind='info',ms=2800){
    const el=document.createElement('div');
    el.className='toast '+kind;
    el.innerHTML=msg;
    $('#toast-root').appendChild(el);
    setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},ms);
  },
  download(filename,text,type='application/json'){
    const blob=new Blob([text],{type});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }
};

</script>

/* =========================================================
   Iconify — arayüzdeki emojileri ekrana basılırken çizgi ikona çevirir.
   İçerik emojilerine (soru şıkları, maskot, pizza müşterileri,
   sayma nesneleri, avatarlar, formlar) dokunmaz.
   ========================================================= */
const Iconify = (()=>{
  const MAP={
    '🎯':'target','⚖️':'scale','⚛️':'atom','🌀':'orbit','🧪':'flask','⚗️':'flask','📐':'ruler','🎈':'balloon','🛠️':'sliders',
    '📚':'book','📖':'book','📘':'book','🍕':'pizza','⏰':'clock','⏱️':'clock','📈':'chart','🧒':'user','🎓':'book','🌟':'sparkle',
    '💡':'bulb','✂️':'scissors','⏳':'hourglass','🔥':'fire','❤️':'heart','⭐':'star','🏆':'trophy','🔁':'refresh','↺':'refresh',
    '🏠':'home','✅':'check','❌':'x','✔':'check','✔️':'check','🔬':'eye','📊':'bars','🏅':'medal','🔐':'lock','🔒':'lock','📝':'edit',
    '👁️':'eye','✏️':'edit','🗑️':'trash','➕':'plus','➖':'minus','🔍':'search','💾':'save','⬇️':'download','⬆️':'upload',
    '♻️':'recycle','⚙️':'settings','🎮':'play','🦸':'user','🧘':'leaf','💀':'skull','🌈':'sparkle','🔢':'hash','🎲':'dice',
    '🔷':'shapes','🔗':'link','🥽':'goggles','🧊':'cube','💨':'layers','⚡':'bolt','🧽':'eraser','↶':'undo','🏁':'flag',
    '🛵':'arrow','🛎️':'bell','🪙':'coin','🆙':'bolt','👋':'sparkle','👤':'user','🎉':'sparkle','💪':'fire','👍':'check',
    '⚠️':'alert','🧮':'root','🧬':'layers','🧲':'magnet','💎':'diamond','💧':'drop','🌡️':'thermo','📦':'cube','❄️':'snow',
    '🗂️':'layers','🔊':'volume','🔇':'mute','⛶':'expand','🎨':'palette','🌿':'leaf','🌍':'globe','🔴':null,'🔵':null,
    '🗓️':'clock','🧠':'brain','🛡️':'shield','💥':'bolt','✨':'sparkle','🥇':'medal','🔙':'back','🚀':'arrow','🛑':'x','🪜':'stairs','🚫':'ban','🚌':'bus',
  };
  const keys=Object.keys(MAP).filter(k=>MAP[k]).sort((a,b)=>b.length-a.length);
  const pat=keys.map(k=>k.replace(/️/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const reTest=new RegExp('(?:'+pat+')');
  const reAll=new RegExp('('+pat+')\\uFE0F?','g');
  const keyOf=m=>MAP[m]||MAP[m+'️'];
  const SKIP='svg,option,select,textarea,input,script,style,title,.vis,.q-stem,.pz-face,.cloud,.v-emoji,.v-count,.avatar,.avatar-pick,.q-text,.fb-body,.cap,.bal-context,.pz-bubble,.no-ic,.review-item h4,.review-item p,.facts,.mascot';
  function fix(n){
    const v=n.nodeValue;if(!v||!reTest.test(v)) return;
    const p=n.parentElement;if(!p||p.closest(SKIP)) return;
    const tmp=document.createElement('span');
    tmp.innerHTML=esc(v).replace(reAll,m=>{const k=keyOf(m.replace(/️$/,''));return k?I(k):m;});
    n.replaceWith(...tmp.childNodes);
  }
  function run(root){
    if(!root) return;
    if(root.nodeType===3) return fix(root);
    if(root.nodeType!==1) return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const list=[];while(w.nextNode()) list.push(w.currentNode);
    list.forEach(fix);
  }
  function start(){
    run(document.body);
    new MutationObserver(recs=>{
      for(const r of recs){
        if(r.type==='characterData') fix(r.target);
        else r.addedNodes.forEach(run);
      }
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  return {run,start,MAP};
})();

/* ---------- Formül çözümleme ---------- */
function parseFormula(formula){
  const clean=String(formula).replace(/\((s|l|g|k|aq|suda)\)/g,'').replace(/\s/g,'');
  const parts=clean.split(/[·.]/);
  const total={};
  parts.forEach((part,pi)=>{
    let mult=1;
    let f=part;
    const m=f.match(/^(\d+)/);
    if(m){ if(pi>0) mult=parseInt(m[1]); f=f.slice(m[1].length); }
    let i=0;
    const readNum=()=>{let s='';while(i<f.length&&/\d/.test(f[i])){s+=f[i];i++;}return s?parseInt(s):1;};
    const group=()=>{
      const counts={};
      while(i<f.length){
        const ch=f[i];
        if(ch==='('||ch==='['){
          i++; const inner=group();
          if(f[i]!==')'&&f[i]!==']') throw new Error('Parantez kapanmamış: '+formula);
          i++; const n=readNum();
          for(const k in inner) counts[k]=(counts[k]||0)+inner[k]*n;
        } else if(ch===')'||ch===']'){ return counts; }
        else if(/[A-Z]/.test(ch)){
          let sym=ch;i++;
          while(i<f.length&&/[a-z]/.test(f[i])){sym+=f[i];i++;}
          const n=readNum();
          counts[sym]=(counts[sym]||0)+n;
        } else throw new Error('Geçersiz karakter "'+ch+'" : '+formula);
      }
      return counts;
    };
    const c=group();
    if(i<f.length) throw new Error('Fazla kapanan parantez: '+formula);
    for(const k in c) total[k]=(total[k]||0)+c[k]*mult;
  });
  if(!Object.keys(total).length) throw new Error('Boş formül');
  return total;
}
function formulaMass(counts){let m=0;for(const k in counts){m+=(molarMassOf(k)||0)*counts[k];}return m;}

/* Formülü HTML'e çevir: H2O → H₂O, Na^+ → Na⁺, -> → → */
function formatFormula(s){
  s=String(s);
  let out='',i=0,termStart=true;
  while(i<s.length){
    const ch=s[i];
    if(s.startsWith('<->',i)){out+=' ⇌ ';i+=3;termStart=true;continue;}
    if(s.startsWith('->',i)){out+=' → ';i+=2;termStart=true;continue;}
    if(ch==='^'){
      i++;let sup='';
      while(i<s.length&&/[0-9+\-]/.test(s[i])){sup+=s[i];i++;}
      out+='<sup>'+esc(sup).replace(/-/g,'−')+'</sup>';continue;
    }
    if(ch==='_'){
      i++;let sub='';
      while(i<s.length&&/\d/.test(s[i])){sub+=s[i];i++;}
      out+='<sub>'+sub+'</sub>';continue;
    }
    if(/\d/.test(ch)){
      let num='';while(i<s.length&&/\d/.test(s[i])){num+=s[i];i++;}
      out+= termStart? num : '<sub>'+num+'</sub>';
      continue;
    }
    if(ch==='('){
      const m=s.slice(i).match(/^\(([a-zçğıöşü]+)\)/);
      if(m){out+='<small>('+esc(m[1])+')</small>';i+=m[0].length;continue;}
    }
    if(ch===' '){out+=' ';termStart=true;i++;continue;}
    if(ch==='·'){out+='·';termStart=true;i++;continue;}
    if(ch==='+'){out+=' + ';termStart=true;i++;continue;}
    out+=esc(ch);termStart=false;i++;
  }
  return out.replace(/\s{2,}/g,' ');
}

/* Metin içindeki {formül} parçalarını biçimlendir, **kalın**, satır sonları */
function richText(t){
  if(t==null||t==='') return '';
  t=String(t);
  let out='',last=0;
  const re=/\{([^{}]+)\}|\$([^$]+)\$/g;let m;
  while((m=re.exec(t))){

  return out.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}

/* ---------- Denklemler ---------- */
function parseEquation(str){
  const s=String(str).replace(/→|⟶|=>|⇒/g,'->').replace(/=/g,'->');
  const parts=s.split('->');
  if(parts.length!==2) throw new Error('Denklemde tek bir ok ( -> ) olmalı.');
  const side=p=>p.split('+').map(x=>x.trim()).filter(Boolean).map(x=>{
    const formula=x.replace(/^\d+\s*/,'').replace(/\((s|l|g|k|aq|suda)\)/g,'').trim();
    const counts=parseFormula(formula);
    for(const k in counts) if(!isKnownSymbol(k)) throw new Error('Bilinmeyen element sembolü: '+k);
    return {formula,counts};
  });
  const left=side(parts[0]), right=side(parts[1]);
  if(!left.length||!right.length) throw new Error('Girenler ve ürünler boş olamaz.');
  const le=new Set(left.flatMap(x=>Object.keys(x.counts))), re=new Set(right.flatMap(x=>Object.keys(x.counts)));
  for(const e of le) if(!re.has(e)) throw new Error(e+' elementi ürünlerde yok.');
  for(const e of re) if(!le.has(e)) throw new Error(e+' elementi girenlerde yok.');
  return {left,right};
}
function eqElements(eq){return [...new Set([...eq.left,...eq.right].flatMap(x=>Object.keys(x.counts)))];}
function sideCount(sideArr,coefs,el){let s=0;sideArr.forEach((x,i)=>{s+=(x.counts[el]||0)*coefs[i];});return s;}
function isBalanced(eq,coefs){
  const L=coefs.slice(0,eq.left.length), R=coefs.slice(eq.left.length);
  return eqElements(eq).every(el=>sideCount(eq.left,L,el)===sideCount(eq.right,R,el));
}
function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
function gcdArr(a){return a.reduce((g,x)=>gcd(g,x));}
/* Kaba kuvvetle en küçük tam sayı katsayıları bul */
function solveEquation(eq,maxC){
  const sp=[...eq.left.map(x=>({c:x.counts,s:1})),...eq.right.map(x=>({c:x.counts,s:-1}))];
  const n=sp.length;
  if(n>6) return null;
  maxC=maxC||(n<=4?16:n===5?12:9);
  const els=eqElements(eq);
  const M=els.map(e=>sp.map(x=>(x.c[e]||0)*x.s));
  const coef=new Array(n).fill(1);
  let found=null;
  const rec=k=>{
    if(found) return;
    if(k===n){
      for(const row of M){let sum=0;for(let j=0;j<n;j++) sum+=row[j]*coef[j];if(sum!==0) return;}
      found=coef.slice();return;
    }
    for(let v=1;v<=maxC&&!found;v++){coef[k]=v;rec(k+1);}
  };
  rec(0);
  if(found){const g=gcdArr(found);if(g>1) found=found.map(x=>x/g);}
  return found;
}
function equationString(eq,coefs){
  const fmt=(x,i)=>((coefs&&coefs[i]>1)?coefs[i]:'')+x.formula;
  const L=eq.left.map((x,i)=>fmt(x,i)).join(' + ');
  const R=eq.right.map((x,i)=>fmt(x,i+eq.left.length)).join(' + ');
  return L+' -> '+R;
}

/* ---------- Elektron dizilimi ---------- */
const SUBSHELLS=[[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1]];
const LCHAR='spdf';
function aufbau(e){
  const res=[];let left=e;
  for(const [n,l] of SUBSHELLS){if(left<=0)break;const c=Math.min(left,2*(2*l+1));res.push({n,l,e:c});left-=c;}
  return res;
}
function electronConfig(p,e){
  if(e<=0) return [];
  if(e<=p){
    const conf=aufbau(p);
    if(p===24||p===29){ // Cr ve Cu istisnaları
      const s4=conf.find(x=>x.n===4&&x.l===0), d3=conf.find(x=>x.n===3&&x.l===2);
      if(s4&&d3){s4.e=1;d3.e+=1;}
    }
    let remove=p-e;
    while(remove>0){
      let pick=null;
      for(const x of conf){ if(x.e>0 && (!pick || x.n>pick.n || (x.n===pick.n && x.l>pick.l))) pick=x; }
      if(!pick) break;
      pick.e--;remove--;
    }
    return conf.filter(x=>x.e>0);
  }
  return aufbau(e);
}
const SUPS='⁰¹²³⁴⁵⁶⁷⁸⁹';
function supNum(n){return String(n).split('').map(d=>SUPS[+d]).join('');}
function configString(conf){return conf.map(x=>x.n+LCHAR[x.l]+supNum(x.e)).join(' ');}
function shellsOf(p,e){
  const conf=electronConfig(p,e);
  const sh=[];conf.forEach(x=>{sh[x.n-1]=(sh[x.n-1]||0)+x.e;});
  for(let i=0;i<sh.length;i++) if(!sh[i]) sh[i]=0;
  while(sh.length&&!sh[sh.length-1]) sh.pop();
  return sh;
}

  function graphSVG({expr='x',range=6}={}){
    const R=+range||6,S=200,P=10,W=S-2*P;
    const X=x=>P+(x+R)/(2*R)*W, Y=y=>P+(R-y)/(2*R)*W;
    let s=`<svg viewBox="0 0 ${S} ${S}" class="v-graph"><rect x="${P}" y="${P}" width="${W}" height="${W}" rx="6" style="fill:var(--sv-panel)"/>`;
    for(let i=-R;i<=R;i++){s+=`<line x1="${X(i)}" y1="${P}" x2="${X(i)}" y2="${S-P}" style="stroke:var(--sv-ink)" stroke-opacity=".12"/><line x1="${P}" y1="${Y(i)}" x2="${S-P}" y2="${Y(i)}" style="stroke:var(--sv-ink)" stroke-opacity=".12"/>`;}
    s+=`<line x1="${P}" y1="${Y(0)}" x2="${S-P}" y2="${Y(0)}" style="stroke:var(--sv-ink)" stroke-opacity=".8" stroke-width="1.8"/><line x1="${X(0)}" y1="${P}" x2="${X(0)}" y2="${S-P}" style="stroke:var(--sv-ink)" stroke-opacity=".8" stroke-width="1.8"/>`;
    for(let i=-R;i<=R;i+=2){if(!i) continue;
      s+=`<text x="${X(i)}" y="${Y(0)+12}" text-anchor="middle" font-size="9" style="fill:var(--sv-ink)" fill-opacity=".75" font-family="Nunito" font-weight="800">${num(i)}</text><text x="${X(0)-4}" y="${Y(i)+3}" text-anchor="end" font-size="9" style="fill:var(--sv-ink)" fill-opacity=".75" font-family="Nunito" font-weight="800">${num(i)}</text>`;}
    s+=`<text x="${S-P-4}" y="${Y(0)-5}" text-anchor="end" font-size="11" style="fill:var(--sv-ink)" font-style="italic">x</text><text x="${X(0)+5}" y="${P+11}" font-size="11" style="fill:var(--sv-ink)" font-style="italic">y</text>`;
    try{
      const f=compile(expr);let d='',pen=false;
      for(let i=0;i<=400;i++){
        const x=-R+i*2*R/400,y=f(x);
        if(!isFinite(y)||Math.abs(y)>R*4){pen=false;continue;}
        d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true;
      }
      const id='gc'+Math.random().toString(36).slice(2,8);
      s+=`<clipPath id="${id}"><rect x="${P}" y="${P}" width="${W}" height="${W}"/></clipPath><path d="${d}" clip-path="url(#${id})" fill="none" style="stroke:var(--sv-line)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }catch(e){s+=`<text x="100" y="105" text-anchor="middle" fill="#fca5a5" font-size="11">${esc(e.message)}</text>`;}
    return s+'</svg>';
  }
  const SHAPES={triangle:'Üçgen',square:'Kare',rectangle:'Dikdörtgen',circle:'Daire',pentagon:'Beşgen',hexagon:'Altıgen',octagon:'Sekizgen',rhombus:'Eşkenar dörtgen',trapezoid:'Yamuk',right:'Dik üçgen'};
  function regular(n,r=78,rot=-90){let p='';for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;p+=`${(100+Math.cos(a)*r).toFixed(1)},${(104+Math.sin(a)*r).toFixed(1)} `;}return p;}
  function shapeSVG({shape='triangle'}={}){
    const C={triangle:'#f43f5e',square:'#3b82f6',rectangle:'#10b981',circle:'#f59e0b',pentagon:'#8b5cf6',hexagon:'#06b6d4',octagon:'#ec4899',rhombus:'#84cc16',trapezoid:'#fb923c',right:'#e11d48'}[shape]||'#94a3b8';

    let body;
    switch(shape){
      case 'square': body=`<rect x="34" y="34" width="132" height="132" rx="4" ${st}/>`;break;
      case 'rectangle': body=`<rect x="16" y="56" width="168" height="94" rx="4" ${st}/>`;break;
      case 'circle': body=`<circle cx="100" cy="100" r="78" ${st}/>`;break;
      case 'rhombus': body=`<polygon points="100,18 170,100 100,182 30,100" ${st}/>`;break;
      case 'trapezoid': body=`<polygon points="58,50 142,50 186,156 14,156" ${st}/>`;break;
      case 'right': body=`<polygon points="32,168 32,36 172,168" ${st}/><rect x="32" y="148" width="20" height="20" fill="none" style="stroke:var(--sv-ink)" stroke-width="2.5"/>`;break;
      case 'pentagon': body=`<polygon points="${regular(5)}" ${st}/>`;break;
      case 'hexagon': body=`<polygon points="${regular(6,80,0)}" ${st}/>`;break;
      case 'octagon': body=`<polygon points="${regular(8,80,-67.5)}" ${st}/>`;break;
      default: body=`<polygon points="${regular(3,86)}" ${st}/>`;
    }
    return `<svg viewBox="0 0 200 200" class="v-shape">${body}</svg>`;
  }
  function parseCount(items){
    return String(items||'').split(',').map(x=>x.trim()).filter(Boolean).map(p=>{
      const i=p.lastIndexOf('*');
      return i<0?{e:p,n:1}:{e:p.slice(0,i).trim(),n:clamp(parseInt(p.slice(i+1))||1,1,30)};
    }).filter(g=>g.e);
  }
  function countHTML({items=''}={}){
    const g=parseCount(items);const total=g.reduce((t,x)=>t+x.n,0);

  }
  return {compile,format,num,timePhrase,digital,fractionSVG,clockSVG,graphSVG,shapeSVG,countHTML,parseCount,SHAPES,pieSlice};
})();

<script>
/* js/store.js */
'use strict';
/* Yerel depolama (tarayıcı localStorage) */
const Store = (()=>{
  const P='ko_';
  const clone=o=>JSON.parse(JSON.stringify(o));
  // Bazı ortamlarda (ör. Android'de dosyadan açılan sayfa) localStorage kapalıdır: bellekte tutarız.
  const LS=(()=>{try{const t='__ko_test';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}catch(e){return null;}})();
  const mem={};
  function raw(k){return LS?LS.getItem(P+k):(P+k in mem?mem[P+k]:null);}
  function get(k,d){try{const v=raw(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
  function set(k,v){
    const s=JSON.stringify(v);
    if(!LS){mem[P+k]=s;return true;}
    try{LS.setItem(P+k,s);return true;}
    catch(e){UI.toast('⚠️ Kaydedilemedi: tarayıcı depolama alanı dolmuş olabilir. Büyük görselleri küçültmeyi deneyin.','bad',5000);return false;}
  }
  function del(k){if(!LS){delete mem[P+k];return;}try{LS.removeItem(P+k);}catch(e){}}
  return {
    get,set,del,clone,persistent:!!LS,
    questions(){
      const q=get('questions',null);
      if(!q) return clone(DEFAULT_QUESTIONS);
      const seen=get('seenDefaults',null)||DEFAULT_V1_IDS;
      const have=new Set(q.map(x=>x.id));
      const missing=DEFAULT_QUESTIONS.filter(d=>!seen.includes(d.id)&&!have.has(d.id));
      if(missing.length){q.push(...clone(missing));set('questions',q);set('seenDefaults',DEFAULT_QUESTIONS.map(d=>d.id));}
      return q;
    },
    saveQuestions(a){set('seenDefaults',DEFAULT_QUESTIONS.map(d=>d.id));return set('questions',a);},
    equations(){return get('equations',null)||clone(DEFAULT_EQUATIONS);},
    saveEquations(a){return set('equations',a);},
    profile(){
      const def={name:'',avatar:'🧑‍🔬',xp:0,badges:[],best:0,balance:{},atomDone:[],phDone:[],orbital:{},levels:{},games:{},bestBy:{},gasDone:[],
        stats:{answered:0,correct:0,games:0,bestCombo:0}};
      const p=Object.assign(def,get('profile',{}));
      p.stats=Object.assign(def.stats,p.stats||{});
      return p;
    },
    saveProfile(p){set('profile',p);},
    settings(){return Object.assign({pin:'1234',sound:true,subject:null},get('settings',{}));},
    saveSettings(s){set('settings',s);},
  };
})();

</script>
<script>
/* js/fx.js */
'use strict';
/* =========================================================
   Efekt motoru: ses (WebAudio), konfeti/parçacık, yazılar,
   ekran sarsıntısı, arka plan molekülleri
   ========================================================= */
const FX = (()=>{
  /* ---- Ses ---- */
  let actx=null;
  let soundOn=Store.settings().sound!==false;
  function ac(){
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
    if(actx.state==='suspended') actx.resume();
    return actx;
  }
  function tone(f,d=.15,type='sine',vol=.15,delay=0,slide=0){
    if(!soundOn) return;
    const a=ac(); if(!a) return;
    const t=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t+d+.05);
  }
  const sfx={
    click(){tone(660,.06,'triangle',.07);},
    pop(){tone(420,.09,'sine',.12,0,500);},
    correct(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.07));},
    wrong(){tone(220,.38,'sawtooth',.08,0,-120);tone(150,.42,'square',.05,.06,-50);},
    tick(){tone(1250,.035,'square',.035);},
    win(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.12,i*.1));},
    lose(){[392,349,311,262].forEach((f,i)=>tone(f,.32,'sine',.11,i*.18));},
    bubble(){tone(300+Math.random()*300,.08,'sine',.07,0,600);},
    drop(){tone(950,.1,'sine',.08,0,-600);},
    badge(){[784,988,1175,1568].forEach((f,i)=>tone(f,.3,'sine',.1,i*.09));},
    up(){tone(500,.07,'triangle',.07,0,200);},
    down(){tone(500,.07,'triangle',.07,0,-200);},
    combo(){[880,1109,1319].forEach((f,i)=>tone(f,.12,'square',.05,i*.05));},
  };
  function setSound(on){soundOn=on;const s=Store.settings();s.sound=on;Store.saveSettings(s);}

  /* ---- Parçacık / konfeti ---- */
  const cv=document.getElementById('fx-canvas');
  const c2=cv.getContext('2d');
  let parts=[],running=false;
  function resize(){
    const dpr=window.devicePixelRatio||1;
    cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
    c2.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener('resize',resize);
  const PALETTE=['#f43f5e','#f59e0b','#10b981','#8b5cf6','#0ea5e9','#fbbf24','#22d3ee','#f472b6'];
  function burst(x,y,n=40,colors=PALETTE,opt={}){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=(opt.speed||7)*(.35+Math.random());
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(opt.up??2),g:opt.g??.22,life:1,decay:.011+Math.random()*.014,
        size:(opt.size||7)*(.5+Math.random()),color:colors[i%colors.length],shape:opt.shape||(Math.random()<.5?'rect':'circle'),rot:Math.random()*6,vr:(Math.random()-.5)*.35});
    }
    loop();
  }
  function confetti(n=160){
    for(let i=0;i<n;i++){
      parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:.06,life:1,decay:.004+Math.random()*.004,
        size:6+Math.random()*7,color:PALETTE[i%PALETTE.length],shape:'rect',rot:Math.random()*6,vr:(Math.random()-.5)*.25,wob:Math.random()*10});
    }
    loop();
  }
  function bubbles(x,y,n=14){
    for(let i=0;i<n;i++) parts.push({x:x+(Math.random()-.5)*60,y,vx:(Math.random()-.5)*1.2,vy:-1-Math.random()*2.5,g:-.02,life:1,decay:.012+Math.random()*.01,size:4+Math.random()*8,color:'rgba(186,230,253,.9)',shape:'ring',rot:0,vr:0});
    loop();
  }
  function loop(){if(running) return;running=true;requestAnimationFrame(step);}
  function step(){
    c2.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life>0&&p.y<innerHeight+60);
    for(const p of parts){
      p.vy+=p.g; p.vx*=.99; p.x+=p.vx+(p.wob?Math.sin((p.wob+=.08))*.6:0); p.y+=p.vy; p.rot+=p.vr; p.life-=p.decay;
      c2.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));
      c2.save(); c2.translate(p.x,p.y); c2.rotate(p.rot);
      if(p.shape==='rect'){c2.fillStyle=p.color;c2.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}
      else if(p.shape==='ring'){c2.strokeStyle=p.color;c2.lineWidth=1.5;c2.beginPath();c2.arc(0,0,p.size/2,0,Math.PI*2);c2.stroke();}
      else if(p.shape==='star'){c2.fillStyle=p.color;starPath(c2,p.size);c2.fill();}
      else {c2.fillStyle=p.color;c2.beginPath();c2.arc(0,0,p.size/2,0,Math.PI*2);c2.fill();}
      c2.restore();
    }
    c2.globalAlpha=1;
    if(parts.length) requestAnimationFrame(step); else {running=false;c2.clearRect(0,0,innerWidth,innerHeight);}
  }
  function starPath(c,s){c.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.4:s;const a=i*Math.PI/5-Math.PI/2;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();}

  /* ---- Ekran efektleri ---- */
  function centerOf(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
  function floatText(x,y,text,color='#fbbf24'){
    const el=document.createElement('div');el.className='float-text';el.textContent=text;
    el.style.left=x+'px';el.style.top=y+'px';el.style.color=color;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1350);
  }
  function banner(text,kind='good',extra=''){
    const el=document.createElement('div');el.className='banner '+kind+' '+extra;el.textContent=text;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1300);
  }
  function flash(color='rgba(239,68,68,.35)'){
    const el=document.createElement('div');el.className='flash';el.style.background=`radial-gradient(ellipse at center, transparent 30%, ${color} 100%)`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),750);
  }
  function shake(el=document.getElementById('app')){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),500);}
  function celebrate(el){
    const c=el?centerOf(el):{x:innerWidth/2,y:innerHeight/2};
    burst(c.x,c.y,60,['#4ade80','#22c55e','#fbbf24','#fde68a','#ffffff']);
    burst(c.x,c.y,16,['#fbbf24','#fde68a'],{shape:'star',size:12,speed:9});
  }

  /* ---- Arka plan: süzülen moleküller ---- */
  const bg=document.getElementById('bg-canvas');
  const bc=bg.getContext('2d');
  let mols=[];
  function bgResize(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    bg.width=innerWidth*dpr;bg.height=innerHeight*dpr;bc.setTransform(dpr,0,0,dpr,0,0);
  }
  bgResize();addEventListener('resize',bgResize);
  const MCOL=['#22d3ee','#a78bfa','#f472b6','#fbbf24','#4ade80','#60a5fa'];
  for(let i=0;i<16;i++){
    const n=1+Math.floor(Math.random()*3);
    mols.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.25,vy:-.1-Math.random()*.25,rot:Math.random()*6,vr:(Math.random()-.5)*.004,
      r:8+Math.random()*16,n,c:MCOL[i%MCOL.length],c2:MCOL[(i+2)%MCOL.length]});
  }
  function bgStep(){
    if(getComputedStyle(bg).display==='none') return;
    if(!document.hidden){
      bc.clearRect(0,0,innerWidth,innerHeight);
      for(const m of mols){
        m.x+=m.vx;m.y+=m.vy;m.rot+=m.vr;
        if(m.y<-80){m.y=innerHeight+80;m.x=Math.random()*innerWidth;}
        if(m.x<-80) m.x=innerWidth+80; if(m.x>innerWidth+80) m.x=-80;
        bc.save();bc.translate(m.x,m.y);bc.rotate(m.rot);bc.globalAlpha=.11;
        const pts=[[0,0]];
        for(let k=0;k<m.n;k++){const a=k*2.1;pts.push([Math.cos(a)*m.r*1.7,Math.sin(a)*m.r*1.7]);}
        bc.strokeStyle='#fff';bc.lineWidth=3;
        for(let k=1;k<pts.length;k++){bc.beginPath();bc.moveTo(0,0);bc.lineTo(pts[k][0],pts[k][1]);bc.stroke();}
        pts.forEach((p,k)=>{bc.fillStyle=k?m.c2:m.c;bc.beginPath();bc.arc(p[0],p[1],k?m.r*.65:m.r,0,Math.PI*2);bc.fill();});
        bc.restore();
      }
    }
    requestAnimationFrame(bgStep);
  }
  requestAnimationFrame(bgStep);

  return {sfx,setSound,get soundOn(){return soundOn;},burst,confetti,bubbles,floatText,banner,flash,shake,celebrate,centerOf};
})();

</script>
<script>
/* js/render.js */
'use strict';
/* =========================================================
   Görsel motor: şık/soru görselleri (SVG)
   tipler: text, image, emoji, atom, particles, ghs
   ========================================================= */
const GHS_INFO = {
  flame:{name:'Yanıcı'},
  corrosive:{name:'Aşındırıcı (Korozif)'},
  skull:{name:'Akut Toksik (Zehirli)'},
  exclamation:{name:'Tahriş Edici / Zararlı'},
  explosive:{name:'Patlayıcı'},
  oxidizer:{name:'Yükseltgen'},
  gas:{name:'Basınçlı Gaz'},
  environment:{name:'Çevreye Zararlı'},
  health:{name:'Ciddi Sağlık Tehlikesi'},
};

const Visual = (()=>{
  function render(o){
    if(!o||!o.type||o.type==='none') return '';
    switch(o.type){
      case 'text':{
        const plain=String(o.value||'').replace(/[{}*$]/g,'').replace(/sqrt/g,'√');
        const cls=plain.length>44?'long':plain.length>11?'mid':'short';
        return `<div class="v-text ${cls}">${richText(o.value)}</div>`;
      }
      case 'image': return o.src?`<img class="v-img" src="${esc(o.src)}" alt="${esc(o.label||'görsel')}" draggable="false">`:'<div class="v-empty">Görsel seçilmedi</div>';
      case 'emoji': return `<div class="v-emoji">${esc(o.value||'❓')}</div>`;
      case 'atom': return atomSVG(o);
      case 'particles': return particlesSVG(o.spec,o.layout);
      case 'ghs': return ghsSVG(o.code);
      case 'orbital': return orbitalSVG(o.spec,true);
      case 'fraction': return MathX.fractionSVG(o);
      case 'clock': return MathX.clockSVG(o);
      case 'graph': return MathX.graphSVG(o);
      case 'shape': return MathX.shapeSVG(o);
      case 'count': return MathX.countHTML(o);
    }
    return '';
  }
  function caption(o){
    if(!o) return '';
    if(o.type==='atom'&&o.showLabel) return nuclideHTML(o.p,o.n,o.e)+(o.label?' '+richText(o.label):'');
    if(o.type==='ghs'&&o.showName) return esc(GHS_INFO[o.code]?.name||'');
    if(o.type==='shape'&&o.showName) return esc(MathX.SHAPES[o.shape]||'');
    return o.label?richText(o.label):'';
  }
  function nuclideHTML(p,n,e){
    const el=ELEMENTS[p-1];
    const sym=el?el.sym:'?';
    const c=p-e;
    return `<span class="nuclide"><span class="nz"><span>${p+n}</span><span>${p}</span></span>${sym}${c?`<span class="ch">${chargeStr(c)}</span>`:''}</span>`;
  }

  /* ---- Atom (Bohr modeli) ---- */
  function atomSVG({p=1,n=0,e=1,hideNucleus=false}){
    p=clamp(+p||1,1,36);n=clamp(+n||0,0,80);e=clamp(+e||0,0,40);
    const sh=shellsOf(p,e);const N=sh.length;
    const radii=sh.map((_,i)=>N===1?50:36+i*(54/(N-1)));
    let s=`<svg viewBox="0 0 200 200" class="v-atom">`;
    s+=``;
    radii.forEach(r=>{s+=`<circle cx="100" cy="100" r="${r.toFixed(1)}" fill="none" style="stroke:var(--sv-ink)" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="3 4"/>`;});
    s+=`<circle cx="100" cy="100" r="25" fill="#ea580c" stroke="#fdba74" stroke-width="2"/>`;
    s+=`<circle cx="92" cy="92" r="8" fill="#fff" opacity=".25"/>`;
    if(hideNucleus) s+=`<text x="100" y="109" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="700" font-size="26" fill="#fff">?</text>`;
    else s+=`<text x="100" y="98" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="600" font-size="13" fill="#fff">${p}p⁺</text><text x="100" y="113" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="600" font-size="13" fill="#fed7aa">${n}n</text>`;
    sh.forEach((cnt,i)=>{
      const r=radii[i];const dur=7+i*4;
      s+=`<g class="spin" style="transform-origin:100px 100px;animation-duration:${dur}s;${i%2?'animation-direction:reverse;':''}">`;
      for(let k=0;k<cnt;k++){
        const a=2*Math.PI*k/cnt-Math.PI/2;
        s+=`<circle cx="${(100+Math.cos(a)*r).toFixed(1)}" cy="${(100+Math.sin(a)*r).toFixed(1)}" r="5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>`;
      }
      s+='</g>';
    });
    s+='</svg>';
    return s;
  }

  /* ---- Tanecik modeli ---- */
  function parseSpec(spec){
    return String(spec||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean).map(part=>{
      const [m,c]=part.split('*');
      const atoms=(m||'').trim().match(/[A-Z][a-z]?/g)||[];
      return {atoms,count:clamp(parseInt(c)||1,1,40)};
    }).filter(g=>g.atoms.length);
  }
  function molOffsets(atoms,r){
    const n=atoms.length,d=r*1.55;
    if(n===1) return [[0,0]];
    if(n===2) return [[-d/2,0],[d/2,0]];
    if(n===3){
      if(atoms[1]!==atoms[0]&&['O','S'].includes(atoms[1])){
        const a=52*Math.PI/180;return [[-d*Math.sin(a),d*Math.cos(a)*.85],[0,0],[d*Math.sin(a),d*Math.cos(a)*.85]];
      }
      return [[-d,0],[0,0],[d,0]];
    }
    const out=[[0,0]];
    for(let k=1;k<n;k++){const a=2*Math.PI*(k-1)/(n-1);out.push([Math.cos(a)*d,Math.sin(a)*d]);}
    return out;
  }
  function ball(x,y,r,c){
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${c}" stroke="rgba(0,0,0,.4)" stroke-width="1"/><circle cx="${(x-r*.33).toFixed(1)}" cy="${(y-r*.33).toFixed(1)}" r="${(r*.3).toFixed(1)}" fill="#fff" opacity=".55"/>`;
  }
  function particlesSVG(spec,layout='gas'){
    const groups=parseSpec(spec);
    const W=200,H=160,pad=9;
    const nAtoms=groups.reduce((t,g)=>t+g.atoms.length*g.count,0)||1;
    const frac=(layout==='liquid'||layout==='solid')?.3:.17;
    const r=clamp(Math.sqrt(frac*(W-2*pad)*(H-2*pad)/(Math.PI*nAtoms)),5,10.5);
    const rand=rng(hashStr(spec+'|'+layout));
    const shapes=[];
    groups.forEach(g=>{for(let k=0;k<g.count;k++){const offs=molOffsets(g.atoms,r);shapes.push({atoms:g.atoms,offs,R:Math.max(...offs.map(o=>Math.hypot(o[0],o[1])))+r});}});
    const order=shuffleSeeded(shapes,rand);
    const placed=[];
    const top=layout==='liquid'?52:pad;
    if(layout==='solid'){
      const maxR=Math.max(r,...order.map(s=>s.R));const cell=maxR*2+1;
      const cols=Math.max(1,Math.floor((W-2*pad)/cell));
      const ox=(W-cols*cell)/2;
      order.forEach((s,i)=>{const row=Math.floor(i/cols),col=i%cols;placed.push({...s,x:ox+cell*col+cell/2,y:H-pad-cell*row-cell/2,rot:0});});
    } else {
      const gap=layout==='liquid'?.5:6;
      order.forEach(s=>{
        let best=null,bestD=-Infinity;
        for(let t=0;t<400;t++){
          const x=pad+s.R+rand()*(W-2*pad-2*s.R);
          const yr=(H-pad-top-2*s.R);
          const y=layout==='liquid'? top+s.R+(1-Math.pow(rand(),1.6))*yr : top+s.R+rand()*yr;
          let minD=Infinity;for(const p of placed){const d=Math.hypot(p.x-x,p.y-y)-(p.R+s.R);if(d<minD) minD=d;}
          if(minD>=gap){best={x,y};break;}
          if(minD>bestD){bestD=minD;best={x,y};}
        }
        placed.push({...s,x:best.x,y:best.y,rot:rand()*360});
      });
    }
    let svg=`<svg viewBox="0 0 ${W} ${H}" class="v-particles">`;
    svg+=`<rect x="3" y="3" width="${W-6}" height="${H-6}" rx="14" style="fill:var(--sv-fill);stroke:var(--sv-ink)" stroke-opacity=".7" stroke-width="2.5"/>`;
    if(layout==='liquid') svg+=`<path d="M5 ${top-6} Q 30 ${top-11} 55 ${top-6} T 105 ${top-6} T 155 ${top-6} T 195 ${top-6} V ${H-5} H5Z" fill="rgba(56,189,248,.16)"/>`;
    placed.sort((a,b)=>a.y-b.y).forEach(m=>{
      if(layout==='gas'||layout==='mix'){
        const a=rand()*Math.PI*2,cx=Math.cos(a),cy=Math.sin(a),nx=-cy*4,ny=cx*4;
        svg+=`<g style="stroke:var(--sv-ink)" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">`;
        [-1,1].forEach(sg=>{svg+=`<line x1="${(m.x-cx*(m.R+3)+nx*sg).toFixed(1)}" y1="${(m.y-cy*(m.R+3)+ny*sg).toFixed(1)}" x2="${(m.x-cx*(m.R+11)+nx*sg).toFixed(1)}" y2="${(m.y-cy*(m.R+11)+ny*sg).toFixed(1)}"/>`;});
        svg+='</g>';
      }
      svg+=`<g transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${m.rot.toFixed(0)})">`;
      const idx=m.atoms.map((_,i)=>i);
      if(m.atoms.length>=4){idx.shift();idx.push(0);}
      idx.forEach(i=>{svg+=ball(m.offs[i][0],m.offs[i][1],r,atomColor(m.atoms[i]));});
      svg+='</g>';
    });
    svg+='</svg>';
    return svg;
  }

  /* ---- Orbital diyagramı ----
     spec: "1s=ud 2s=ud 2p=u.u.0"  (u=↑, d=↓, 0=boş, nokta orbital ayırır)
     veya "Z=7" / "Z=26 e=24" (doğru temel hâl dizilimini kendisi çizer) */
  function hundFill(k,m){const o=Array.from({length:m},()=>[]);for(let i=0;i<k;i++){if(i<m) o[i].push('u'); else o[i-m].push('d');}return o;}
  function parseOrbitalSpec(spec){
    spec=String(spec||'').trim();
    const zm=spec.match(/^Z\s*=\s*(\d+)(?:\s+e\s*=\s*(\d+))?$/i);
    if(zm){
      const p=clamp(+zm[1],1,36), e=zm[2]!=null?clamp(+zm[2],0,40):p;
      return electronConfig(p,e).map(x=>({label:x.n+LCHAR[x.l],orbs:hundFill(x.e,2*x.l+1)}));
    }
    return spec.split(/\s+/).filter(Boolean).map(tok=>{
      const eq=tok.indexOf('=');if(eq<0) return null;
      const lab=tok.slice(0,eq), vals=tok.slice(eq+1);
      const m=lab.match(/^(\d)([spdf])$/i);if(!m) return null;
      const orbs=vals.split('.').map(v=>v.toLowerCase().split('').filter(c=>c==='u'||c==='d'));
      return {label:lab.toLowerCase(),orbs};
    }).filter(Boolean);
  }
  function orbArrows(o,bx,y,B){
    let s='';
    o.forEach((sp,i)=>{
      const x=o.length===1?bx+B/2:bx+B*(0.32+0.36*i/Math.max(1,o.length-1));
      const top=y+5,bot=y+B-5;
      if(sp==='u') s+=`<path d="M${x.toFixed(1)} ${bot} V${top+2} M${(x-4.5).toFixed(1)} ${top+7} L${x.toFixed(1)} ${top} L${(x+4.5).toFixed(1)} ${top+7}" style="stroke:var(--sv-up)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      else s+=`<path d="M${x.toFixed(1)} ${top} V${bot-2} M${(x-4.5).toFixed(1)} ${bot-7} L${x.toFixed(1)} ${bot} L${(x+4.5).toFixed(1)} ${bot-7}" style="stroke:var(--sv-down)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    });
    return s;
  }
  function orbitalSVG(spec,compact){
    const groups=parseOrbitalSpec(spec);
    if(!groups.length) return '<div class="v-empty">Orbital tanımı yok</div>';
    const B=30,G=14,LH=18,maxW=compact?4*B+G+2:9*B+3*G;
    const rows=[[]];let w=0;
    groups.forEach(g=>{const gw=g.orbs.length*B;if(w>0&&w+G+gw>maxW){rows.push([]);w=0;}rows[rows.length-1].push(g);w+=(w?G:0)+gw;});
    const rowW=rows.map(r=>r.reduce((t,g,i)=>t+(i?G:0)+g.orbs.length*B,0));
    const W=Math.max(...rowW)+8, H=rows.length*(B+LH+8)+2;
    let s=`<svg viewBox="0 0 ${W} ${H}" class="v-orbital">`;
    rows.forEach((r,ri)=>{
      let x=(W-rowW[ri])/2;const y=4+ri*(B+LH+8);
      r.forEach(g=>{
        g.orbs.forEach((o,k)=>{
          const bx=x+k*B;
          s+=`<rect x="${bx}" y="${y}" width="${B}" height="${B}" style="fill:var(--sv-fill);stroke:var(--sv-ink)" stroke-width="2"/>`;
          s+=orbArrows(o,bx,y,B);
        });
        const cnt=g.orbs.reduce((t,o)=>t+o.length,0);
        s+=`<text x="${(x+g.orbs.length*B/2).toFixed(1)}" y="${y+B+15}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="600" font-size="14" style="fill:var(--sv-ink)">${g.label}${cnt?supNum(cnt):'⁰'}</text>`;
        x+=g.orbs.length*B+G;
      });
    });
    return s+'</svg>';
  }
  function shuffleSeeded(a,rand){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  /* ---- Denklem molekülü (formülden) ---- */
  function moleculeSVG(counts){
    let list=[];for(const [el,c] of Object.entries(counts)) for(let i=0;i<c;i++) list.push(el);
    if(list.length>24) list=list.slice(0,24);
    const total=list.length;
    const r=total>12?5.5:total>6?7:9;
    let offs;
    if(total===1) offs=[[0,0]];
    else if(total===2) offs=[[-r*.8,0],[r*.8,0]];
    else{
      const singles=Object.entries(counts).filter(([e,c])=>c===1).map(([e])=>e).filter(e=>!['Na','K','Li'].includes(e));
      if(total<=7&&singles.length){
        const center=singles[0];
        const rest=list.slice();rest.splice(rest.indexOf(center),1);
        list=[...rest,center];
        const bent=rest.length===2&&['O','S'].includes(center);
        offs=rest.map((_,k)=>{const a=rest.length===2?(bent?[Math.PI*.8,Math.PI*.2][k]:[Math.PI,0][k]):2*Math.PI*k/rest.length-Math.PI/2;return [Math.cos(a)*r*1.6,Math.sin(a)*r*1.6];});
        offs.push([0,0]);
      } else {
        offs=list.map((_,i)=>{const rr=r*1.25*Math.sqrt(i+.35);const a=i*2.39996;return [Math.cos(a)*rr,Math.sin(a)*rr];});
        list=list.slice().reverse();offs=offs.slice().reverse();
      }
    }
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    offs.forEach(([x,y])=>{minX=Math.min(minX,x-r);minY=Math.min(minY,y-r);maxX=Math.max(maxX,x+r);maxY=Math.max(maxY,y+r);});
    const w=maxX-minX,h=maxY-minY,sz=Math.max(w,h)+4;
    const vx=minX-(sz-w)/2,vy=minY-(sz-h)/2;
    let s=`<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${sz.toFixed(1)} ${sz.toFixed(1)}">`;
    list.forEach((el,i)=>{s+=ball(offs[i][0],offs[i][1],r,atomColor(el));});
    return s+'</svg>';
  }

  /* ---- GHS güvenlik işaretleri ---- */
  function ghsSVG(code){
    const k='#111';
    const flame=(tx=0,ty=0,sc=1)=>`<path transform="translate(${tx} ${ty}) scale(${sc})" d="M100 50c10 16 30 28 28 58c-1 16-13 28-28 28s-28-11-28-27c0-14 8-22 14-30c1 9 4 14 9 17c-3-17 1-31 5-46z" fill="${k}"/>`;
    let sym='';
    switch(code){
      case 'flame': sym=flame()+`<rect x="64" y="141" width="72" height="7" rx="2" fill="${k}"/>`;break;
      case 'exclamation': sym=`<rect x="89" y="52" width="22" height="62" rx="9" fill="${k}"/><circle cx="100" cy="135" r="12" fill="${k}"/>`;break;
      case 'skull': sym=`<g fill="${k}"><ellipse cx="100" cy="84" rx="27" ry="25"/><rect x="85" y="96" width="30" height="18" rx="5"/></g><g fill="#fff"><circle cx="90" cy="84" r="7.5"/><circle cx="110" cy="84" r="7.5"/><path d="M100 93l-4 8h8z"/><rect x="92" y="107" width="3" height="7"/><rect x="99" y="107" width="3" height="7"/><rect x="106" y="107" width="3" height="7"/></g><g stroke="${k}" stroke-width="9" stroke-linecap="round"><line x1="66" y1="122" x2="134" y2="146"/><line x1="134" y1="122" x2="66" y2="146"/></g>`;break;
      case 'corrosive': sym=`<g fill="${k}"><rect x="58" y="50" width="15" height="36" rx="4" transform="rotate(-38 65 68)"/><rect x="127" y="50" width="15" height="36" rx="4" transform="rotate(38 135 68)"/><circle cx="78" cy="96" r="4.5"/><circle cx="78" cy="108" r="3.2"/><circle cx="122" cy="96" r="4.5"/><circle cx="122" cy="108" r="3.2"/><path d="M56 122h34l-4 8 6 4-4 10H56z"/><path d="M106 120h40v9h-9v6h-9v7h-22z"/></g><rect x="52" y="146" width="96" height="6" fill="${k}"/>`;break;
      case 'explosive':{
        let pts='';for(let i=0;i<16;i++){const rr=i%2?16:34;const a=i*Math.PI/8;pts+=`${(100+Math.cos(a)*rr).toFixed(1)},${(108+Math.sin(a)*rr).toFixed(1)} `;}
        sym=`<polygon points="${pts}" fill="${k}"/><g fill="${k}"><rect x="62" y="62" width="9" height="9" transform="rotate(20 66 66)"/><rect x="128" y="60" width="10" height="8" transform="rotate(-25 133 64)"/><rect x="58" y="128" width="8" height="10"/><rect x="136" y="130" width="9" height="9" transform="rotate(30 140 134)"/><circle cx="100" cy="62" r="5"/></g>`;break;
      }
      case 'oxidizer': sym=flame(30,-6,.7)+`<circle cx="100" cy="118" r="20" fill="none" stroke="${k}" stroke-width="10"/><rect x="64" y="144" width="72" height="7" rx="2" fill="${k}"/>`;break;
      case 'gas': sym=`<g transform="rotate(-22 100 104)"><rect x="56" y="90" width="84" height="30" rx="15" fill="${k}"/><rect x="138" y="97" width="10" height="16" rx="2" fill="${k}"/><rect x="146" y="92" width="6" height="26" rx="2" fill="${k}"/></g>`;break;
      case 'environment': sym=`<g stroke="${k}" stroke-width="5" stroke-linecap="round" fill="none"><path d="M78 140 L74 62"/><path d="M76 92 L58 76"/><path d="M76 82 L92 66"/><path d="M75 110 L60 100"/></g><path d="M64 142 H140" stroke="${k}" stroke-width="5"/><ellipse cx="114" cy="126" rx="18" ry="9" fill="${k}"/><path d="M130 126 l14 -9 v18z" fill="${k}"/><path d="M106 122 l6 6 M112 122 l-6 6" stroke="#fff" stroke-width="2"/>`;break;
      case 'health': {
        let st='';for(let i=0;i<10;i++){const rr=i%2?6:15;const a=i*Math.PI/5-Math.PI/2;st+=`${(100+Math.cos(a)*rr).toFixed(1)},${(122+Math.sin(a)*rr).toFixed(1)} `;}
        sym=`<circle cx="100" cy="66" r="15" fill="${k}"/><path d="M62 150 Q62 92 100 88 Q138 92 138 150Z" fill="${k}"/><polygon points="${st}" fill="#fff"/>`;break;
      }
      default: sym=`<text x="100" y="122" text-anchor="middle" font-size="60" fill="${k}">?</text>`;
    }
    return `<svg viewBox="0 0 200 200" class="v-ghs"><polygon points="100,10 190,100 100,190 10,100" fill="#fff" stroke="#dc2626" stroke-width="12" stroke-linejoin="round"/>${sym}</svg>`;
  }

  return {render,caption,nuclideHTML,atomSVG,particlesSVG,moleculeSVG,ghsSVG,parseSpec,orbitalSVG,parseOrbitalSpec,hundFill};
})();

      <ellipse cx="60" cy="134" rx="34" ry="5" fill="rgba(0,0,0,.35)"/>
      <g class="m-body">
        <text class="bub" x="18" y="40" font-family="Nunito, sans-serif" font-weight="700" font-size="16" fill="#67e8f9">+</text>
        <text class="bub bub2" x="92" y="36" font-family="Nunito, sans-serif" font-weight="700" font-size="15" fill="#f9a8d4">×</text>
        <text class="bub bub3" x="54" y="22" font-family="Nunito, sans-serif" font-weight="700" font-size="14" fill="#86efac">÷</text>
        <rect x="18" y="46" width="84" height="80" rx="24" fill="url(#pbody)" stroke="#fde68a" stroke-width="4"/>
        <text x="60" y="76" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="700" font-size="22" fill="#7c2d12" opacity=".55">π</text>
        <g class="eyes"><circle cx="49" cy="92" r="6.5" fill="#0b1026"/><circle cx="71" cy="92" r="6.5" fill="#0b1026"/><circle cx="51" cy="90" r="2.2" fill="#fff"/><circle cx="73" cy="90" r="2.2" fill="#fff"/></g>
        <g class="eyelid"><rect x="41" y="84" width="17" height="15" rx="7" fill="#f59e0b"/><rect x="63" y="84" width="17" height="15" rx="7" fill="#f59e0b"/></g>

        <path class="mouth m-happy" d="M49 104 Q60 117 71 104 Z" fill="#0b1026" stroke="#0b1026" stroke-width="2" stroke-linejoin="round"/>

  set(state){$$('.mascot').forEach(m=>{m.classList.remove('think','happy','sad');void m.getBoundingClientRect();m.classList.add(state);});},
  say(text,ms=4200){
    const sp=$('#speech');if(!sp) return;
    sp.innerHTML=text;sp.classList.add('show');
    clearTimeout(Mascot._t);Mascot._t=setTimeout(()=>sp.classList.remove('show'),ms);
  }
};
