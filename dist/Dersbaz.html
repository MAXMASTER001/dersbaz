    const H=Math.pow(10,-pH),OH=1e-14/H;return (H-OH)*V;
  }
  function calcPH(net,V){const x=net/V;const H=(x+Math.sqrt(x*x+4e-14))/2;return -Math.log10(H);}
  function lerpColor(a,b,t){const pa=hex(a),pb=hex(b);return `rgb(${pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')})`;}
  function hex(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
  function stops(st,pH){
    if(pH<=st[0][0]) return lerpColor(st[0][1],st[0][1],0);
    for(let i=1;i<st.length;i++) if(pH<=st[i][0]){const t=(pH-st[i-1][0])/(st[i][0]-st[i-1][0]);return lerpColor(st[i-1][1],st[i][1],t);}
    return lerpColor(st[st.length-1][1],st[st.length-1][1],0);
  }
  function color(ind,pH){
    switch(ind){
      case 'universal':return stops([[1,'#dc2626'],[3,'#f97316'],[5,'#facc15'],[7,'#22c55e'],[9,'#0d9488'],[10.5,'#2563eb'],[12.5,'#6d28d9'],[14,'#581c87']],pH);
      case 'litmus':return stops([[4.5,'#dc2626'],[6.5,'#9d4edd'],[8.3,'#3b82f6']],pH);
      case 'phenol':return stops([[8.2,'#dbeafe'],[10,'#ec4899']],pH);
      case 'methyl':return stops([[3.1,'#ef4444'],[4.4,'#facc15']],pH);
      case 'btb':return stops([[6,'#eab308'],[7,'#22c55e'],[7.6,'#2563eb']],pH);
      default:return '#bae6fd';
    }
  }
  function mount(app){
    S={app,start:'hcl',ind:'universal',V:0,net:0,added:0,hist:[],pH:7,animating:0};
    app.innerHTML=`<section class="screen ph">
      <h1 class="screen-title">🧪 pH Laboratuvarı</h1>
      <p class="sub">Asit ve baz damlat, indikatörün renginin nasıl değiştiğini gözle. Titrasyon eğrini çiz!</p>
      <div class="ph-layout">
        <div class="panel">${labSVG()}
          <div class="ph-meter" style="margin-top:12px"><div class="lcd" id="lcd">7.00</div><div><div class="ph-class" id="phclass">Nötr</div><div class="muted" id="phinfo" style="font-weight:800;font-size:14px"></div></div></div>
          <div class="ph-scale"><div class="marker" id="marker"></div></div>
          <div class="ph-ticks">${Array.from({length:15},(_,i)=>`<span>${i}</span>`).join('')}</div>
          <div class="ph-ticks" style="margin-top:4px"><span>◀ ASİDİK</span><span>NÖTR</span><span>BAZİK ▶</span></div>
        </div>
        <div>
          <div class="panel">
            <span class="lbl">Başlangıç çözeltisi (beherdeki)</span>
            <select class="inp" id="start">${Object.entries(PH_START).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select>
            <span class="lbl">İndikatör</span>
            <select class="inp" id="ind">${Object.entries(INDICATORS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
            <span class="lbl">Bürete göre ekle (0,1 M)</span>
            <div class="ctl-grid">
              <button class="btn btn-danger" data-add="acid" data-ml=".05">💧 1 damla HCl</button>
              <button class="btn btn-primary" data-add="base" data-ml=".05">💧 1 damla NaOH</button>
              <button class="btn btn-danger" data-add="acid" data-ml="1">+1 mL HCl</button>
              <button class="btn btn-primary" data-add="base" data-ml="1">+1 mL NaOH</button>
              <button class="btn btn-danger" data-add="acid" data-ml="5">+5 mL HCl</button>
              <button class="btn btn-primary" data-add="base" data-ml="5">+5 mL NaOH</button>
              <button class="btn btn-cyan" data-add="water" data-ml="10">+10 mL saf su</button>
              <button class="btn btn-ghost" id="reset">↺ Beheri boşalt</button>
            </div>
          </div>
          <div class="panel" style="margin-top:16px"><h3>📈 Titrasyon eğrisi</h3><canvas class="chart" id="chart" width="560" height="260"></canvas></div>
          <div class="panel" style="margin-top:16px"><h3>🎯 Deney görevleri</h3><div class="task-list" id="tasks"></div></div>
        </div>
      </div>
    </section>`;
    $('#start',app).value=S.start;$('#ind',app).value=S.ind;
    $('#start',app).onchange=e=>{S.start=e.target.value;reset();};
    $('#ind',app).onchange=e=>{S.ind=e.target.value;FX.sfx.bubble();FX.bubbles(FX.centerOf($('#beaker')).x,FX.centerOf($('#beaker')).y+30,10);update();};
    $$('[data-add]',app).forEach(b=>b.onclick=()=>add(b.dataset.add,+b.dataset.ml));
    $('#reset',app).onclick=()=>reset();
    reset();
  }
  function reset(){
    const st=PH_START[S.start];
    S.V=st.V;S.net=st.net!=null?st.net:netFromPH(st.pH,st.V);S.added=0;S.hist=[];
    update();S.hist.push([0,S.pH]);drawChart();
  }
  function add(kind,ml){
    if(S.V+ml/1000>.25){UI.toast('⚠️ Beher dolmak üzere (en fazla 250 mL). Beheri boşalt.','bad');return;}
    const L=ml/1000;
    dropAnim(kind,ml);
    setTimeout(()=>{
      if(!S) return;
      S.V+=L;
      if(kind==='acid') S.net+=.1*L;
      else if(kind==='base') S.net-=.1*L;
      if(kind!=='water'){S.added+=ml;}
      update();
      if(kind!=='water'){S.hist.push([S.added,S.pH]);drawChart();}
    },380);
  }
  function update(){
    S.pH=calcPH(S.net,S.V);
    const pH=S.pH;
    $('#lcd').textContent=pH.toFixed(2);
    const cls=pH<3?'Kuvvetli asidik':pH<6.5?'Asidik':pH<=7.5?'Nötr':pH<11?'Bazik':'Kuvvetli bazik';
    const col=pH<6.5?'#f87171':pH<=7.5?'#4ade80':'#60a5fa';
    $('#phclass').textContent=cls;$('#phclass').style.color=col;
    const H=Math.pow(10,-pH);
    $('#phinfo').innerHTML=`Hacim: ${fmtNum(S.V*1000,1)} mL · [H<sup>+</sup>] = ${H.toExponential(1).replace('e',' × 10^').replace(/\^([+-]?\d+)/,(m,e)=>'<sup>'+e+'</sup>')} M`;
    $('#marker').style.left=(clamp(pH,0,14)/14*100)+'%';
    // sıvı
    const liq=$('#liquid');const maxH=150, h=Math.max(8,S.V/.25*maxH);
    liq.setAttribute('y',(388-h).toFixed(1));liq.setAttribute('height',h.toFixed(1));
    liq.style.fill=color(S.ind,pH);
    liq.style.fillOpacity=S.ind==='none'||(S.ind==='phenol'&&pH<8.2)?.45:.85;
    $('#surface').setAttribute('cy',(388-h).toFixed(1));
    $('#surface').style.fill=color(S.ind,pH);
    $('#vol-label').textContent=Math.round(S.V*1000)+' mL';
    renderTasks();
  }
  function renderTasks(){
    const prof=Store.profile();
    let newly=null;
    PH_TASKS.forEach(t=>{if(!prof.phDone.includes(t.id)&&t.check(S)) newly=t;});
    if(newly){Game.finishPH(newly.id,PH_TASKS.length);FX.sfx.win();FX.celebrate($('#beaker'));FX.banner('GÖREV TAMAM!','good','small');}
    const p2=Store.profile();
    $('#tasks').innerHTML=PH_TASKS.map(t=>{const d=p2.phDone.includes(t.id);return `<div class="task ${d?'done':''}"><span class="tk">${d?'✓':''}</span><span>${richText(t.text)}</span></div>`;}).join('');
  }
  function dropAnim(kind,ml){
    const svg=$('#labsvg');if(!svg) return;
    const x=kind==='acid'?205:kind==='base'?315:260;
    const col=kind==='acid'?'#fca5a5':kind==='base'?'#93c5fd':'#e0f2fe';
    const n=ml<1?1:ml<5?3:6;
    const surfaceY=+$('#surface').getAttribute('cy');
    for(let i=0;i<n;i++){
      const d=document.createElementNS('http://www.w3.org/2000/svg','circle');
      d.setAttribute('cx',x);d.setAttribute('cy',kind==='water'?150:196);d.setAttribute('r',ml>=5?6:4.5);d.setAttribute('fill',col);
      svg.appendChild(d);
      const t0=performance.now()+i*60;const y0=kind==='water'?150:196;
      const step=t=>{const k=Math.max(0,(t-t0)/330);d.setAttribute('cy',(y0+(surfaceY-y0)*k*k).toFixed(1));if(k<1) requestAnimationFrame(step); else {d.remove();}};
      requestAnimationFrame(step);
    }
    setTimeout(()=>FX.sfx.drop(),300);
    // burette level
    if(kind!=='water'){
      const lv=$('#lvl-'+kind);const cur=+lv.dataset.v||0;const nv=Math.min(100,cur+ml*.6);lv.dataset.v=nv;
      lv.setAttribute('y',(30+nv*1.2).toFixed(1));lv.setAttribute('height',(120-nv*1.2).toFixed(1));
      if(nv>=100){lv.dataset.v=0;setTimeout(()=>{lv.setAttribute('y',30);lv.setAttribute('height',120);},500);}
    }
  }
  function labSVG(){
    const burette=(x,label,color,id)=>`
      <rect x="${x-9}" y="26" width="18" height="128" rx="4" style="fill:var(--sv-fill);stroke:var(--sv-ink)" stroke-width="2"/>
      <rect id="lvl-${id}" data-v="0" x="${x-7}" y="30" width="14" height="120" rx="2" fill="${color}" opacity=".75" style="transition:y .4s,height .4s"/>
      ${[0,1,2,3,4,5].map(k=>`<line x1="${x-9}" y1="${40+k*20}" x2="${x-2}" y2="${40+k*20}" style="stroke:var(--sv-ink)" stroke-opacity=".5" stroke-width="1"/>`).join('')}
      <rect x="${x-14}" y="156" width="28" height="10" rx="3" fill="#475569"/>
      <path d="M${x-3} 166 h6 l-1 22 h-4z" style="fill:var(--sv-ink)" fill-opacity=".6"/>
      <text x="${x}" y="18" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="600" font-size="14" fill="${color}">${label}</text>`;
    return `<svg class="lab-svg" id="labsvg" viewBox="0 0 520 420">
      <rect x="40" y="398" width="440" height="14" rx="5" fill="#334155"/>
      <rect x="120" y="12" width="6" height="388" fill="#475569"/><rect x="100" y="392" width="46" height="8" rx="3" fill="#475569"/>
      <rect x="120" y="150" width="210" height="6" fill="#475569"/>
      ${burette(205,'HCl','#f87171','acid')}
      ${burette(315,'NaOH','#60a5fa','base')}
      <g id="beaker">
        <clipPath id="bclip"><path d="M172 232 V380 Q172 392 184 392 H336 Q348 392 348 380 V232Z"/></clipPath>
        <g clip-path="url(#bclip)">
          <rect id="liquid" class="liquid" x="160" y="300" width="200" height="100" style="fill:#bae6fd"/>
          <ellipse id="surface" class="liquid" cx="260" cy="300" rx="88" ry="4" opacity=".7"/>
        </g>
        <path d="M166 226 h8 V380 Q174 390 184 390 H336 Q346 390 346 380 V226 h8" fill="none" style="stroke:var(--sv-ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        ${[0,1,2,3,4].map(k=>`<line x1="346" y1="${388-k*30}" x2="334" y2="${388-k*30}" style="stroke:var(--sv-ink)" stroke-opacity=".5" stroke-width="1.5"/><text x="352" y="${392-k*30}" font-size="9" style="fill:var(--sv-ink)" fill-opacity=".7" font-family="Nunito">${k*50}</text>`).join('')}
        <text id="vol-label" x="260" y="412" text-anchor="middle" font-family="Nunito, sans-serif" font-size="12" style="fill:var(--sv-ink)">50 mL</text>
      </g>
      <g><rect x="400" y="120" width="70" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/><rect x="408" y="130" width="54" height="24" rx="4" fill="#03130a"/><text x="435" y="148" text-anchor="middle" font-family="Courier New" font-weight="700" font-size="14" fill="#4ade80">pH</text>
      <circle cx="420" cy="180" r="7" fill="#22c55e"/><circle cx="448" cy="180" r="7" fill="#ef4444"/>
      <path d="M435 210 Q435 240 330 250 L324 360" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="319" y="340" width="10" height="34" rx="4" fill="#cbd5e1"/></g>
    </svg>`;
  }
  function drawChart(){
    const cv=$('#chart');if(!cv) return;
    const c=cv.getContext('2d');const W=cv.width,H=cv.height,pl=40,pb=30,pt=12,pr=12;
    c.clearRect(0,0,W,H);
    const maxX=Math.max(20,Math.ceil((S.hist.length?S.hist[S.hist.length-1][0]:0)/10)*10);
    const X=v=>pl+v/maxX*(W-pl-pr),Y=v=>pt+(14-v)/14*(H-pt-pb);
    c.font='bold 11px Nunito';c.fillStyle='#a5b4fc';c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;
    for(let p=0;p<=14;p+=2){c.beginPath();c.moveTo(pl,Y(p));c.lineTo(W-pr,Y(p));c.stroke();c.fillText(p,pl-22,Y(p)+4);}
    for(let v=0;v<=maxX;v+=maxX/5){c.fillText(Math.round(v),X(v)-6,H-10);}
    c.fillText('pH',6,14);c.fillText('eklenen asit/baz (mL)',W-150,H-10+0);
    c.setLineDash([5,5]);c.strokeStyle='rgba(74,222,128,.6)';c.beginPath();c.moveTo(pl,Y(7));c.lineTo(W-pr,Y(7));c.stroke();c.setLineDash([]);
    if(S.hist.length){
      c.strokeStyle='#22d3ee';c.lineWidth=3;c.beginPath();
      S.hist.forEach(([v,p],i)=>{i?c.lineTo(X(v),Y(p)):c.moveTo(X(v),Y(p));});c.stroke();
      S.hist.forEach(([v,p])=>{c.fillStyle=color('universal',p);c.beginPath();c.arc(X(v),Y(p),3.5,0,Math.PI*2);c.fill();});
    }
  }
  function unmount(){S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/gas.js */
'use strict';
/* =========================================================
   Gaz Simülatörü — kinetik molekül kuramı, P-V-T-n ilişkisi
   ========================================================= */
const GAS_TYPES = {
  He:{name:'Helyum (He)',M:4,color:'#67e8f9',r:4},
  Ne:{name:'Neon (Ne)',M:20,color:'#fb923c',r:5},
  N2:{name:'Azot (N₂)',M:28,color:'#60a5fa',r:5.5},
  CO2:{name:'Karbon dioksit (CO₂)',M:44,color:'#a3a3a3',r:6.5},
};
const GAS_TASKS = [
  {id:'g1',text:'Basıncı **3 atm**\'nin üzerine çıkar.',check:s=>s.P>3},
  {id:'g2',text:'Basıncı **0,5 atm**\'nin altına düşür.',check:s=>s.P<.5&&s.N>0},
  {id:'g3',text:'Gazı **900 K** veya üzerine ısıt; taneciklerin hızlandığını gözle.',check:s=>s.T>=900},
  {id:'g4',text:'Gaz türünü değiştir: hafif ve ağır gazların hızlarını karşılaştır.',check:s=>s.gasChanged},
];

const GasSim = (()=>{
  let S=null,raf=null;
  const W=720,H=400,WALL=14;
  const SPEED=0.29*60; // piksel/s ölçeği
  function sigma(){return SPEED*Math.sqrt(S.T/GAS_TYPES[S.gas].M);}
  function rayleigh(sg){return sg*Math.sqrt(-2*Math.log(1-Math.random()));}
  function right(){return WALL+S.Vf*(W-2*WALL-40);}
  function addP(){
    const sp=rayleigh(sigma()),a=Math.random()*Math.PI*2,r=GAS_TYPES[S.gas].r;
    S.parts.push({x:WALL+r+Math.random()*(right()-WALL-2*r),y:WALL+r+Math.random()*(H-2*WALL-2*r),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp});
  }
  function mount(app){
    S={app,T:300,Vf:1,N:60,gas:'He',parts:[],imp:0,win:0,ratio:1,P:1,gasChanged:false,last:performance.now()};
    app.innerHTML=`<section class="screen gas">
      <h1 class="screen-title">🎈 Gaz Simülatörü</h1>
      <p class="sub">Sıcaklığı, hacmi ve tanecik sayısını değiştir; basınç nasıl değişiyor? Tanecik renkleri hızı gösterir: <span style="color:#60a5fa">mavi = yavaş</span>, <span style="color:#f87171">kırmızı = hızlı</span>.</p>
      <div class="gas-layout">
        <div class="panel"><canvas id="gas-canvas" width="${W}" height="${H}"></canvas>
          <div class="readouts">
            <div class="readout"><span>BASINÇ (P)</span><b id="rP">1,00 atm</b></div>
            <div class="readout"><span>HACİM (V)</span><b id="rV">2,50 L</b></div>
            <div class="readout"><span>SICAKLIK (T)</span><b id="rT">300 K</b></div>
            <div class="readout"><span>MOL (n)</span><b id="rN">0,100</b></div>
          </div>
          <div style="margin-top:14px"><h3 style="margin:0 0 8px;font-size:16px">📊 Tanecik hız dağılımı</h3><canvas class="chart" id="hist" width="700" height="150"></canvas></div>
        </div>
        <div>
          <div class="panel">
            <svg class="gauge" viewBox="0 0 220 190" id="gauge"><rect x="0" y="0" width="220" height="190" rx="18" fill="#0f1a2e"/>
              <defs><linearGradient id="gg"><stop offset="0" stop-color="#22c55e"/><stop offset=".6" stop-color="#facc15"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs>
              <path d="M53.4 166.6 A80 80 0 1 1 166.6 166.6" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="16" stroke-linecap="round"/>
              <path d="M53.4 166.6 A80 80 0 1 1 166.6 166.6" fill="none" stroke="url(#gg)" stroke-width="16" stroke-dasharray="4 3"/>
              ${[0,1,2,3,4,5,6].map(v=>{const a=(135+v*45)*Math.PI/180;return `<text x="${(110+Math.cos(a)*56).toFixed(1)}" y="${(110+Math.sin(a)*56+4).toFixed(1)}" text-anchor="middle" font-size="12" font-family="Nunito, sans-serif" fill="#cbd5e1">${v}</text>`;}).join('')}
              <g id="needleG" style="transition:transform .3s;transform-origin:110px 110px"><line x1="110" y1="110" x2="110" y2="42" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/></g>
              <circle cx="110" cy="110" r="9" fill="#e2e8f0"/><text x="110" y="182" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" fill="#a5b4fc">atm</text>
            </svg>
            <div class="slider-row"><label>🌡️ Sıcaklık <b id="lT">300 K</b></label><input type="range" id="sT" min="100" max="1000" step="10" value="300"></div>
            <div class="slider-row"><label>📦 Hacim (piston) <b id="lV">2,50 L</b></label><input type="range" id="sV" min="25" max="100" step="1" value="100"></div>
            <div class="slider-row"><label>⚪ Tanecik sayısı <b id="lN">60</b></label><input type="range" id="sN" min="0" max="180" step="5" value="60"></div>
            <span class="lbl">Gaz türü</span>
            <select class="inp" id="sG">${Object.entries(GAS_TYPES).map(([k,v])=>`<option value="${k}">${v.name} — ${v.M} g/mol</option>`).join('')}</select>
            <div class="btn-row" style="margin-top:12px"><button class="btn btn-sm btn-danger" id="heat">🔥 Isıt</button><button class="btn btn-sm btn-cyan" id="cool">❄️ Soğut</button><button class="btn btn-sm btn-ghost" id="greset">↺ Sıfırla</button></div>
          </div>
          <div class="panel" style="margin-top:16px"><div class="law-box" id="laws"></div></div>
          <div class="panel" style="margin-top:16px"><h3>🎯 Görevler</h3><div class="task-list" id="gtasks"></div></div>
        </div>
      </div>
    </section>`;
    for(let i=0;i<S.N;i++) addP();
    $('#sT').oninput=e=>setT(+e.target.value);
    $('#sV').oninput=e=>{S.Vf=+e.target.value/100;};
    $('#sN').oninput=e=>{const n=+e.target.value;S.N=n;while(S.parts.length<n) addP();S.parts.length=n;};
    $('#sG').onchange=e=>{const old=GAS_TYPES[S.gas].M;S.gas=e.target.value;const f=Math.sqrt(old/GAS_TYPES[S.gas].M);S.parts.forEach(p=>{p.vx*=f;p.vy*=f;});S.gasChanged=true;FX.sfx.pop();};
    $('#heat').onclick=()=>{setT(Math.min(1000,S.T+100));FX.sfx.up();};
    $('#cool').onclick=()=>{setT(Math.max(100,S.T-100));FX.sfx.down();};
    $('#greset').onclick=()=>{GasSim.unmount();mount(app);};
    S.last=performance.now();
    raf=requestAnimationFrame(loop);
    renderTasks();
  }
  function setT(t){
    const f=Math.sqrt(t/S.T);S.T=t;S.parts.forEach(p=>{p.vx*=f;p.vy*=f;});
    $('#sT').value=t;
  }
  function loop(now){
    if(!S||!$('#gas-canvas')) return;
    let dt=Math.min(1/30,(now-S.last)/1000);S.last=now;
    const sub=2;dt/=sub;
    const g=GAS_TYPES[S.gas],r=g.r,R=right();
    for(let k=0;k<sub;k++) physics(dt,r,R,g.M);
    S.win+=dt*sub;
    if(S.win>=.3){
      const A=(R-WALL)*(H-2*WALL);
      const sg=sigma();
      const expected=S.N*g.M*sg*sg/A;
      const perim=2*((R-WALL)+(H-2*WALL));
      const measured=S.imp/(S.win*perim);
      const ratio=expected>0?measured/expected:0;
      S.ratio=S.ratio*.6+ratio*.4;
      S.imp=0;S.win=0;
      readouts();
    }
    draw(r,R,g);
    raf=requestAnimationFrame(loop);
  }
  function physics(dt,r,R,M){
    const ps=S.parts;
    for(const p of ps){
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x<WALL+r){p.x=WALL+r;S.imp+=2*M*Math.abs(p.vx);p.vx=Math.abs(p.vx);}
      if(p.x>R-r){p.x=R-r;S.imp+=2*M*Math.abs(p.vx);p.vx=-Math.abs(p.vx);}
      if(p.y<WALL+r){p.y=WALL+r;S.imp+=2*M*Math.abs(p.vy);p.vy=Math.abs(p.vy);}
      if(p.y>H-WALL-r){p.y=H-WALL-r;S.imp+=2*M*Math.abs(p.vy);p.vy=-Math.abs(p.vy);}
    }
    const d2=(2*r)*(2*r);
    for(let i=0;i<ps.length;i++){const a=ps[i];
      for(let j=i+1;j<ps.length;j++){const b=ps[j];
        const dx=b.x-a.x,dy=b.y-a.y,dd=dx*dx+dy*dy;
        if(dd<d2&&dd>0){
          const d=Math.sqrt(dd),nx=dx/d,ny=dy/d;
          const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
          if(rel>0){a.vx-=rel*nx;a.vy-=rel*ny;b.vx+=rel*nx;b.vy+=rel*ny;}
          const ov=(2*r-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        }
      }
    }
  }
  function idealP(){const n=S.N/600,V=S.Vf*2.5;return V>0?n*.0821*S.T/V:0;}
  function readouts(){
    S.P=S.N?idealP()*S.ratio:0;
    const n=S.N/600,V=S.Vf*2.5;
    $('#rP').textContent=fmtNum(S.P,2)+' atm';$('#rV').textContent=fmtNum(V,2)+' L';$('#rT').textContent=S.T+' K';$('#rN').textContent=fmtNum(n,3);
    $('#lT').textContent=S.T+' K ('+(S.T-273)+' °C)';$('#lV').textContent=fmtNum(V,2)+' L';$('#lN').textContent=S.N;
    $('#needleG').style.transform=`rotate(${(-135+clamp(S.P,0,6)*45).toFixed(1)}deg)`;
    $('#laws').innerHTML=`<b>İdeal gaz denklemi:</b> P·V = n·R·T<br>
      P·V = <b style="color:var(--gold)">${fmtNum(S.P*V,2)}</b> &nbsp; n·R·T = <b style="color:var(--gold)">${fmtNum(n*.0821*S.T,2)}</b><br>
      <span class="muted">• Boyle: T sabitken hacmi azalt → basınç artar.<br>• Gay-Lussac: V sabitken ısıt → basınç artar.<br>• Avogadro: tanecik ekle → basınç artar.</span>`;
    drawHist();
    renderTasks();
  }
  function renderTasks(){
    const prof=Store.profile();
    let newly=null;GAS_TASKS.forEach(t=>{if(!prof.gasDone.includes(t.id)&&t.check(S)) newly=t;});
    if(newly){Game.finishGas(newly.id,GAS_TASKS.length);FX.sfx.win();FX.celebrate($('#gas-canvas'));FX.banner('GÖREV TAMAM!','good','small');}
    const p2=Store.profile();
    $('#gtasks').innerHTML=GAS_TASKS.map(t=>{const d=p2.gasDone.includes(t.id);return `<div class="task ${d?'done':''}"><span class="tk">${d?'✓':''}</span><span>${richText(t.text)}</span></div>`;}).join('');
  }
  function draw(r,R,g){
    const c=$('#gas-canvas').getContext('2d');
    c.clearRect(0,0,W,H);
    const heat=(S.T-100)/900;
    const grd=c.createLinearGradient(0,H,0,H-120);grd.addColorStop(0,`rgba(239,68,68,${.05+heat*.35})`);grd.addColorStop(1,'rgba(239,68,68,0)');
    c.fillStyle=grd;c.fillRect(0,0,W,H);
    // kap
    c.fillStyle='rgba(255,255,255,.03)';c.fillRect(WALL,WALL,R-WALL,H-2*WALL);
    c.strokeStyle='rgba(226,232,255,.75)';c.lineWidth=4;c.beginPath();c.moveTo(R,WALL);c.lineTo(WALL,WALL);c.lineTo(WALL,H-WALL);c.lineTo(R,H-WALL);c.stroke();
    // piston
    c.fillStyle='#64748b';c.fillRect(R,WALL-6,14,H-2*WALL+12);
    c.fillStyle='#94a3b8';c.fillRect(R+14,H/2-6,W-R-14,12);
    c.fillStyle='#cbd5e1';c.fillRect(W-22,H/2-34,14,68);
    c.fillStyle='rgba(255,255,255,.04)';
    for(let x=R+20;x<W;x+=16){c.fillRect(x,WALL,6,H-2*WALL);}
    // tanecikler
    const sg=sigma();
    for(const p of S.parts){
      const sp=Math.hypot(p.vx,p.vy);
      const t=clamp(sp/(2.4*SPEED*Math.sqrt(1000/g.M)*.5),0,1);
      c.fillStyle=`hsl(${(220-220*t).toFixed(0)},90%,62%)`;
      c.beginPath();c.arc(p.x,p.y,r,0,Math.PI*2);c.fill();
      c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(p.x-r*.3,p.y-r*.3,r*.35,0,Math.PI*2);c.fill();
    }
    // alev
    const fl=Math.round(heat*8);
    for(let i=0;i<fl;i++){const x=WALL+30+i*((R-WALL-60)/Math.max(1,fl-1));const hh=10+Math.random()*10+heat*12;
      c.fillStyle=`rgba(251,146,60,${.5+Math.random()*.3})`;c.beginPath();c.moveTo(x-6,H);c.quadraticCurveTo(x,H-hh*2,x+6,H);c.fill();}
    void sg;
  }
  function drawHist(){
    const cv=$('#hist');if(!cv) return;
    const c=cv.getContext('2d');const w=cv.width,h=cv.height;c.clearRect(0,0,w,h);
    const g=GAS_TYPES[S.gas];
    const vmax=SPEED*Math.sqrt(1000/4)*3.2;
    const bins=28,cnt=new Array(bins).fill(0);
    S.parts.forEach(p=>{const b=Math.floor(Math.hypot(p.vx,p.vy)/vmax*bins);if(b<bins) cnt[b]++;});
    const mx=Math.max(4,...cnt);
    const bw=(w-20)/bins;
    cnt.forEach((v,i)=>{const t=i/bins*1.8;c.fillStyle=`hsl(${(220-220*clamp(t,0,1)).toFixed(0)},85%,60%)`;const bh=v/mx*(h-30);c.fillRect(10+i*bw+1,h-18-bh,bw-2,bh);});
    // kuramsal eğri
    const sg=sigma();c.strokeStyle='#fbbf24';c.lineWidth=2;c.beginPath();
    for(let i=0;i<=100;i++){const v=i/100*vmax;const f=v/(sg*sg)*Math.exp(-v*v/(2*sg*sg));const y=S.N*f*(vmax/bins);const Y=h-18-y/mx*(h-30);i?c.lineTo(10+i/100*(w-20),Y):c.moveTo(10,Y);}
    c.stroke();
    c.fillStyle='#a5b4fc';c.font='bold 11px Nunito';c.fillText('yavaş',10,h-4);c.fillText('hızlı →',w-50,h-4);c.fillText('— kuramsal dağılım ('+g.name+')',w-230,14);
  }
  function unmount(){cancelAnimationFrame(raf);S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/m-balloon.js */
'use strict';
/* =========================================================
   Balon Patlat — hızlı dört işlem (ilkokul 1–4)
   Doğru cevaplı balonu, gökyüzüne kaçmadan patlat!
   ========================================================= */
const MBalloon = (()=>{
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const MODES={
    add:{name:'Toplama',sub:'20\'ye kadar',icon:'➕',grade:'1. sınıf',c:'#22c55e',gen:()=>{const a=R(1,10),b=R(1,10);return {q:`${a} + ${b}`,a:a+b};}},
    sub:{name:'Çıkarma',sub:'20\'ye kadar',icon:'➖',grade:'1. sınıf',c:'#0ea5e9',gen:()=>{const a=R(5,20),b=R(1,a);return {q:`${a} − ${b}`,a:a-b};}},
    add100:{name:'Toplama-Çıkarma',sub:'100\'e kadar',icon:'🔢',grade:'2. sınıf',c:'#8b5cf6',gen:()=>{
      if(Math.random()<.5){const a=R(10,89),b=R(2,99-a);return {q:`${a} + ${b}`,a:a+b};}
      const a=R(20,99),b=R(2,a-1);return {q:`${a} − ${b}`,a:a-b};}},
    mul:{name:'Çarpım Tablosu',sub:'1–10',icon:'✖️',grade:'2–3. sınıf',c:'#f59e0b',gen:()=>{const a=R(1,10),b=R(1,10);return {q:`${a} × ${b}`,a:a*b,mul:[a,b]};}},
    div:{name:'Bölme',sub:'Kalansız',icon:'➗',grade:'3–4. sınıf',c:'#ef4444',gen:()=>{const b=R(2,10),q=R(1,10);return {q:`${b*q} ÷ ${b}`,a:q};}},
    mix:{name:'Karışık',sub:'Meydan okuma',icon:'🌈',grade:'4. sınıf',c:'#ec4899',gen:()=>{
      const k=['add100','mul','div'][R(0,2)];const g=MODES[k].gen();
      if(Math.random()<.35&&!g.mul){ // eksik sayıyı bul: ? + b = c
        const m=g.q.match(/^(\d+) ([+−]) (\d+)$/);
        if(m) return {q:`? ${m[2]} ${m[3]} = ${g.a}`,a:+m[1]};
      }
      return g;}},
  };
  const COLORS=['#f43f5e','#f59e0b','#22c55e','#0ea5e9','#8b5cf6','#ec4899','#14b8a6','#f97316'];
  let S=null,raf=null,keyH=null;

  function distractors(g){
    const a=g.a,set=new Set();
    const cands=[a+1,a-1,a+2,a-2,a+10,a-10,a+3];
    if(g.mul){const [x,y]=g.mul;cands.unshift(x*(y+1),x*(y-1),(x+1)*y);}
    if(a>=10){const r=+String(a).split('').reverse().join('');if(r!==a) cands.unshift(r);}
    for(const c of shuffle(cands)){if(c>=0&&c!==a) set.add(c);if(set.size>=3) break;}
    let k=4;while(set.size<3){if(a+k!==a) set.add(a+k);k++;}
    return [...set].slice(0,3);
  }

  function mount(app){
    const prof=Store.profile();
    const best=k=>(prof.games['balon_'+k]||{}).best||0;
    app.innerHTML=`<section class="screen bl-game">
      <h1 class="screen-title">🎈 Balon Patlat</h1>
      <p class="sub">Soruyu oku, doğru cevaplı balonu gökyüzüne kaçmadan patlat! Seri yaptıkça balonlar hızlanır. 3 canın var.</p>
      <div class="mode-pick">${Object.entries(MODES).map(([k,m])=>`<button class="mode-card bl-mode" data-m="${k}" style="--mc:${m.c}">
        <div class="mi">${m.icon}</div><h4>${m.name}</h4><p>${m.sub} · ${m.grade}</p><p style="margin-top:6px;color:var(--gold)">🏆 Rekor: ${best(k)}</p></button>`).join('')}</div>
    </section>`;
    $$('.bl-mode',app).forEach(b=>b.onclick=()=>{FX.sfx.pop();start(app,b.dataset.m);});
  }

  function start(app,mode){
    S={app,mode,score:0,correct:0,lives:3,streak:0,speed:46,balloons:[],q:null,last:performance.now(),typed:'',over:false};
    app.innerHTML=`<section class="screen bl-game">
      <div class="bl-hud">
        <div class="bl-q" id="blq">?</div>
        <div class="qh-right"><div class="combo" id="blcombo"></div><div class="lives" id="bllives"></div><div class="score-box"><span>PUAN</span><b id="blscore">0</b></div></div>
      </div>
      <div class="bl-sky" id="sky">
        <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="cloud c3">☁️</div>
        <div class="bl-typed" id="typed"></div>
      </div>
      <div class="kb-hint">Balona tıkla ya da cevabı klavyeden yazıp <span class="kbd">Enter</span>'a bas.</div>
    </section>`;
    renderLives();
    keyH=e=>{
      if(!S||S.over) return;
      if(/^[0-9]$/.test(e.key)){S.typed=(S.typed+e.key).slice(-4);}
      else if(e.key==='Backspace'){S.typed=S.typed.slice(0,-1);}
      else if(e.key==='Enter'){const t=S.typed;S.typed='';const b=S.balloons.find(x=>!x.dead&&String(x.v)===t);if(b) hit(b);else if(t) FX.sfx.down();}
      else return;
      e.preventDefault();$('#typed').textContent=S.typed;
    };
    document.addEventListener('keydown',keyH);
    nextWave();
    S.last=performance.now();
    raf=requestAnimationFrame(loop);
  }
  function renderLives(){$('#bllives').innerHTML=[0,1,2].map(i=>`<span class="heart ${i>=S.lives?'lost':''}">❤️</span>`).join('');}
  function nextWave(){
    if(!S||S.over) return;
    S.balloons.forEach(b=>{if(!b.dead){b.dead=true;b.el.classList.add('fly');setTimeout(()=>b.el.remove(),600);}});
    S.balloons=[];
    const g=MODES[S.mode].gen();S.q=g;
    $('#blq').innerHTML=`${g.q.includes('=')?g.q:g.q+' = ?'}`;
    $('#blq').classList.remove('pop');void $('#blq').offsetWidth;$('#blq').classList.add('pop');
    const vals=shuffle([g.a,...distractors(g)]);
    const sky=$('#sky');const W=sky.clientWidth,H=sky.clientHeight;
    const lanes=vals.length,laneW=W/lanes;
    const colors=shuffle(COLORS);
    vals.forEach((v,i)=>{
      const el=document.createElement('button');
      el.className='balloon';el.setAttribute('aria-label','Balon '+v);
      el.innerHTML=`<svg viewBox="0 0 100 150"><path d="M50 4C82 4 96 30 96 56C96 86 70 106 54 112L58 120H42L46 112C30 106 4 86 4 56C4 30 18 4 50 4Z" fill="${colors[i]}"/><ellipse cx="32" cy="36" rx="10" ry="17" fill="#fff" opacity=".35" transform="rotate(-20 32 36)"/><path d="M50 120 q-9 12 0 26" stroke="rgba(255,255,255,.6)" fill="none" stroke-width="1.6"/></svg><span>${v}</span>`;
      sky.appendChild(el);
      const b={el,v,ok:v===g.a,x:laneW*i+laneW/2-48+R(-12,12),y:H-120+R(0,90),ph:Math.random()*6,dead:false};
      el.onpointerdown=e=>{e.preventDefault();hit(b);};
      S.balloons.push(b);
    });
  }
  function hit(b){
    if(!S||b.dead||S.over) return;
    const c=FX.centerOf(b.el);
    if(b.ok){
      b.dead=true;S.correct++;S.streak++;
      const mult=1+Math.min(S.streak-1,9)*.1;
      const pts=Math.round((10+Math.max(0,Math.round(b.y/40)))*mult);
      S.score+=pts;S.speed=Math.min(150,46+S.correct*3.2);
      b.el.classList.add('popped');setTimeout(()=>b.el.remove(),300);
      FX.sfx.correct();FX.burst(c.x,c.y,36);FX.floatText(c.x,c.y-30,'+'+pts,'#fbbf24');
      $('#blscore').textContent=S.score;
      $('#blcombo').textContent=S.streak>=2?'🔥×'+S.streak:'';
      if(S.streak%5===0){FX.sfx.combo();FX.banner(S.streak+' SERİ!','gold','small');}
      setTimeout(nextWave,380);
    } else {
      b.dead=true;b.el.classList.add('bad');setTimeout(()=>b.el.remove(),500);
      FX.sfx.wrong();FX.burst(c.x,c.y,14,['#94a3b8','#475569']);FX.floatText(c.x,c.y-30,'✗','#f87171');
      loseLife('Yanlış balon!');
    }
  }
  function loseLife(msg){
    S.streak=0;$('#blcombo').textContent='';
    S.lives--;renderLives();FX.shake($('#sky'));FX.flash();
    if(S.lives<=0) return gameOver();
    FX.banner(msg,'bad','small');
  }
  function loop(t){
    if(!S||S.over||!$('#sky')) return;
    const dt=Math.min(.05,(t-S.last)/1000);S.last=t;
    for(const b of S.balloons){
      if(b.dead) continue;
      b.y-=S.speed*dt;b.ph+=dt*2;
      b.el.style.transform=`translate(${(b.x+Math.sin(b.ph)*8).toFixed(1)}px,${b.y.toFixed(1)}px) rotate(${(Math.sin(b.ph)*4).toFixed(1)}deg)`;
      if(b.y<-150){
        b.dead=true;b.el.remove();
        if(b.ok){
          loseLife('Kaçtı! Cevap '+S.q.a);
          if(!S.over) setTimeout(nextWave,500);
        }
      }
    }
    raf=requestAnimationFrame(loop);
  }
  function gameOver(){
    S.over=true;cancelAnimationFrame(raf);
    const {score,correct,mode,app}=S;
    const stars=correct>=25?3:correct>=15?2:correct>=6?1:0;
    const res=Game.finishArcade('balon_'+mode,{score,xp:correct*3+stars*5,badge:correct>=20?'balloon20':null});
    stars?FX.sfx.win():FX.sfx.lose();if(stars>=2) FX.confetti(150);
    UI.modal({title:'🎈 Oyun bitti!',dismiss:false,html:`<div style="text-align:center">
      <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
      <div class="big-score">${score}</div><p class="muted">${res.newBest?'🎉 YENİ REKOR!':'Rekor: '+res.best}</p>
      <p><b style="color:#4ade80">${correct}</b> balonu doğru patlattın · ${MODES[mode].icon} ${MODES[mode].name}</p></div>`,
      buttons:[{label:'Mod seç',cls:'btn-ghost',onClick:()=>{cleanup();mount(app);}},{label:'🔁 Tekrar',cls:'btn-good',onClick:()=>{cleanup();start(app,mode);}}]});
  }
  function cleanup(){cancelAnimationFrame(raf);if(keyH) document.removeEventListener('keydown',keyH);keyH=null;}
  function unmount(){cleanup();S=null;}
  return {mount,unmount,MODES};
})();

</script>
<script>
/* js/m-pizza.js */
'use strict';
/* =========================================================
   Kesir Pizzacısı — kesirleri modelleme, denk kesirler,
   karşılaştırma (ilkokul 3–4)
   ========================================================= */
const MPizza = (()=>{
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const CUSTOMERS=['🧒','👧','👦','👩','👨','👵','👴','🧑‍🦱','👩‍🦰','🐻','🦊','🐱','🐼','🐸'];
  const NAMES=['Ela','Kerem','Zeynep','Arda','Defne','Yusuf','Nil','Emir','Mira','Ayaz','Bulut','Duru'];
  let S=null,tm=null;
  const gcd=(a,b)=>b?gcd(b,a%b):a;

  function mount(app){
    const best=(Store.profile().games.pizza||{}).best||0;
    app.innerHTML=`<section class="screen pizza">
      <div class="pz-intro panel">
        <div class="pz-big">🍕</div>
        <div><h1 class="screen-title" style="margin:0">Kesir Pizzacısı</h1>
          <p class="sub" style="margin:6px 0 0">Müşteriler kesirle sipariş veriyor. Dilimlere dokunarak malzeme koy, siparişi zamanında teslim et!
          İlerledikçe <b>denk kesir</b> siparişleri ve <b>"hangisi daha çok?"</b> soruları gelir.</p>
          <p style="color:var(--gold);font-weight:900">🏆 Rekor: ${best} 🪙</p>
          <button class="btn btn-big btn-good" id="pzgo">Dükkânı Aç 🛎️</button></div>
      </div>
    </section>`;
    $('#pzgo').onclick=()=>{FX.sfx.pop();start(app);};
  }
  function start(app){
    S={app,round:0,coins:0,served:0,lives:3,order:null,sel:new Set(),locked:false};
    app.innerHTML=`<section class="screen pizza">
      <div class="q-hud" style="grid-template-columns:1fr auto">
        <div><h1 class="screen-title" style="font-size:28px;margin:0">🍕 Kesir Pizzacısı</h1><div class="muted" id="pzserved" style="font-weight:800"></div></div>
        <div class="qh-right"><div class="lives" id="pzlives"></div><div class="score-box"><span>KASA</span><b id="pzcoins">0 🪙</b></div></div>
      </div>
      <div class="pz-stage panel" id="pzstage"></div>
    </section>`;
    next();
  }
  function hud(){
    $('#pzlives').innerHTML=[0,1,2].map(i=>`<span class="heart ${i>=S.lives?'lost':''}">❤️</span>`).join('');
    $('#pzcoins').textContent=S.coins+' 🪙';
    $('#pzserved').textContent=`Teslim edilen sipariş: ${S.served}`;
  }
  function makeOrder(){
    const r=S.round;
    if(r<3){const d=R(2,4);return {type:'build',n:R(1,d-1)||1,d,slices:d};}
    if(r<7){const d=[3,4,5,6,8][R(0,4)];return {type:'build',n:R(1,d-1),d,slices:d};}
    const t=['build','equiv','equiv','compare','compare'][R(0,4)];
    if(t==='build'){const d=[5,6,8,10,12][R(0,4)];return {type:'build',n:R(1,d),d,slices:d};}
    if(t==='equiv'){
      const d=[2,3,4][R(0,2)],k=[2,3,4][R(0,2)];let n=R(1,d-1);
      if(gcd(n,d)>1) n=1;
      return {type:'equiv',n,d,slices:d*k};
    }
    // karşılaştırma
    let a,b;
    do{a={n:R(1,7),d:R(2,8)};b={n:R(1,7),d:R(2,8)};}while(a.n>=a.d||b.n>=b.d||(a.n===b.n&&a.d===b.d));
    if(Math.random()<.2){const k=R(2,3);b={n:a.n*k,d:a.d*k};if(b.d>12) b={n:a.n,d:a.d};}
    return {type:'compare',a,b};
  }
  function frac(n,d){return MathX.format(n+'/'+d);}
  function next(){
    if(!S) return;
    hud();
    S.order=makeOrder();S.sel=new Set();S.locked=false;
    const o=S.order;
    const who=CUSTOMERS[R(0,CUSTOMERS.length-1)],name=NAMES[R(0,NAMES.length-1)];
    const patience=Math.max(12,26-S.round);
    S.patience=patience;S.left=patience;
    const st=$('#pzstage');
    if(o.type==='compare'){
      st.innerHTML=`<div class="pz-customer"><div class="pz-face" id="pzface">${who}</div>
          <div class="pz-bubble"><b>${name}:</b> İki pizzadan <b>daha çok</b> olanı istiyorum! Hangisinde daha fazla pizza var?</div></div>
        <div class="pz-patience"><div id="pzbar"></div></div>
        <div class="pz-compare">
          <button class="pz-pick" data-p="a">${pizzaSVG(o.a.d,new Set([...Array(o.a.n).keys()]),false)}<div class="pz-label">${frac(o.a.n,o.a.d)}</div></button>
          <button class="btn btn-ghost pz-eq" data-p="eq">= Eşit</button>
          <button class="pz-pick" data-p="b">${pizzaSVG(o.b.d,new Set([...Array(o.b.n).keys()]),false)}<div class="pz-label">${frac(o.b.n,o.b.d)}</div></button>
        </div>`;
      $$('[data-p]',st).forEach(b=>b.onclick=()=>judgeCompare(b.dataset.p));
    } else {
      const ask=o.type==='equiv'?`<b>${name}:</b> Bana ${frac(o.n,o.d)} pizza lütfen! <span class="muted">(Bu pizza ${o.slices} dilime bölünmüş, dikkat!)</span>`
        :`<b>${name}:</b> Bana ${o.n===o.d?'<b>bütün</b> bir pizza ('+frac(o.n,o.d)+')':frac(o.n,o.d)+' pizza'} lütfen!`;
      st.innerHTML=`<div class="pz-customer"><div class="pz-face" id="pzface">${who}</div><div class="pz-bubble">${ask}</div></div>
        <div class="pz-patience"><div id="pzbar"></div></div>
        <div class="pz-work">
          <div class="pz-board" id="pzboard">${pizzaSVG(o.slices,S.sel,true)}</div>
          <div class="pz-side">
            <div class="pz-count">Hazırlanan: <b id="pzcur">${MathX.format('0/'+o.slices)}</b></div>
            <button class="btn btn-big btn-good" id="pzsend">Teslim Et 🛵</button>
            <button class="btn btn-ghost" id="pzclear">🧽 Temizle</button>
            <p class="muted" style="font-size:13px;font-weight:700">Dilimlere dokunarak sos ve malzeme ekle. Tekrar dokunursan kaldırırsın.</p>
          </div>
        </div>`;
      bindSlices();
      $('#pzsend').onclick=judgeBuild;
      $('#pzclear').onclick=()=>{S.sel.clear();redraw();FX.sfx.down();};
    }
    clearInterval(tm);
    tm=setInterval(()=>{
      if(!S||S.locked) return;
      S.left-=.1;const bar=$('#pzbar');if(!bar) return;
      const k=Math.max(0,S.left/S.patience);bar.style.width=(k*100)+'%';
      bar.style.background=k>.5?'#22c55e':k>.25?'#f59e0b':'#ef4444';
      if(k<.25) $('#pzface')?.classList.add('angry');
      if(S.left<=0) fail('Müşteri beklemekten sıkıldı ve gitti! 😤');
    },100);
  }
  function pizzaSVG(d,sel,interactive){
    let s=`<svg viewBox="0 0 220 220" class="pz-svg"><circle cx="110" cy="110" r="104" fill="#b45309"/><circle cx="110" cy="110" r="94" fill="#fde68a"/>`;
    for(let i=0;i<d;i++){
      const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;
      const on=sel.has(i);
      const path=d===1?'M110 16 A94 94 0 1 1 109.9 16Z':MathX.pieSlice(110,110,94,a0,a1);
      s+=`<g class="slice ${on?'on':''}" data-i="${i}" ${interactive?'role="button" tabindex="0"':''}><path d="${path}" fill="${on?'#ef4444':'#fef3c7'}" stroke="#92400e" stroke-width="2.5"/>`;
      if(on){
        const am=(a0+a1)/2;
        const dots=d<=4?3:d<=8?2:1;
        for(let k=0;k<dots;k++){const rr=30+k*22,aa=am+(k%2?.12:-.12)*(8/d);s+=`<circle cx="${(110+Math.cos(aa)*rr).toFixed(1)}" cy="${(110+Math.sin(aa)*rr).toFixed(1)}" r="${d>8?6:8}" fill="#991b1b"/><circle cx="${(110+Math.cos(aa)*rr-2).toFixed(1)}" cy="${(110+Math.sin(aa)*rr-2).toFixed(1)}" r="2" fill="#fca5a5"/>`;}
        s+=`<circle cx="${(110+Math.cos(am+.25)*60).toFixed(1)}" cy="${(110+Math.sin(am+.25)*60).toFixed(1)}" r="4" fill="#22c55e"/>`;
      }
      s+='</g>';
    }
    return s+'</svg>';
  }
  function bindSlices(){
    $$('#pzboard .slice').forEach(g=>{
      const tog=()=>{if(S.locked) return;const i=+g.dataset.i;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);S.sel.has(i)?FX.sfx.pop():FX.sfx.down();redraw();};
      g.onclick=tog;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}};
    });
  }
  function redraw(){
    $('#pzboard').innerHTML=pizzaSVG(S.order.slices,S.sel,true);bindSlices();
    $('#pzcur').innerHTML=MathX.format(S.sel.size+'/'+S.order.slices);
  }
  function judgeBuild(){
    if(S.locked) return;
    const o=S.order,k=S.sel.size;
    const ok=k*o.d===o.n*o.slices;
    if(ok) win(o.type==='equiv'?`Harika! ${MathX.format(k+'/'+o.slices)} = ${frac(o.n,o.d)} — denk kesirler!`:`Tam ${frac(o.n,o.d)} pizza! Afiyet olsun!`);
    else fail(`Sipariş ${frac(o.n,o.d)} idi, sen ${MathX.format(k+'/'+o.slices)} hazırladın.`+(o.type==='equiv'?` Doğrusu ${o.n*o.slices/o.d} dilimdi.`:''));
  }
  function judgeCompare(p){
    if(S.locked) return;
    const {a,b}=S.order;const va=a.n/a.d,vb=b.n/b.d;
    const right=Math.abs(va-vb)<1e-9?'eq':va>vb?'a':'b';
    const sym=right==='eq'?'=':right==='a'?'>':'<';
    const txt=`${frac(a.n,a.d)} ${sym} ${frac(b.n,b.d)}`;
    if(p===right) win('Doğru! '+txt);
    else fail('Olmadı: '+txt);
  }
  function win(msg){
    S.locked=true;clearInterval(tm);
    const bonus=Math.round(Math.max(0,S.left));
    const gain=10+bonus;S.coins+=gain;S.served++;S.round++;
    $('#pzface').textContent='😋';$('#pzface').classList.add('happy');
    FX.sfx.correct();FX.celebrate($('#pzstage'));
    const c=FX.centerOf($('#pzstage'));FX.floatText(c.x,c.y-60,'+'+gain+' 🪙','#fbbf24');
    toastMsg('✅ '+msg,'good');hud();
    if(S.served%5===0) setTimeout(()=>FX.banner(S.served+' SİPARİŞ!','gold','small'),300);
    setTimeout(next,1500);
  }
  function fail(msg){
    S.locked=true;clearInterval(tm);
    const f=$('#pzface');if(f){f.textContent='😠';f.classList.add('angry');}
    FX.sfx.wrong();FX.shake($('#pzstage'));
    S.lives--;S.round++;hud();toastMsg('❌ '+msg,'bad');
    if(S.lives<=0) return setTimeout(gameOver,1200);
    setTimeout(next,2200);
  }
  function toastMsg(html,kind){
    const st=$('#pzstage');let m=$('.pz-msg',st);
    if(!m){m=document.createElement('div');st.appendChild(m);}
    m.className='pz-msg orb-msg '+kind;m.innerHTML=html;
  }
  function gameOver(){
    if(!S) return;
    const {coins,served,app}=S;
    const stars=served>=15?3:served>=10?2:served>=5?1:0;
    const res=Game.finishArcade('pizza',{score:coins,xp:served*4+stars*5,badge:served>=10?'pizza10':null});
    stars?FX.sfx.win():FX.sfx.lose();if(stars>=2) FX.confetti(150);
    UI.modal({title:'🍕 Dükkân kapandı!',dismiss:false,html:`<div style="text-align:center">
      <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
      <div class="big-score">${coins} 🪙</div><p class="muted">${res.newBest?'🎉 YENİ REKOR!':'Rekor: '+res.best+' 🪙'}</p>
      <p><b style="color:#4ade80">${served}</b> sipariş teslim ettin.</p></div>`,
      buttons:[{label:'🏠 Menü',cls:'btn-ghost',onClick:()=>Router.nav('menu')},{label:'🔁 Tekrar',cls:'btn-good',onClick:()=>start(app)}]});
  }
  function unmount(){clearInterval(tm);S=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/m-clock.js */
'use strict';
/* =========================================================
   Saat Ustası — analog saat okuma ve kurma (ilkokul 1–3)
   ========================================================= */
const MClock = (()=>{
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const LEVELS={
    full:{name:'Tam saatler',icon:'🕐',grade:'1. sınıf',mins:[0],snap:60},
    half:{name:'Buçuklar',icon:'🕜',grade:'1–2. sınıf',mins:[0,30],snap:30},
    quarter:{name:'Çeyrekler',icon:'🕒',grade:'2. sınıf',mins:[0,15,30,45],snap:15},
    five:{name:'5 dakikalar',icon:'🕔',grade:'3. sınıf',mins:[0,5,10,15,20,25,30,35,40,45,50,55],snap:5},
  };
  const TOTAL=10;
  let S=null,drag=null;

  function mount(app){
    const prof=Store.profile();
    app.innerHTML=`<section class="screen clock">
      <h1 class="screen-title">⏰ Saat Ustası</h1>
      <p class="sub">Akrebi (kısa, lacivert) ve yelkovanı (uzun, kırmızı) sürükleyerek saati kur ya da gösterilen saati oku. Her turda ${TOTAL} soru!</p>
      <div class="mode-pick">${Object.entries(LEVELS).map(([k,l])=>{const b=(prof.games['saat_'+k]||{}).best||0;
        return `<button class="mode-card ck-lv" data-l="${k}"><div class="mi">${l.icon}</div><h4>${l.name}</h4><p>${l.grade}</p><p style="margin-top:6px;color:var(--gold)">🏆 En iyi: ${b}/${TOTAL}</p></button>`;}).join('')}</div>
    </section>`;
    $$('.ck-lv',app).forEach(b=>b.onclick=()=>{FX.sfx.pop();start(app,b.dataset.l);});
  }
  function start(app,lv){
    S={app,lv,i:0,correct:0,h:12,m:0,locked:false};
    app.innerHTML=`<section class="screen clock">
      <div class="q-hud" style="grid-template-columns:1fr auto">
        <div><div class="q-progress" id="ckdots"></div><div class="q-count" id="ckcount"></div></div>
        <div class="score-box"><span>DOĞRU</span><b id="ckscore">0</b></div>
      </div>
      <div class="ck-stage panel" id="ckstage"></div>
    </section>`;
    question();
  }
  function randTime(){const L=LEVELS[S.lv];return {h:R(1,12),m:L.mins[R(0,L.mins.length-1)]};}
  function dots(){
    $('#ckdots').innerHTML=Array.from({length:TOTAL},(_,k)=>`<i class="${k===S.i?'cur':S.res?.[k]===true?'ok':S.res?.[k]===false?'no':''}"></i>`).join('');
    $('#ckcount').textContent=`Soru ${S.i+1} / ${TOTAL}`;
  }
  function question(){
    S.res=S.res||[];S.locked=false;dots();
    const t=randTime();S.target=t;
    const st=$('#ckstage');
    S.mode=Math.random()<.5?'set':'read';
    if(S.mode==='set'){
      S.h=12;S.m=0;
      const usePhrase=Math.random()<.6;
      const label=usePhrase?MathX.timePhrase(t.h,t.m):MathX.digital(t.h,t.m);
      st.innerHTML=`<div class="ck-task">Saati kur: <b class="ck-target">${esc(label)}</b></div>
        <div class="ck-work">
          <div class="ck-face" id="ckface">${MathX.clockSVG({h:S.h,m:S.m})}</div>
          <div class="ck-side">
            <div class="ck-btns">
              <button class="btn btn-sm btn-ghost" data-d="h-1">◀ Akrep</button><button class="btn btn-sm btn-ghost" data-d="h1">Akrep ▶</button>
              <button class="btn btn-sm btn-ghost" data-d="m-1">◀ Yelkovan</button><button class="btn btn-sm btn-ghost" data-d="m1">Yelkovan ▶</button>
            </div>
            <button class="btn btn-big btn-good" id="ckcheck">Kontrol Et ✔</button>
            <p class="muted" style="font-size:13px;font-weight:700">İpucu: Yelkovan dakikayı, akrep saati gösterir. Akrep, yelkovan döndükçe yavaşça ilerler.</p>
          </div>
        </div><div id="ckmsg"></div>`;
      bindDrag();
      $$('[data-d]',st).forEach(b=>b.onclick=()=>{
        const d=b.dataset.d,step=LEVELS[S.lv].snap===60?5:Math.min(LEVELS[S.lv].snap,15);
        if(d==='h1') S.h=S.h%12+1; if(d==='h-1') S.h=(S.h+10)%12+1;
        if(d==='m1') setMin(S.m+step); if(d==='m-1') setMin(S.m-step);
        FX.sfx.click();drawFace();
      });
      $('#ckcheck').onclick=checkSet;
    } else {
      const opts=new Map();const key=x=>x.h+':'+x.m;
      opts.set(key(t),t);
      const cands=shuffle([
        {h:(t.m/5)||12,m:(t.h%12)*5}, // akrep ile yelkovanı karıştırma

        {h:t.h%12+1,m:t.m},{h:(t.h+10)%12+1,m:t.m},
        {h:t.h,m:(t.m+30)%60},{h:t.h,m:(t.m+15)%60},{h:t.h,m:(t.m+45)%60},
      ]);
      for(const c of cands){if(c.h<1||c.h>12) continue;if(!LEVELS[S.lv].mins.includes(c.m)&&S.lv!=='five') continue;if(!opts.has(key(c))) opts.set(key(c),c);if(opts.size>=4) break;}
      while(opts.size<4){const c=randTime();opts.set(key(c),c);}
      const list=shuffle([...opts.values()]);
      const phrase=Math.random()<.5;
      st.innerHTML=`<div class="ck-task">Saat kaçı gösteriyor?</div>
        <div class="ck-work"><div class="ck-face">${MathX.clockSVG(t)}</div>
          <div class="ck-side ck-opts">${list.map((o,i)=>`<button class="btn btn-big btn-ghost ck-opt" data-i="${i}">${esc(phrase?MathX.timePhrase(o.h,o.m):MathX.digital(o.h,o.m))}</button>`).join('')}</div>
        </div><div id="ckmsg"></div>`;
      $$('.ck-opt',st).forEach(b=>b.onclick=()=>{
        if(S.locked) return;
        const o=list[+b.dataset.i];
        const ok=o.h===t.h&&o.m===t.m;
        b.classList.add(ok?'btn-good':'btn-danger');b.classList.remove('btn-ghost');
        if(!ok){const ri=list.findIndex(x=>x.h===t.h&&x.m===t.m);const rb=$(`.ck-opt[data-i="${ri}"]`);rb.classList.add('btn-good');rb.classList.remove('btn-ghost');}
        result(ok);
      });
    }
  }
  function setMin(m){
    const old=S.m;m=((m%60)+60)%60;
    if(old>=45&&m<=15&&m!==old) S.h=S.h%12+1;
    if(old<=15&&m>=45&&m!==old) S.h=(S.h+10)%12+1;
    S.m=m;
  }
  function drawFace(){
    const f=$('#ckface');if(!f) return;
    const ha=((S.h%12)+S.m/60)*30,ma=S.m*6;
    $('.hand-h',f).style.transform=`rotate(${ha}deg)`;
    $('.hand-m',f).style.transform=`rotate(${ma}deg)`;
  }
  function bindDrag(){
    const f=$('#ckface');const svg=$('svg',f);
    $('.hand-h',f).classList.add('grab');$('.hand-m',f).classList.add('grab');
    // geniş tutma alanları
    $('.hand-h line',f).setAttribute('stroke-width','10');
    const angleOf=e=>{const r=svg.getBoundingClientRect();const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);let a=Math.atan2(x,-y)*180/Math.PI;return (a+360)%360;};
    svg.addEventListener('pointerdown',e=>{
      if(S.locked) return;
      const r=svg.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
      const dist=Math.hypot(dx,dy)/(r.width/2);
      const a=angleOf(e);
      const ha=((S.h%12)+S.m/60)*30,ma=S.m*6;
      const diff=(x,y)=>{const d=Math.abs(x-y)%360;return Math.min(d,360-d);};
      drag=(dist<.55&&diff(a,ha)<diff(a,ma)+25)?'h':'m';
      svg.setPointerCapture(e.pointerId);move(e);
    });
    const move=e=>{
      if(!drag||S.locked) return;
      const a=angleOf(e);
      if(drag==='m'){const snap=LEVELS[S.lv].snap===60?5:Math.min(LEVELS[S.lv].snap,15);const m=Math.round(a/6/snap)*snap%60;if(m!==S.m){setMin(m);FX.sfx.tick();}}
      else{const h=Math.round((a/30)-S.m/60);const hh=((h%12)+12)%12||12;if(hh!==S.h){S.h=hh;FX.sfx.tick();}}
      drawFace();
    };
    svg.addEventListener('pointermove',move);
    const up=()=>{drag=null;};
    svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  }
  function checkSet(){
    if(S.locked) return;
    const t=S.target,ok=S.h===t.h&&S.m===t.m;
    if(!ok){
      $('#ckmsg').innerHTML=`<div class="orb-msg bad">❌ Senin kurduğun: <b>${MathX.digital(S.h,S.m)}</b> (${esc(MathX.timePhrase(S.h,S.m))}). Doğrusu: <b>${MathX.digital(t.h,t.m)}</b></div>`;
      S.h=t.h;S.m=t.m;setTimeout(drawFace,600);
    }
    result(ok);
  }
  function result(ok){
    S.locked=true;S.res[S.i]=ok;
    const t=S.target;
    if(ok){
      S.correct++;$('#ckscore').textContent=S.correct;
      FX.sfx.correct();FX.celebrate($('#ckstage .ck-face'));
      if(!$('#ckmsg').innerHTML) $('#ckmsg').innerHTML=`<div class="orb-msg good">✅ ${MathX.digital(t.h,t.m)} — ${esc(MathX.timePhrase(t.h,t.m))}</div>`;
    } else {
      FX.sfx.wrong();FX.shake($('#ckstage'));
      if(!$('#ckmsg').innerHTML) $('#ckmsg').innerHTML=`<div class="orb-msg bad">❌ Doğrusu: <b>${MathX.digital(t.h,t.m)}</b> — ${esc(MathX.timePhrase(t.h,t.m))}</div>`;
    }
    dots();
    const nb=document.createElement('div');nb.style.cssText='text-align:center;margin-top:12px';
    nb.innerHTML=`<button class="btn btn-big btn-primary" id="cknext">${S.i>=TOTAL-1?'Sonuçlar 🏁':'Devam ▶'}</button>`;
    $('#ckmsg').appendChild(nb);
    $('#cknext').onclick=()=>{FX.sfx.click();if(S.i>=TOTAL-1) return finish();S.i++;question();};
  }
  function finish(){
    const {correct,lv,app}=S;
    const stars=correct>=9?3:correct>=7?2:correct>=5?1:0;
    const res=Game.finishArcade('saat_'+lv,{score:correct,xp:correct*4+stars*5,badge:correct===TOTAL?'clock10':null});
    stars?FX.sfx.win():FX.sfx.lose();if(stars>=2) FX.confetti(150);
    UI.modal({title:'⏰ Tur bitti!',dismiss:false,html:`<div style="text-align:center">
      <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<stars?'on':''}">⭐</span>`).join('')}</div>
      <div class="big-score">${correct} / ${TOTAL}</div><p class="muted">${res.newBest?'🎉 YENİ REKOR!':'En iyi: '+res.best+' / '+TOTAL}</p></div>`,
      buttons:[{label:'Seviye seç',cls:'btn-ghost',onClick:()=>mount(app)},{label:'🔁 Tekrar',cls:'btn-good',onClick:()=>start(app,lv)}]});
  }
  function unmount(){S=null;drag=null;}
  return {mount,unmount};
})();

</script>
<script>
/* js/m-graph.js */
'use strict';
/* =========================================================
   Grafik Nişancısı — doğrusal ve ikinci dereceden fonksiyonlar
   Katsayıları ayarla, "Ateş!" de; top eğri boyunca uçup yıldızları toplasın.
   ========================================================= */
const MGraph = (()=>{
  const LEVELS=[
    {t:'lin',p:{m:1,n:2},xs:[-4,0,3],preview:true,tip:'n, doğrunun y eksenini kestiği noktadır.'},
    {t:'lin',p:{m:2,n:-1},xs:[-2,1,3],preview:true,tip:'m eğimdir: x 1 artınca y, m kadar değişir.'},
    {t:'lin',p:{m:-1,n:3},xs:[-3,1,5],preview:true,tip:'Negatif eğimli doğru soldan sağa alçalır.'},
    {t:'lin',p:{m:0.5,n:-2},xs:[-4,0,6],preview:false,tip:'Uzman: önizleme yok! Yıldızlardan eğimi hesapla.'},
    {t:'lin',p:{m:-2,n:4},xs:[0,1,4],preview:false,tip:'İki yıldız arasındaki Δy / Δx = eğim.'},
    {t:'lin',p:{m:-0.5,n:1},xs:[-6,2,8],preview:false,tip:'Kesirli eğim: x 2 artınca y 1 azalıyor mu?'},
    {t:'quad',p:{a:1,h:0,k:-4},xs:[-2,0,2],preview:true,tip:'(h, k) tepe noktasıdır.'},
    {t:'quad',p:{a:1,h:2,k:-3},xs:[0,2,4],preview:true,tip:'h, parabolü sağa-sola kaydırır.'},
    {t:'quad',p:{a:-1,h:-1,k:5},xs:[-3,-1,1],preview:true,tip:'a < 0 ise kollar aşağı bakar.'},
    {t:'quad',p:{a:0.5,h:3,k:-4},xs:[-1,3,7],preview:false,tip:'Uzman: |a| küçüldükçe parabol genişler.'},
    {t:'quad',p:{a:2,h:-2,k:-6},xs:[-4,-2,0],preview:false,tip:'Tepe noktasındaki yıldızı bul, sonra a\'yı hesapla.'},
    {t:'quad',p:{a:-0.5,h:1,k:6},xs:[-3,1,5],preview:false,tip:'Simetri eksenine dikkat: x = h.'},
  ];
  const PAR={
    lin:{keys:['m','n'],start:{m:1,n:0},step:{m:.5,n:1},min:{m:-5,n:-10},max:{m:5,n:10},name:{m:'m (eğim)',n:'n (y-kesişimi)'}},
    quad:{keys:['a','h','k'],start:{a:1,h:0,k:0},step:{a:.5,h:1,k:1},min:{a:-3,h:-10,k:-10},max:{a:3,h:10,k:10},name:{a:'a (açıklık)',h:'h (tepe x)',k:'k (tepe y)'}},
  };
  const RANGE=10,SZ=520,PAD=20,W=SZ-2*PAD;
  const X=x=>PAD+(x+RANGE)/(2*RANGE)*W, Y=y=>PAD+(RANGE-y)/(2*RANGE)*W;
  const f=(t,p)=>t==='lin'?(x=>p.m*x+p.n):(x=>p.a*(x-p.h)*(x-p.h)+p.k);
  let S=null,raf=null;

  function eqText(t,p){
    const N=MathX.num;
    const sg=(v,first)=>v<0?(first?'−':' − ')+N(Math.abs(v)):(first?N(v):' + '+N(v));
    if(t==='lin'){
      let s='y = ';
      if(p.m===0) s+=N(p.n);
      else{s+=(p.m===1?'':p.m===-1?'−':N(p.m))+'x';if(p.n) s+=sg(p.n,false);}
      return s;
    }
    let s='y = '+(p.a===1?'':p.a===-1?'−':N(p.a));
    s+=p.h===0?'x²':`(x${p.h>0?' − '+N(p.h):' + '+N(-p.h)})²`;
    if(p.k) s+=sg(p.k,false);
    return s;
  }
  function mount(app,startIdx){
    const stars=Game.levelStars('graph');
    let idx=startIdx??LEVELS.findIndex((_,i)=>!stars['g'+i]);if(idx<0) idx=0;
    const L=LEVELS[idx];
    S={app,idx,L,p:{...PAR[L.t].start},tries:0,firing:false,done:false};
    if(L.t==='lin'&&idx===0) S.p={m:1,n:0};
    app.innerHTML=`<section class="screen graph">
      <div class="bal-top">
        <div><h1 class="screen-title">📈 Grafik Nişancısı</h1><p class="sub" style="margin:0">Katsayıları ayarla ve <b>Ateş!</b> de. Top eğrinin üzerinde uçar: tüm yıldızları tek atışta topla!</p></div>
        <div class="level-chips">${LEVELS.map((l,k)=>{const s=stars['g'+k]||0;return `<button class="lvl ${k===idx?'active':''} ${s?'done':''} ${l.preview?'':'bonus'}" data-k="${k}" title="${l.t==='lin'?'Doğrusal':'İkinci derece'}${l.preview?'':' · Uzman'}">${k+1}<small>${s?'★'.repeat(s):l.t==='lin'?'╱':'∪'}</small></button>`;}).join('')}</div>
      </div>
      <div class="gr-layout">
        <div class="panel gr-board"><svg viewBox="0 0 ${SZ} ${SZ}" id="grsvg" class="gr-svg"></svg></div>
        <div class="gr-side">
          <div class="panel">
            <div class="gr-type">${L.t==='lin'?'Doğrusal fonksiyon · 9. sınıf':'İkinci dereceden fonksiyon · 10–11. sınıf'} ${L.preview?'':'<span class="tag diff">🔥 UZMAN</span>'}</div>
            <div class="gr-eq" id="greq"></div>
            <div id="grctl"></div>
            <div class="btn-row" style="margin-top:14px"><button class="btn btn-big btn-danger" id="grfire">🎯 Ateş!</button><button class="btn btn-ghost" id="grreset">↺</button></div>
            <div class="orb-msg" id="grmsg">💡 ${esc(L.tip)}</div>
          </div>
          <div class="panel law-box" style="margin-top:14px">${L.t==='lin'
            ?'<b>y = m·x + n</b><br>• <b>m</b>: eğim — x 1 birim artınca y\'nin değişimi<br>• <b>n</b>: doğrunun y eksenini kestiği nokta (0, n)'
            :'<b>y = a(x − h)² + k</b><br>• <b>(h, k)</b>: tepe noktası<br>• <b>a > 0</b> kollar yukarı, <b>a < 0</b> kollar aşağı<br>• |a| büyüdükçe parabol daralır'}</div>
        </div>
      </div>
    </section>`;
    $$('.lvl',app).forEach(b=>b.onclick=()=>{FX.sfx.click();cleanup();mount(app,+b.dataset.k);});
    $('#grfire').onclick=fire;
    $('#grreset').onclick=()=>{if(S.firing) return;S.p={...PAR[L.t].start};FX.sfx.down();update();};
    buildCtl();update();
  }
  function buildCtl(){
    const P=PAR[S.L.t];
    $('#grctl').innerHTML=P.keys.map(k=>`<div class="gr-par"><span class="gr-pn">${P.name[k]}</span>
      <button class="pbtn minus" data-k="${k}" data-d="-1">−</button><span class="pval gr-val" id="gv-${k}"></span><button class="pbtn plus" data-k="${k}" data-d="1">+</button></div>`).join('');
    $$('#grctl .pbtn').forEach(b=>b.onclick=()=>{
      if(S.firing||S.done) return;
      const k=b.dataset.k,d=+b.dataset.d;
      let v=Math.round((S.p[k]+d*P.step[k])*2)/2;
      v=clamp(v,P.min[k],P.max[k]);
      if(k==='a'&&v===0) v=d>0?P.step.a:-P.step.a;
      S.p[k]=v;d>0?FX.sfx.up():FX.sfx.down();update();
    });
  }
  function update(){
    const P=PAR[S.L.t];
    P.keys.forEach(k=>{$('#gv-'+k).textContent=MathX.num(S.p[k]);});
    $('#greq').textContent=eqText(S.L.t,S.p);
    draw();
  }
  function stars(){const g=f(S.L.t,S.L.p);return S.L.xs.map(x=>({x,y:g(x)}));}
  function onCurve(st){return Math.abs(f(S.L.t,S.p)(st.x)-st.y)<1e-9;}
  function draw(ball,collected=new Set(),trail=''){
    let s=`<rect x="0" y="0" width="${SZ}" height="${SZ}" rx="12" style="fill:var(--sv-panel)"/>`;
    for(let i=-RANGE;i<=RANGE;i++){s+=`<line x1="${X(i)}" y1="${PAD}" x2="${X(i)}" y2="${SZ-PAD}" style="stroke:var(--sv-ink)" stroke-opacity="${i%5?'.08':'.2'}"/><line x1="${PAD}" y1="${Y(i)}" x2="${SZ-PAD}" y2="${Y(i)}" style="stroke:var(--sv-ink)" stroke-opacity="${i%5?'.08':'.2'}"/>`;}
    s+=`<line x1="${PAD}" y1="${Y(0)}" x2="${SZ-PAD}" y2="${Y(0)}" style="stroke:var(--sv-ink)" stroke-opacity=".85" stroke-width="2"/><line x1="${X(0)}" y1="${PAD}" x2="${X(0)}" y2="${SZ-PAD}" style="stroke:var(--sv-ink)" stroke-opacity=".85" stroke-width="2"/>`;
    for(let i=-RANGE;i<=RANGE;i+=2){if(!i) continue;s+=`<text x="${X(i)}" y="${Y(0)+16}" text-anchor="middle" font-size="12" style="fill:var(--sv-ink)" fill-opacity=".75" font-family="Nunito" font-weight="800">${MathX.num(i)}</text><text x="${X(0)-6}" y="${Y(i)+4}" text-anchor="end" font-size="12" style="fill:var(--sv-ink)" fill-opacity=".75" font-family="Nunito" font-weight="800">${MathX.num(i)}</text>`;}
    const g=f(S.L.t,S.p);
    if(S.L.preview||S.done){
      let d='',pen=false;
      for(let i=0;i<=400;i++){const x=-RANGE+i*2*RANGE/400,y=g(x);if(Math.abs(y)>RANGE*3){pen=false;continue;}d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true;}
      s+=`<clipPath id="grclip"><rect x="${PAD}" y="${PAD}" width="${W}" height="${W}"/></clipPath><path d="${d}" clip-path="url(#grclip)" fill="none" style="stroke:var(--sv-line)" stroke-width="3" stroke-dasharray="${S.done?'0':'8 7'}" opacity="${S.done?1:.75}"/>`;
    }
    if(trail) s+=`<path d="${trail}" clip-path="url(#grclip2)" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity=".85"/><clipPath id="grclip2"><rect x="${PAD}" y="${PAD}" width="${W}" height="${W}"/></clipPath>`;
    stars().forEach((st,i)=>{
      const got=collected.has(i),hint=S.L.preview&&onCurve(st);
      s+=`<g transform="translate(${X(st.x)} ${Y(st.y)})">${got?'':`<circle r="18" fill="${hint?'rgba(74,222,128,.25)':'rgba(251,191,36,.15)'}"/>`}
        <text y="9" text-anchor="middle" font-size="${got?16:26}" opacity="${got?.35:1}">⭐</text>
        <text y="34" text-anchor="middle" font-size="11" style="fill:var(--sv-ink)" font-family="Nunito" font-weight="800">(${MathX.num(st.x)}, ${MathX.num(st.y)})</text></g>`;
    });
    if(ball) s+=`<circle cx="${ball[0]}" cy="${ball[1]}" r="11" fill="#fbbf24" stroke="#fff" stroke-width="3"><animate attributeName="r" values="10;13;10" dur=".3s" repeatCount="indefinite"/></circle>`;
    $('#grsvg').innerHTML=s;
  }
  function fire(){
    if(S.firing||S.done) return;
    S.firing=true;S.tries++;FX.sfx.pop();
    const g=f(S.L.t,S.p),sts=stars(),collected=new Set();
    const t0=performance.now(),dur=2200;let trail='',pen=false;
    const step=t=>{
      if(!S) return;
      const k=Math.min(1,(t-t0)/dur);const x=-RANGE+k*2*RANGE,y=g(x);
      const inside=Math.abs(y)<=RANGE*1.2;
      if(inside){trail+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true;}else pen=false;
      sts.forEach((st,i)=>{if(!collected.has(i)&&x>=st.x&&Math.abs(g(st.x)-st.y)<1e-9){collected.add(i);FX.sfx.correct();const r=$('#grsvg').getBoundingClientRect();FX.burst(r.left+X(st.x)/SZ*r.width,r.top+Y(st.y)/SZ*r.height,26,['#fbbf24','#fde68a','#fff'],{shape:'star',size:9});}});
      draw(inside?[X(x),Y(y)]:null,collected,trail);
      if(k<1) raf=requestAnimationFrame(step); else land(collected.size,sts.length);
    };
    raf=requestAnimationFrame(step);
  }
  function land(got,total){
    S.firing=false;
    if(got===total){
      S.done=true;draw(null,new Set(stars().map((_,i)=>i)));
      const st=S.tries===1?3:S.tries===2?2:1;
      FX.sfx.win();FX.confetti(140);FX.banner('TAM İSABET!','good','small');
      const res=Game.finishLevel('graph','g'+S.idx,st,LEVELS.length,'graph5','graphAll');
      setTimeout(()=>{if(!S) return;UI.modal({title:'🎯 Tüm yıldızlar toplandı!',html:`<div style="text-align:center">
        <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<st?'on':''}">⭐</span>`).join('')}</div>
        <div class="gr-eq" style="margin:10px auto">${esc(eqText(S.L.t,S.p))}</div>
        <p class="muted">Atış sayısı: ${S.tries} · <b style="color:var(--gold)">+${res.xp} XP</b></p></div>`,
        buttons:[{label:'↺ Tekrar',cls:'btn-ghost',onClick:()=>{const a=S.app,i=S.idx;cleanup();mount(a,i);}},{label:'Sonraki ▶',cls:'btn-good',onClick:()=>{const a=S.app,i=(S.idx+1)%LEVELS.length;cleanup();mount(a,i);}}]});},900);
    } else {
      FX.sfx.wrong();
      const m=$('#grmsg');m.className='orb-msg bad';
      m.innerHTML=`❌ ${got}/${total} yıldız toplandı. Katsayıları değiştirip tekrar dene! <span class="muted">(Atış: ${S.tries})</span>`;
      if(S.tries>=3&&!S.L.preview){m.innerHTML+='<br>💡 İpucu: Yıldızların koordinatlarını denklemde yerine koymayı dene.';}
    }
  }
  function cleanup(){cancelAnimationFrame(raf);}
  function unmount(){cleanup();S=null;}
  return {mount,unmount,LEVELS};
})();

</script>
<script>
/* js/m-equation.js */
'use strict';
/* =========================================================
   Denklem Terazisi — birinci dereceden denklemler (9. sınıf)
   ax + b = cx + d ; iki tarafa aynı işlemi uygula, x'i yalnız bırak.
   ========================================================= */
const MEquation = (()=>{
  const LEVELS=[
    [1,5,0,12],[1,-3,0,7],[3,0,0,18],[2,3,0,11],[5,-4,0,21],
    [3,2,1,10],[4,-5,2,7],[-2,9,0,3],[6,1,4,9],[2,-7,5,-16],
  ];
  let S=null;
  const N=v=>MathX.num(v);

  function eqStr(e){
    const side=(x,c)=>{
      let s='';
      if(x){s=(x===1?'':x===-1?'−':N(x))+'x';}
      if(c){s+=s?(c<0?' − '+N(-c):' + '+N(c)):N(c);}
      return s||'0';
    };
    return side(e[0],e[1])+' = '+side(e[2],e[3]);
  }
  function optimal(e){const [a,b,c,d]=e;return (c!==0?1:0)+(b!==0?1:0)+((a-c)!==1?1:0);}
  function solved(e){const [a,b,c,d]=e;return (a===1&&b===0&&c===0)||(c===1&&d===0&&a===0);}

  function mount(app,startIdx){
    const stars=Game.levelStars('eq');
    let idx=startIdx??LEVELS.findIndex((_,i)=>!stars['e'+i]);if(idx<0) idx=0;
    S={app,idx,e:LEVELS[idx].slice(),hist:[],op:'-',val:1,term:'n',done:false};
    app.innerHTML=`<section class="screen equation">
      <div class="bal-top">
        <div><h1 class="screen-title">⚖️ Denklem Terazisi</h1><p class="sub" style="margin:0">Terazi dengede: iki kefeye <b>aynı işlemi</b> uygula ve <b>x</b>'i tek başına bırak!</p></div>
        <div class="level-chips">${LEVELS.map((l,k)=>{const s=stars['e'+k]||0;return `<button class="lvl ${k===idx?'active':''} ${s?'done':''}" data-k="${k}">${k+1}<small>${s?'★'.repeat(s):''}</small></button>`;}).join('')}</div>
      </div>
      <div class="panel eq-stage" id="eqstage">
        <div class="eq-big" id="eqbig"></div>
        <div id="eqscale"></div>
      </div>
      <div class="eq-layout">
        <div class="panel">
          <h3>🛠️ İki tarafa uygula</h3>
          <div class="eq-ops">${['+','-','×','÷'].map(o=>`<button class="eq-op-btn" data-op="${o}">${o==='-'?'−':o}</button>`).join('')}</div>
          <div class="eq-val"><button class="pbtn minus" id="vminus">−</button><span class="pval" id="vval">1</span><button class="pbtn plus" id="vplus">+</button>
            <div class="eq-term"><button data-t="n" class="spin-btn">sayı</button><button data-t="x" class="spin-btn">x</button></div></div>
          <div class="eq-preview" id="eqprev"></div>
          <div class="btn-row"><button class="btn btn-big btn-good" id="eqapply">Uygula ⚖️</button><button class="btn btn-ghost" id="equndo">↶ Geri al</button><button class="btn btn-gold" id="eqhint">💡 İpucu</button></div>
          <div class="orb-msg" id="eqmsg">x'i yalnız bırakmak için önce x'li terimleri bir tarafta, sayıları diğer tarafta topla.</div>
        </div>
        <div class="panel"><h3>📜 Adımlar</h3><ol class="eq-steps" id="eqsteps"></ol></div>
      </div>
    </section>`;
    $$('.lvl',app).forEach(b=>b.onclick=()=>{FX.sfx.click();mount(app,+b.dataset.k);});
    $$('.eq-op-btn',app).forEach(b=>b.onclick=()=>{S.op=b.dataset.op;if(S.op==='×'||S.op==='÷') S.term='n';FX.sfx.click();sync();});
    $$('.eq-term button',app).forEach(b=>b.onclick=()=>{if(S.op==='×'||S.op==='÷') return;S.term=b.dataset.t;FX.sfx.click();sync();});
    $('#vminus').onclick=()=>{S.val=S.val-1||(-1);if(S.val<-20) S.val=-20;FX.sfx.down();sync();};
    $('#vplus').onclick=()=>{S.val=S.val+1||1;if(S.val>20) S.val=20;FX.sfx.up();sync();};
    $('#eqapply').onclick=apply;
    $('#equndo').onclick=undo;
    $('#eqhint').onclick=hint;
    render();sync();
  }
  function opText(op,val,term){
    const v=(term==='x'?(val===1?'':val===-1?'−':N(val))+'x':N(val));
    return {'+':`Her iki tarafa ${v} ekle`,'-':`Her iki taraftan ${v} çıkar`,'×':`Her iki tarafı ${N(val)} ile çarp`,'÷':`Her iki tarafı ${N(val)}'${dat(val)} böl`}[op];
  }
  function dat(n){ // Türkçe yönelme eki: 2'ye, 3'e, 6'ya, 10'a, 20'ye
    n=Math.abs(n);const u=n%10,t=Math.floor(n/10)%10;
    if(u) return ['','e','ye','e','e','e','ya','ye','e','a'][u];
    return ['a','a','ye','a','a','ye','a','e','e','a'][t];
  }
  function sync(){
    $$('.eq-op-btn').forEach(b=>b.classList.toggle('active',b.dataset.op===S.op));
    $$('.eq-term button').forEach(b=>{b.classList.toggle('active',b.dataset.t===S.term);b.disabled=(S.op==='×'||S.op==='÷')&&b.dataset.t==='x';});
    $('#vval').textContent=N(S.val);
    $('#eqprev').textContent='➜ '+opText(S.op,S.val,S.term);
  }
  function blocks(x,c){
    const out=[];
    const add=(cls,label,n)=>{
      if(n<=12) for(let i=0;i<n;i++) out.push(`<span class="eb ${cls}">${label}</span>`);
      else out.push(`<span class="eb ${cls} many">${label}<small>×${n}</small></span>`);
    };
    add(x>0?'bx':'bnx',x>0?'x':'−x',Math.abs(x));
    add(c>0?'b1':'bn1',c>0?'1':'−1',Math.abs(c));
    return out.join('')||'<span class="eb empty">0</span>';
  }
  function render(anim){
    const e=S.e;
    $('#eqbig').innerHTML=MathX.format(eqStr(e));
    $('#eqscale').innerHTML=`<div class="eq-scale ${anim?'wobble':''}">
      <div class="eq-beam"></div><div class="eq-pivot">▲</div>
      <div class="eq-pan left"><div class="eq-blocks">${blocks(e[0],e[1])}</div><div class="eq-plate"></div><span class="eq-side">SOL</span></div>
      <div class="eq-pan right"><div class="eq-blocks">${blocks(e[2],e[3])}</div><div class="eq-plate"></div><span class="eq-side">SAĞ</span></div>
    </div>`;
    $('#eqsteps').innerHTML=`<li class="muted">${MathX.format(eqStr(LEVELS[S.idx]))}</li>`+S.hist.map(h=>`<li><span class="muted">${esc(h.txt)}</span><br>${MathX.format(eqStr(h.after))}</li>`).join('');
  }
  function apply(){
    if(S.done) return;
    const [a,b,c,d]=S.e,v=S.val,op=S.op;let n;
    if(op==='+'||op==='-'){
      const s=op==='+'?v:-v;
      n=S.term==='x'?[a+s,b,c+s,d]:[a,b+s,c,d+s];
    } else if(op==='×'){
      n=[a*v,b*v,c*v,d*v];
    } else {
      if([a,b,c,d].some(t=>t%v!==0)) return msg(`⚠️ ${N(v)}'e bölünce kesirli sayılar çıkar. Bu oyunda tam sayılarla kal: önce başka bir işlem dene.`,'warn');
      n=[a/v,b/v,c/v,d/v].map(t=>t===0?0:t);
    }
    if(n[0]===0&&n[2]===0) return msg('⚠️ Bu işlemle x tamamen kaybolur! Başka bir işlem seç.','warn');
    S.hist.push({before:S.e,after:n,txt:opText(op,v,S.term)});
    S.e=n;FX.sfx.pop();render(true);
    if(solved(n)){
      S.done=true;
      const x=n[0]===1?n[3]:n[1];
      const steps=S.hist.length,opt=optimal(LEVELS[S.idx]);
      const st=steps<=opt?3:steps<=opt+2?2:1;
      FX.sfx.win();FX.confetti(140);FX.banner('x = '+N(x),'good');
      const [a0,b0,c0,d0]=LEVELS[S.idx];
      const check=`${N(a0*x+b0)} = ${N(c0*x+d0)}`;
      const res=Game.finishLevel('eq','e'+S.idx,st,LEVELS.length,'eq5','eqAll');
      msg(`✅ Çözüm: x = ${N(x)}. Sağlama: x yerine ${N(x)} yazarsak ${check} ✓`,'good');
      setTimeout(()=>{if(!S) return;UI.modal({title:'⚖️ x yalnız kaldı!',html:`<div style="text-align:center">
        <div class="stars" style="font-size:56px">${[0,1,2].map(i=>`<span class="star ${i<st?'on':''}">⭐</span>`).join('')}</div>
        <div class="eq-big">${MathX.format('x = '+N(x))}</div>
        <p>Sağlama: ${MathX.format(eqStr(LEVELS[S.idx]).replace(/x/g,'('+N(x)+')'))} → ${check} ✓</p>
        <p class="muted">Adım: ${steps} (en kısa: ${opt}) · <b style="color:var(--gold)">+${res.xp} XP</b></p></div>`,
        buttons:[{label:'↺ Tekrar',cls:'btn-ghost',onClick:()=>mount(S.app,S.idx)},{label:'Sonraki ▶',cls:'btn-good',onClick:()=>mount(S.app,(S.idx+1)%LEVELS.length)}]});},1000);
    } else msg('✓ Terazi hâlâ dengede. Devam et!','good');
  }
  function undo(){
    if(S.done||!S.hist.length) return;
    S.e=S.hist.pop().before;FX.sfx.down();render(true);msg('↶ Son adım geri alındı.','');
  }
  function hint(){
    if(S.done) return;
    const [a,b,c,d]=S.e;
    let op,val,term;
    if(c!==0&&a!==0){op=c>0?'-':'+';val=Math.abs(c);term='x';}
    else if(a!==0&&b!==0){op=b>0?'-':'+';val=Math.abs(b);term='n';}
    else if(c!==0&&d!==0){op=d>0?'-':'+';val=Math.abs(d);term='n';}
    else {op='÷';val=a!==0?a:c;term='n';}
    S.op=op;S.val=val;S.term=term;sync();FX.sfx.pop();
    msg('💡 Öneri: '+opText(op,val,term)+'. "Uygula"ya bas.','warn');
  }
  function msg(h,k){const m=$('#eqmsg');m.className='orb-msg '+k;m.innerHTML=h;if(k==='warn') FX.sfx.down();}
  function unmount(){S=null;}
  return {mount,unmount,LEVELS};
})();

</script>
<script>
/* js/admin.js */
'use strict';
/* =========================================================
   Öğretmen Paneli — soru, şık, denklem yönetimi ve yedekleme
   ========================================================= */
const Admin = (()=>{
  let app=null,tab='q',draft=null,editIdx=-1,filter={text:'',topic:''},pvTimer=null;
  const OPT_TYPES={text:'📝 Metin / Formül',emoji:'😀 Emoji + etiket',image:'🖼️ Resim',atom:'⚛️ Atom modeli',particles:'🔵 Tanecik modeli',orbital:'🌀 Orbital diyagramı',ghs:'⚠️ Güvenlik işareti',fraction:'🍕 Kesir modeli',clock:'⏰ Analog saat',graph:'📈 Fonksiyon grafiği',shape:'🔷 Geometrik şekil',count:'🍎 Sayma nesneleri'};
  let memAuth=false;
  const isAuthed=()=>{if(memAuth) return true;try{return sessionStorage.getItem('ko_admin')==='1';}catch(e){return false;}};

  function mount(a){
    app=a;
    if(!isAuthed()) return login();
    shell();
  }
  function login(){
    app.innerHTML=`<section class="screen"><div class="panel login-box">
      <div style="font-size:60px">🔐</div><h2>Öğretmen Paneli</h2>
      <p class="muted">Devam etmek için PIN kodunu girin.</p>
      <input class="inp" id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="••••">
      <div style="margin-top:14px"><button class="btn btn-big btn-primary" id="enter">Giriş ▶</button></div>
      <p class="muted" style="font-size:12px;margin-top:16px">İlk kurulum PIN'i <b>1234</b>'tür. Giriş yaptıktan sonra “Ayarlar” sekmesinden değiştirin.</p>
    </div></section>`;
    const go=()=>{
      if($('#pin').value===Store.settings().pin){memAuth=true;try{sessionStorage.setItem('ko_admin','1');}catch(e){}FX.sfx.correct();shell();}
      else{FX.sfx.wrong();FX.shake($('.login-box'));$('#pin').value='';}
    };
    $('#enter').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter') go();};
    $('#pin').focus();
  }
  function shell(){
    app.innerHTML=`<section class="screen admin">
      <div class="admin-head"><h1 class="screen-title" style="margin:0">🛠️ Öğretmen Paneli</h1>
        <select class="inp" id="asubj" style="width:auto">${Object.values(SUBJECTS).map(x=>`<option value="${x.id}" ${x.id===App.subject().id?'selected':''}>${x.icon} ${x.name}</option>`).join('')}</select>
        <div class="tabs"><button class="tab" data-t="q">📝 Sorular</button>${App.subject().id==='kimya'?'<button class="tab" data-t="eq">⚖️ Denklemler</button>':''}<button class="tab" data-t="set">⚙️ Ayarlar & Yedek</button></div>
        <button class="btn btn-sm btn-ghost" id="logout">🔒 Çıkış</button></div>
      <div id="abody"></div></section>`;
    $$('.tab',app).forEach(b=>b.onclick=()=>{tab=b.dataset.t;draft=null;renderTab();});
    $('#asubj').onchange=e=>{App.setSubject(e.target.value);draft=null;filter.topic='';if(tab==='eq') tab='q';shell();};
    $('#logout').onclick=()=>{memAuth=false;try{sessionStorage.removeItem('ko_admin');}catch(e){}Router.nav('menu');};
    renderTab();
  }
  function renderTab(){
    $$('.tab',app).forEach(b=>b.classList.toggle('active',b.dataset.t===tab));
    if(tab==='q') draft?renderEditor():renderList();
    else if(tab==='eq') renderEquations();
    else renderSettings();
  }

  /* ---------------- Soru listesi ---------------- */
  function renderList(){
    const S=App.subject();
    const qs=Store.questions();
    const topics=[...new Set(qs.filter(q=>subjOf(q)===S.id).map(q=>q.topic))];
    const body=$('#abody');
    body.innerHTML=`<div class="toolbar">
        <input class="inp" id="fq" placeholder="🔍 Soru ara..." value="${esc(filter.text)}">
        <select class="inp" id="ft" style="max-width:280px"><option value="">Tüm konular</option>${topics.map(t=>`<option ${t===filter.topic?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <button class="btn btn-good" id="newq">➕ Yeni Soru</button>
      </div>
      <div class="muted" style="font-weight:800;margin-bottom:10px" id="qcount"></div>
      <div id="qlist"></div>`;
    const draw=()=>{
      const t=filter.text.toLocaleLowerCase('tr');
      const list=qs.map((q,i)=>({q,i})).filter(({q})=>subjOf(q)===S.id&&(!filter.topic||q.topic===filter.topic)&&(!t||(q.text+' '+q.topic).toLocaleLowerCase('tr').includes(t)));
      $('#qcount').textContent=`${S.icon} ${S.name}: ${list.length} / ${qs.filter(q=>subjOf(q)===S.id).length} soru`;
      $('#qlist').innerHTML=list.map(({q,i})=>`<div class="q-row">
        <div class="num">${i+1}</div>
        <div><div class="qt">${richText(q.text)}</div>
          <div class="qi"><span class="tag">${topicIcon(q.topic)} ${esc(q.topic)}</span><span class="tag">${q.grade}. sınıf</span><span class="tag diff">${'★'.repeat(q.difficulty||1)}</span>
          <span class="muted" style="font-size:12px;font-weight:800">${q.options.map((o,k)=>`<span style="${k===q.answer?'color:#4ade80':''}">${LETTERS[k]}:${(OPT_TYPES[o.type]||'').split(' ')[0]}</span>`).join(' ')}</span></div></div>
        <div class="acts">
          <button class="btn btn-sm btn-cyan" data-a="pv" data-i="${i}" title="Önizle">👁️</button>
          <button class="btn btn-sm btn-primary" data-a="ed" data-i="${i}" title="Düzenle">✏️</button>
          <button class="btn btn-sm btn-ghost" data-a="cp" data-i="${i}" title="Kopyala">⧉</button>
          <button class="btn btn-sm btn-danger" data-a="rm" data-i="${i}" title="Sil">🗑️</button>
        </div></div>`).join('')||'<div class="panel muted">Soru bulunamadı.</div>';
    };
    draw();
    $('#fq').oninput=e=>{filter.text=e.target.value;draw();};
    $('#ft').onchange=e=>{filter.topic=e.target.value;draw();};
    $('#newq').onclick=()=>{draft=blankQuestion();editIdx=-1;renderEditor();};
    $('#qlist').onclick=e=>{
      const b=e.target.closest('[data-a]');if(!b) return;
      const i=+b.dataset.i;const all=Store.questions();
      if(b.dataset.a==='pv') Quiz.preview(all[i]);
      if(b.dataset.a==='ed'){draft=Store.clone(all[i]);editIdx=i;renderEditor();}
      if(b.dataset.a==='cp'){const c=Store.clone(all[i]);c.id=uid();all.splice(i+1,0,c);Store.saveQuestions(all);UI.toast('Soru kopyalandı.','good');renderList();}
      if(b.dataset.a==='rm') UI.confirm(`${i+1}. soru silinecek. Bu işlem geri alınamaz.`,()=>{all.splice(i,1);Store.saveQuestions(all);UI.toast('Soru silindi.','good');renderList();},{yes:'Sil',danger:true});
    };
  }
  function blankQuestion(){
    const S=App.subject();
    return {id:uid(),subject:S.id,topic:filter.topic||S.topics()[0],grade:S.grades[0],difficulty:1,text:'',stem:{type:'none'},image:'',
      options:[{type:'text',value:'',label:''},{type:'text',value:'',label:''},{type:'text',value:'',label:''},{type:'text',value:'',label:''},{type:'text',value:'',label:''}],
      answer:0,hint:'',explanation:''};
  }

  /* ---------------- Soru editörü ---------------- */
  function renderEditor(){
    const q=draft;
    if(!q.stem) q.stem={type:'none'};
    const S=App.subject();
    const topics=[...new Set([...S.topics(),...Store.questions().filter(x=>subjOf(x)===S.id).map(x=>x.topic)])];
    $('#abody').innerHTML=`<div class="editor">
      <div class="panel">
        <h3>${editIdx>=0?'✏️ Soruyu düzenle (#'+(editIdx+1)+')':'➕ Yeni soru'}</h3>
        <div class="f3">
          <div class="field"><label>Konu / Ünite</label><input class="inp" list="topiclist" data-k="topic" value="${esc(q.topic)}"><datalist id="topiclist">${topics.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
          <div class="field"><label>Sınıf</label><select class="inp" data-k="grade" data-num>${S.grades.map(g=>`<option value="${g}" ${+q.grade===g?'selected':''}>${g}. sınıf</option>`).join('')}</select></div>
          <div class="field"><label>Zorluk</label><select class="inp" data-k="difficulty" data-num>${[1,2,3].map(d=>`<option value="${d}" ${+q.difficulty===d?'selected':''}>${'★'.repeat(d)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Soru metni</label><textarea class="inp" data-k="text" rows="3" placeholder="Örn: {N2 + 3H2 -> 2NH3} tepkimesine göre...">${esc(q.text)}</textarea>
          <span class="help">Kimya formülü: {H2O} → H₂O · {Na^+} → Na⁺ · {^14_6C} izotop. Matematik: $3/4$ → kesir · $x^2$ → üs · $sqrt(2)$ → kök · $<=$ → ≤ · **kalın** yazı</span></div>
        <div class="field"><label>Soru kökü görseli (isteğe bağlı)</label>
          <div class="opt-editor" id="stemed">${optionEditor(q.stem,'stem',true)}</div>
        </div>
